<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labeling Practice</title>
<style>
:root{--bg:#fbfaf7;--fg:#1f1d1a;--muted:#6b665e;--line:#e2ddd3;--card:#ffffff;--accent:#2f5d8a;--accent-weak:#e8eef5;--ok:#2e6b3f;--warn:#9a5b13}
@media (prefers-color-scheme: dark){:root{--bg:#191816;--fg:#ece8e1;--muted:#a39d93;--line:#38342e;--card:#22201d;--accent:#8db4dc;--accent-weak:#25303b;--ok:#7fc495;--warn:#e0a35a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 12px 0 0}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit;font-size:13px}
nav button.cur{border-color:var(--accent);background:var(--accent-weak)}
nav button.done::after{content:" \2713";color:var(--ok)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
ul.items{list-style:none;padding:0;margin:0}ul.items li{padding:5px 0;border-top:1px solid var(--line)}ul.items li:first-child{border-top:0}
code.id{font-size:12px;color:var(--accent);background:var(--accent-weak);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.para{margin:8px 0;white-space:pre-line}
.crit{border-top:1px solid var(--line);padding:10px 0}
.crit:first-of-type{border-top:0}
.crit .name{font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.opts label{display:flex;gap:5px;align-items:center;font-size:14px}
details{margin-top:4px}summary{cursor:pointer;color:var(--muted);font-size:13px}
.ev{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ev label{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;display:flex;gap:4px;align-items:center}
.ev label.on{border-color:var(--accent);background:var(--accent-weak)}
textarea,input[type=text],select{width:100%;font:inherit;font-size:14px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
pre{white-space:pre-wrap;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:260px;overflow:auto}
.status{font-size:13px;color:var(--muted)}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}
.ref{font-size:13.5px}.ref p{margin:6px 0}
.side{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto}
@media (max-width:900px){.side{position:static;max-height:none}}

.okmark{color:var(--ok);font-weight:600}.diffmark{color:var(--warn);font-weight:600}
.guide h2{font-size:17px;margin:18px 0 6px}.guide h3{font-size:15px;margin:14px 0 4px;color:var(--fg);text-transform:none;letter-spacing:0}
.guide h4{font-size:14px;margin:12px 0 4px}.guide li{margin:3px 0}.guide p{margin:7px 0}
.practice-note{font-size:13px;color:var(--muted);margin:0}
</style>
</head>

const CASES = [{"case": "practice_a", "request": {"id": "Claim/practicea-claim", "date": "2026-08-19", "text": "MRI lumbar spine without contrast (SNOMED CT 241648005 MRI of lumbar spine); use: preauthorization; priority: Normal"}, "patient": {"id": "Patient/8f48ea64-12eb-a55e-c747-42fd4dab5908", "text": "62 years old on the request date; sex: female"}, "sections": [{"title": "Conditions", "items": [{"id": "Condition/practicea-cond-01", "date": "2026-06-08", "text": "Low back pain with radiculopathy (ICD-10-CM M54.16); clinical status: active; onset 2026-06-08"}]}, {"title": "Visits", "items": [{"id": "Encounter/practicea-enc-01", "date": "2026-06-09", "text": "2026-06-09 primary care visit (ambulatory): Low back pain and left leg pain for one day, no injury or fall; physical therapy referral and home exercises"}, {"id": "Encounter/practicea-enc-02", "date": "2026-07-14", "text": "2026-07-14 follow-up (ambulatory): Left leg pain unchanged; physical therapy ongoing"}, {"id": "Encounter/practicea-enc-03", "date": "2026-08-14", "text": "2026-08-14 follow-up (ambulatory): Left sciatica unchanged after seven weeks of physical therapy; epidural steroid injection planned with pain management; lumbar MRI ordered to choose the level"}]}, {"title": "Procedures", "items": [{"id": "Procedure/practicea-pt-01", "date": "2026-06-15", "text": "Physical therapy procedure; 2026-06-15 to 2026-08-03; status: completed; 12 sessions"}]}, {"title": "Observations", "items": [{"id": "Observation/practicea-obs-01", "date": "2026-08-14", "text": "2026-08-14 Physical findings Narrative: Straight leg raise positive on the left at 50 degrees, reproducing pain down the back of the left thigh and calf; negative on the right. Strength 5/5 in both lower extremities. Patellar and Achilles reflexes 2+ and equal. Sensation to light touch normal in both legs and feet."}]}], "note": {"id": "DocumentReference/practicea-note-01", "date": "2026-08-14", "paragraphs": [{"id": "note:p1", "text": "Seen 2026-08-14 for left leg pain. 62-year-old woman whose low back pain and left leg pain began on June 8, with no injury or fall. The leg pain follows the back of the left thigh into the calf and is now the main problem; the back pain is mild. No numbness, tingling, or weakness. No fever, chills, or weight loss, and no history of cancer. Bladder and bowel function normal."}, {"id": "note:p2", "text": "She has done physical therapy since June 15, twelve sessions through August 3, plus daily home exercises. Neither the back pain nor the leg pain has changed, and the leg pain is 6/10 most days. She cannot sit through a full work day. She prefers not to take pain medicine."}, {"id": "note:p3", "text": "On exam the straight leg raise is positive on the left at 50 degrees, with full strength, equal reflexes, and normal sensation in both legs. Impression: left lumbar radiculopathy without neurologic deficit, persisting after seven weeks of physical therapy."}, {"id": "note:p4", "text": "Plan: pain management referral for a lumbar epidural steroid injection. MRI of the lumbar spine without contrast so the injection can be aimed at the right level and side. Keep up the home exercises."}]}}, {"case": "practice_b", "request": {"id": "Claim/practiceb-claim", "date": "2026-08-20", "text": "MRI lumbar spine without contrast (SNOMED CT 241648005 MRI of lumbar spine); use: preauthorization; priority: Normal"}, "patient": {"id": "Patient/ba1a5e29-bd6d-1385-6e12-3a099fc0b84f", "text": "83 years old on the request date; sex: male"}, "sections": [{"title": "Conditions", "items": [{"id": "Condition/practiceb-cond-01", "date": "2026-05-18", "text": "Low back pain (ICD-10-CM M54.50); clinical status: active; onset 2026-05-18"}]}, {"title": "Visits", "items": [{"id": "Encounter/practiceb-enc-01", "date": "2026-05-19", "text": "2026-05-19 primary care visit (ambulatory): Low back pain for one day after a long drive, no fall or injury; walking program"}, {"id": "Encounter/practiceb-enc-02", "date": "2026-06-16", "text": "2026-06-16 follow-up (ambulatory): Low back pain at four weeks, now with heaviness in both thighs after walking two blocks; physical therapy referral"}, {"id": "Encounter/practiceb-enc-03", "date": "2026-08-18", "text": "2026-08-18 follow-up (ambulatory): Neurogenic claudication unchanged after seven weeks of physical therapy; spine surgery consultation for possible decompression; lumbar MRI ordered beforehand"}]}, {"title": "Procedures", "items": [{"id": "Procedure/practiceb-pt-01", "date": "2026-06-22", "text": "Physical therapy procedure; 2026-06-22 to 2026-08-10; status: completed; 14 sessions"}]}, {"title": "Observations", "items": [{"id": "Observation/practiceb-obs-01", "date": "2026-08-18", "text": "2026-08-18 Physical findings Narrative: Mild tenderness at the lumbosacral junction. Lumbar flexion relieves the pain; extension reproduces back pain and bilateral thigh heaviness. Straight leg raise negative bilaterally. Strength 5/5 in both lower extremities. Patellar and Achilles reflexes 2+ and symmetric. Sensation intact to light touch in both legs. Dorsalis pedis pulses 2+ bilaterally."}]}], "note": {"id": "DocumentReference/practiceb-note-01", "date": "2026-08-18", "paragraphs": [{"id": "note:p1", "text": "Follow-up visit, 2026-08-18. 83-year-old with low back pain since mid-May, now about three months, which began after a long drive, with no fall or injury. Over the summer he has developed heaviness and aching in both thighs after walking about two blocks, which eases within a few minutes of sitting down or leaning on a shopping cart. No leg pain at rest. He has not noticed numbness or weakness. Bladder and bowel function normal. Denies fever and weight loss."}, {"id": "note:p2", "text": "Since the last visit he was seen at an urgent care in late July for a urinary tract infection and finished a course of antibiotics on August 4. He feels well otherwise."}, {"id": "note:p3", "text": "He did physical therapy from June 22 to August 10, 14 sessions, focused on flexion exercises and walking, and keeps up the home program. He takes no regular pain medicine. His walking distance has not improved, and the back pain is 5/10."}, {"id": "note:p4", "text": "Exam: mild tenderness at the lumbosacral junction. Leaning forward relieves the pain; extension brings on back pain and thigh heaviness. Straight leg raise negative on both sides. Strength 5/5 in both legs. Knee and ankle reflexes 2+ and symmetric. Sensation intact. Foot pulses normal."}, {"id": "note:p5", "text": "Assessment and plan: symptoms that fit lumbar spinal stenosis with neurogenic claudication, not better after three months, including seven weeks of physical therapy; neurologically intact. Spine surgery consultation to discuss a decompression, with an MRI of the lumbar spine without contrast beforehand to look for stenosis and its level."}]}}];
const POLICY_HEAD = "# LCD L34220, Lumbar MRI\nContractor: Noridian Healthcare Solutions, LLC\nRevision effective date: 2025-10-23\nSource: https://www.cms.gov/medicare-coverage-database/view/lcd.aspx?lcdid=34220\nRetrieved: 2026-09-10 (automated fetch; verified against the live page on 2026-09-14 by EW)\nQuoted with attribution from the CMS Medicare Coverage Database; code tables not included.";
const POLICY_BODY = "## Coverage Indications, Limitations, and/or Medical Necessity\n\nMagnetic Resonance Imaging (MRI) is a noninvasive method of imaging body structures based on the distribution of fixed water and other hydrogen-rich molecules in the human body. MRI uses a powerful magnet to align hydrogen atoms within the patient's soft tissues. As the nuclei return from excitation to equilibrium, the MRI receiver coil receives radio frequency wave signals that are transformed by the computer into diagnostic images. MRI produces cross sectional and 3-D images of soft tissues. Because bone contains little water (hydrogen nuclei), bone is relatively invisible to MRI. Blood is also relatively invisible because the hydrogen nuclei are moving in the blood stream.\n\nMRI contrast agents can improve the sensitivity and/or specificity of an image, by altering inherent tissue response to magnetic fields. The contrast agent most commonly used is gadolinium.\n\nMRI has proven useful in diagnosing cerebral infarctions, tumors, abscesses, edema, hemorrhage, nerve fiber demyelination (as in multiple sclerosis), and other disorders that increase fluid content of the affected tissues.\n\nMRI of the spinal canal has the advantage of noninvasive visualization of the spinal cord.\n\nMRI can:\n\n* Differentiate solid from cystic tumors,\n* Diagnose and localize spinal cord compression;\n* Diagnose syringomyelia (progressive, chronic sensory disturbance, atrophy and spasticity of the spinal cord), disc disease, and any altered relationship between vertebral bodies, discs, spinal cord and nerve roots;\n* Detect congenital spinal dysraphism (failure of fusion of parts along the dorsal midline of the spinal cord);\n* Provide early detection of osteomyelitis, and\n* Detect spinal cord abnormalities associated with osteomyelitis.\n\nCoverage is limited to MRI units that have received FDA pre-market approval. Such units must be operated within the parameters specified by the approval.\n\nContrast is indicated for studying the central nervous system for metastatic disease, inflammatory disease, recurrent tumor versus scar, differentiation of microvascular from macrovascular infarction, and selected cases of complex vascular disease. Within the study of the spine, contrast also is indicated to differentiate recurrent disc versus scar or granulation tissue, spinal cord neoplasm, any case of myelopathy, and inflammatory cord disease.\n\nHistory and clinical findings are critical factors to determine when a lumbar MRI is needed in order to efficiently manage low back pain and related disorders.\n\nLumbar MRI may be indicated for a patient with a \"red-flag\" condition, such as a suspected tumor, infection, herniated intervertebral disc with nerve compression, or a major neurological problem. The MRI test result may be needed to evaluate these conditions to determine the need for surgery or other aggressive therapy, such as a work-up for metastatic cancer.\n\n\"Red flags\" are identified through an appropriate history plus a physical examination that typically includes evaluating muscle strength, limb circumference, reflexes, sensation, straight leg raise, and sitting knee extension tests.\n\n\"Red flags\" include:\n\n* Major trauma\n* Minor trauma in a potentially osteoporotic patient\n* History of cancer\n* Fever\n* Chills\n* Unexplained weight loss\n* Recent bacterial infection\n* IV drug abuse\n* Immune suppression\n* Pain that worsens when supine or at night\n* Saddle anesthesia\n* Recent onset of bladder dysfunction\n* Clinically significant or progressive neurologic deficit in the lower extremity\n* Unexpected laxity of the anal sphincter\n* Perianal or perineal sensory loss,\n* Clinically significant motor weakness, or\n* Other nerve root compromise\n\nEighty (80) to ninety (90) percent of patients with low back pain improve one month after symptom onset even without treatment. Therefore, spinal imaging tests are not generally necessary during the first month of symptoms except when a \"red flag\" (suggesting a medically emergent condition) is noted on the medical history and physical examination. For a \"non-red flag\" condition, the MRI may be appropriate after 1 month of symptoms.\n\nFor example, for a patient with low back pain syndrome where there is no known injury, history of cancer, or septic disorder and there are no symptoms or signs suggesting nerve root disorder or spinal cord dysfunction (i.e. no \"red flags\"), MRI will be covered only if the patient has not responded to a reasonable trial of conservative management lasting at least four weeks.\n\nIf a patient's limitations due to low back symptoms do not improve within four weeks, findings on reassessment may reveal an indication for a MRI. However, since MRI changes are common in asymptomatic patients, MRI abnormalities alone do not retrospectively validate the need for the test without other supporting clinical rationale.\n\nA lumbar MRI used to evaluate uncomplicated degenerative disc disease or herniated nucleus pulposus is not considered medically necessary when a surgical intervention or other aggressive treatment (e.g. intervertebral joint injection) is not under consideration.\n\nWhen a lumbar MRI is ordered, Medicare expects that the information gained from the test will be used for medical decision-making. When the findings will not affect the treatment choices, the test is not reasonable or necessary.\n\nCertain uses of lumbar MRI are considered investigational and are therefore not covered by Medicare. These include the measurement of blood flow, spectroscopy, imaging of cortical bone and calcifications, and for procedures involving spatial resolution of bone or calcifications.\n\nA lumbar MRI that is a duplication of other imaging studies (such as a spinal CT scan) may be unreasonable or unnecessary. A lumbar MRI, however, could be complementary to a lumbar CT if there are inconclusive findings on a CT scan. Conversely, a lumbar CT may be warranted following an MRI study if the MRI study is found to be inconclusive. Documentation should support the medical necessity for the need for both studies.\n\nThe payment for a single lumbar MRI procedure includes two (2) and three (3) sequences.\n\nContraindications and limitations of lumbar MRI testing include:\n\n* Patients with an allergy to contrast media,\n* The effects upon a fetus are unknown at this time; therefore, pregnancy is to be handled at the discretion of the primary doctor,\n* When the technical component is performed without the professional component.\n\n(Payment paragraphs on multiple professional components and multi-position MRI omitted; they do not bear on coverage criteria.)";
const CRITERIA = "The criteria the agent checks, from L34220 (revision effective October 23, 2025).\n\nC1. A red-flag indication is present. The LCD's list: major trauma; minor trauma in a potentially osteoporotic patient; history of cancer; fever; chills; unexplained weight loss; recent bacterial infection; IV drug abuse; immune suppression; pain that worsens when supine or at night; saddle anesthesia; recent onset of bladder dysfunction; clinically significant or progressive neurologic deficit in the lower extremity; unexpected laxity of the anal sphincter; perianal or perineal sensory loss; clinically significant motor weakness; other nerve root compromise. A red flag counts as supported when a structured element of the record documents it (a Condition, Observation, Procedure, DiagnosticReport, or other discrete entry), with or without the note. A red flag stated only in the note, with nothing structured behind it, or one the structured record contradicts, is labeled undeterminable, and the case routes.\n\nReading of the neurologic items in C1 (adopted 2026-10-14, before any case was authored; reasons and sources in DATASHEET.md). The LCD describes red flags as findings that suggest a medically emergent condition and qualifies its neurologic items as clinically significant or progressive, and the American College of Radiology and American College of Physicians imaging guidance treat uncomplicated radiculopathy separately from red flags. So C1 is supported by objective nerve root or spinal cord compromise in the record: clinically significant or progressive weakness, a reduced or absent reflex, sensory loss in a nerve root pattern, new bladder or bowel dysfunction, or saddle or perianal sensory loss. Radiating leg pain or a positive straight leg raise on its own does not support C1, and such a case is assessed under C2.\nC2. For a non-red-flag condition, the patient \"has not responded to a reasonable trial of conservative management lasting at least four weeks,\" and the MRI is being considered after at least one month of symptoms. As for C1, conservative care stated only in the note, with nothing structured behind it (no therapy Procedure or medication order), or contradicted by the structured record, is labeled undeterminable.\nC3. The study will inform medical decision-making: a surgical intervention or other aggressive treatment (for example intervertebral joint injection) is under consideration, and the findings would affect treatment choices.\nC4. The study is not a duplication of other imaging (such as a spinal CT) unless documentation supports the need for both, for example inconclusive findings on the prior study.\n\nWhy C1 and C2 ask for more than the note: their note-only rules are this project's rule for automatic approval, not the policy's own wording. L34220 says red flags \"are identified through an appropriate history plus a physical examination\", which a visit note records. An agent that can never deny asks for a second source in the record before it approves, because the note is where an overstated claim or an embedded instruction would sit, and asking costs a reviewer's time, never a denial. For C1, a structured element is any entry in the record other than the visit note; an Observation counts whether it holds a number, a code, or text. For C2, it is a therapy Procedure or a medication order, as stated above.\n\nA case is approvable when C3 and C4 hold and either C1 or C2 holds with cited evidence. The criteria that apply to an approval are C3, C4, and whichever of C1 or C2 it rests on; the other is still labeled with its status.\n\nWhen a case is not approvable: request when one record element the provider could send would settle the question, naming the criterion and the element; route when the record contradicts itself on a criterion, even if a document could resolve it, or when the case could not be approved whatever such a document said. A status that rests on something the record does not contain (for example, no prior lumbar imaging for C4) is labeled with empty evidence.";
const OUTPUTS = "The system may output exactly one of three results for a request:\n\n1. Approve, when every applicable criterion is supported by cited evidence in the record.\n2. Request specific missing documentation, naming the criterion the gap belongs to and the record element that would close it.\n3. Route to physician review, with a neutral summary of which criteria are met, unmet, or undeterminable, and the citations for each.";
const LEGEND = "supported: the record shows the criterion is met. unsupported: the record shows the criterion is not met. undeterminable: the record does not allow a decision either way. Evidence: the ids on the case page; leave it empty when the status rests on something the record does not contain, for example no prior lumbar imaging.";
const CRIT = [["C1_red_flag","C1 red flag"],["C2_conservative_4wk","C2 conservative care, four weeks"],["C3_informs_management","C3 informs management"],["C4_no_duplicate_imaging","C4 no duplicate imaging"]];
const STATUSES = ["supported","unsupported","undeterminable"];
const ROUTES = ["approve","request","route"];
const KEY = "labeling-practice-v1";
let store = {}, storageOk = true;
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; storageOk = false; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); storageOk = true; } catch (e) { storageOk = false; } }
let cur = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ids(v){ const out=[v.request.id, v.patient.id]; v.sections.forEach(s=>s.items.forEach(i=>out.push(i.id))); out.push(v.note.id); v.note.paragraphs.forEach(p=>out.push(p.id)); return out; }
function rec(c){ if(!store[c]) store[c]={criteria:{},routing:"",gap_criterion:"",gap_missing:"",labeled_on:""}; CRIT.forEach(([k])=>{ if(!store[c].criteria[k]) store[c].criteria[k]={status:"",evidence:[]}; }); return store[c]; }
// Saved evidence that no longer exists on the page (for example after a note is restyled) is dropped, not exported.
CASES.forEach(v=>{ const ok=new Set(ids(v)), r=rec(v.case); CRIT.forEach(([k])=>{ r.criteria[k].evidence=r.criteria[k].evidence.filter(x=>ok.has(x)); }); });
function complete(c){ const r=rec(c); if(!r.routing) return false; for(const [k] of CRIT){ if(!r.criteria[k].status) return false; } if(r.routing==="request" && (!r.gap_criterion || !r.gap_missing.trim())) return false; return true; }
function yq(s){ return '"' + String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"'; }
function yaml(c){
  const r=rec(c); const lines=[];
  lines.push("# Blind labels for one case (Amendment 2): your answers before seeing any other reader's. Never edited after upload.");
  lines.push("# status is supported, unsupported, or undeterminable. evidence lists resource ids (for example Procedure/case01-pt-01) or note paragraphs (note:p2).");
  lines.push("# expected_routing is approve, request, or route. named_gap is null, or {criterion: C2, missing: what is missing}.");
  lines.push("case_id: "+c);
  lines.push("labeled_on: "+(r.labeled_on||today()));
  lines.push("criteria:");
  CRIT.forEach(([k])=>{ const x=r.criteria[k]; lines.push("  "+(k+":").padEnd(25)+"{status: "+(x.status||"")+", evidence: ["+x.evidence.join(", ")+"]}"); });
  lines.push("expected_routing:"+(r.routing?" "+r.routing:""));
  if(r.routing==="request" && r.gap_criterion) lines.push("named_gap: {criterion: "+r.gap_criterion+", missing: "+yq(r.gap_missing.trim())+"}"); else lines.push("named_gap: null");
  return lines.join("\n")+"\n";
}
function renderNav(){
  const nav=document.getElementById("nav"); nav.innerHTML="";
  CASES.forEach((v,i)=>{ const b=document.createElement("button"); b.textContent=LABEL(v.case); b.className=(i===cur?"cur ":"")+(complete(v.case)?"done":""); b.onclick=()=>{cur=i;render();window.scrollTo(0,0);}; nav.appendChild(b); });
}
function renderCase(){
  const v=CASES[cur]; let h='<div class="card"><h2>'+esc(LABEL(v.case))+'</h2><p class="practice-note">Practice case, not part of the golden set.</p>';
  h+='<p><code class="id">'+esc(v.request.id)+'</code> '+esc(v.request.text)+'. Requested on '+esc(v.request.date)+'.</p>';
  h+='<p><code class="id">'+esc(v.patient.id)+'</code> '+esc(v.patient.text)+'.</p></div>';
  v.sections.forEach(s=>{ h+='<div class="card"><h3>'+esc(s.title)+'</h3><ul class="items">'; s.items.forEach(i=>{ h+='<li><code class="id">'+esc(i.id)+'</code> '+esc(i.text)+'</li>'; }); h+='</ul></div>'; });
  h+='<div class="card"><h3>Visit note</h3><p class="status"><code class="id">'+esc(v.note.id)+'</code> dated '+esc(v.note.date)+'</p>';
  v.note.paragraphs.forEach(p=>{ h+='<p class="para"><code class="id">'+esc(p.id)+'</code> '+esc(p.text)+'</p>'; });
  h+='</div>'; document.getElementById("casecol").innerHTML=h;
}
function renderForm(){
  const v=CASES[cur], c=v.case, r=rec(c), all=ids(v); let h='<div class="card"><h2>Your practice labels, '+esc(LABEL(c))+'</h2>';
  h+='<p class="status">'+esc(LEGEND)+'</p>';
  CRIT.forEach(([k,label])=>{ const x=r.criteria[k];
    h+='<div class="crit"><div class="name">'+esc(label)+'</div><div class="opts">';
    STATUSES.forEach(s=>{ h+='<label><input type="radio" name="'+k+'" value="'+s+'"'+(x.status===s?" checked":"")+'> '+s+'</label>'; });
    h+='</div><details'+(x.evidence.length?" open":"")+'><summary>Evidence ('+x.evidence.length+' selected)</summary><div class="ev">';
    all.forEach(id=>{ const on=x.evidence.includes(id); h+='<label class="'+(on?"on":"")+'"><input type="checkbox" data-crit="'+k+'" value="'+esc(id)+'"'+(on?" checked":"")+'>'+esc(id)+'</label>'; });
    h+='</div></details></div>'; });
  h+='<div class="crit"><div class="name">Routing</div><div class="opts">';
  ROUTES.forEach(s=>{ h+='<label><input type="radio" name="routing" value="'+s+'"'+(r.routing===s?" checked":"")+'> '+s+'</label>'; });
  h+='</div><div id="gapbox" style="display:'+(r.routing==="request"?"block":"none")+'"><p class="status">For a documentation request: which criterion, and what is missing.</p><select id="gapc"><option value="">Criterion</option>'+["C1","C2","C3","C4"].map(g=>'<option'+(r.gap_criterion===g?" selected":"")+'>'+g+'</option>').join("")+'</select><div style="height:6px"></div><input type="text" id="gapm" placeholder="What is missing" value="'+esc(r.gap_missing)+'"></div></div>';
  h+='<p class="status '+(complete(c)?"ok":"warn")+'">'+(complete(c)?(storageOk?"Complete. Saved in this browser.":"Complete, but this browser is not saving it."):"Not complete yet. Every criterion needs a status, and a request needs its gap."+(storageOk?"":" This browser is not saving your work."))+'</p>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="check">Check my answers</button><button class="btn ghost" id="clear">Clear this case</button></div><p class="status" id="checkmsg"></p>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn ghost" id="prev">Previous case</button><button class="btn ghost" id="next">Next case</button></div></div>';
  if(shown[c]) h+=checkHtml(c);
  document.getElementById("formcol").innerHTML=h; bindCheck(c);
  document.querySelectorAll('#formcol input[type=radio]').forEach(el=>el.onchange=()=>{ if(el.name==="routing"){ r.routing=el.value; if(el.value!=="request"){r.gap_criterion="";r.gap_missing="";} } else { r.criteria[el.name].status=el.value; } r.labeled_on=today(); save(); render(); });
  document.querySelectorAll('#formcol input[type=checkbox]').forEach(el=>el.onchange=()=>{ const x=r.criteria[el.dataset.crit]; const i=x.evidence.indexOf(el.value); if(el.checked&&i<0) x.evidence.push(el.value); if(!el.checked&&i>=0) x.evidence.splice(i,1); x.evidence.sort((a,b)=>all.indexOf(a)-all.indexOf(b)); r.labeled_on=today(); save(); render(); });
  const gc=document.getElementById("gapc"), gm=document.getElementById("gapm");
  if(gc) gc.onchange=()=>{ r.gap_criterion=gc.value; save(); renderNav(); };
  if(gm) gm.onchange=()=>{ r.gap_missing=gm.value; save(); render(); };
  document.getElementById("prev").onclick=()=>{ cur=(cur+CASES.length-1)%CASES.length; render(); window.scrollTo(0,0); };
  document.getElementById("next").onclick=()=>{ cur=(cur+1)%CASES.length; render(); window.scrollTo(0,0); };
}

// Minimal zip writer (stored, no compression), so the page works offline with no libraries.
const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>>8)&255], u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(f=>{ const name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(local,name,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=local.length+name.length+data.length; });
  const csize=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:"application/zip"});
}

  const files=CASES.map(v=>({name:"data/golden/"+v.case+"/labels_blind.yaml", text:yaml(v.case)}));
  const a=document.createElement("a"); a.href=URL.createObjectURL(zip(files)); a.download="labels_blind.zip"; document.body.appendChild(a); a.click(); a.remove();
};

  const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n\s*\n/).map(p=>"<p>"+p.replace(/\n\* /g,"<br>&bull; ").replace(/^\* /,"&bull; ").replace(/\n/g,"<br>")+"</p>").join("");
  return "<h3>Criteria (EVAL_PLAN.md, Criterion inventory)</h3>"+md(CRITERIA)+"<h3>Routing (CHARTER.md, authority statement)</h3>"+md(OUTPUTS)+"<h3>Policy text, LCD L34220</h3><p class='status'>"+esc(POLICY_HEAD).replace(/\n/g,"<br>")+"</p>"+md(POLICY_BODY);
}

const ANSWERS = {"practice_a": {"criteria": {"C1_red_flag": {"status": "unsupported", "evidence": [], "also_fine": ["Observation/practicea-obs-01", "note:p1", "note:p3"], "why": "The only red-flag question this record raises is the leg pain. The policy's list has nerve items, and this project reads them as objective signs in the record: clinically significant or progressive weakness, a reduced or absent reflex, sensory loss in a nerve root pattern, new bladder or bowel trouble, or saddle or perianal numbness. The exam (Observation/practicea-obs-01) shows full strength, equal reflexes, and normal sensation. Pain running down the leg and a positive straight leg raise do not count on their own, so the case is assessed under C2 instead. The Conditions list names radiculopathy (Condition/practicea-cond-01), but that is a diagnosis, not an exam finding; the reading asks for objective weakness, reflex change, or sensory loss, and the exam shows none. Nothing else on the list appears anywhere: no injury, no cancer, no fever, no infection. Evidence can stay empty, because the status rests on red flags the record does not contain. Ticking the exam, or the note paragraphs that rule red flags out (note:p1, note:p3), is fine too."}, "C2_conservative_4wk": {"status": "supported", "evidence": ["Procedure/practicea-pt-01", "Encounter/practicea-enc-03"], "also_fine": ["note:p2", "Condition/practicea-cond-01", "Encounter/practicea-enc-02"], "why": "C2 needs three things. Conservative care for at least four weeks, in a structured entry: physical therapy from June 15 to August 3 is seven weeks (Procedure/practicea-pt-01). No response: the August 14 visit says the leg pain is unchanged after the therapy (Encounter/practicea-enc-03). At least a month of symptoms before the MRI: pain since June 8 (the low back pain Condition) and a request on August 19, about ten weeks. There is no medication order here, and none is needed: one therapy that meets the four weeks is enough. The note's treatment paragraph (note:p2) says the same things and is fine to tick, but by itself it could not carry C2."}, "C3_informs_management": {"status": "supported", "evidence": ["Encounter/practicea-enc-03", "note:p4"], "also_fine": ["note:p3"], "why": "C3 needs a surgery or other aggressive treatment under consideration, and an MRI result that would change the choice. The August 14 visit plans an epidural steroid injection with pain management, an injection like the policy's own example, and the plan (note:p4) says the MRI is how the injection will be aimed at the right level and side. For C3 and C4 the note counts as evidence on its own; the note-only rule is only for C1 and C2."}, "C4_no_duplicate_imaging": {"status": "supported", "evidence": [], "also_fine": [], "why": "There is no earlier lumbar imaging anywhere in the record: no Imaging reports section and no imaging in Procedures. The status rests on something the record does not contain, so evidence stays empty, as the legend on the form says."}}, "routing": "approve", "gap": null, "routing_why": "An approval needs C3 and C4, plus either C1 or C2 with cited evidence. Here C2, C3, and C4 are all supported. C1 being unsupported is fine: a case needs a red flag or a failed four-week trial, not both.", "lesson": "Leg pain and a positive straight leg raise are not red flags on their own, and neither is a diagnosis name without the exam findings behind it. For C2, count the weeks from the dates in the structured entries. For C4, empty evidence is right when there is no earlier imaging."}, "practice_b": {"criteria": {"C1_red_flag": {"status": "undeterminable", "evidence": ["note:p2"], "also_fine": ["Observation/practiceb-obs-01", "note:p1"], "why": "A recent bacterial infection is on the policy's list, and note:p2 says he was treated for a urinary tract infection in late July and finished antibiotics on August 4. But it appears only in the visit note: there is no Condition for the infection, no antibiotic order, and nothing else in the record behind it. The criteria say a red flag stated only in the note, with nothing structured behind it, is labeled undeterminable, and the case routes. Two things here are not red flags. The thigh heaviness with walking is not, because the exam shows full strength, normal reflexes, and normal sensation. Evidence: note:p2, the paragraph where the red flag is stated."}, "C2_conservative_4wk": {"status": "supported", "evidence": ["Procedure/practiceb-pt-01", "Encounter/practiceb-enc-03"], "also_fine": ["note:p3", "Condition/practiceb-cond-01", "Encounter/practiceb-enc-02"], "why": "Physical therapy from June 22 to August 10 is seven weeks (Procedure/practiceb-pt-01). The August 18 visit says the symptoms are unchanged after it (Encounter/practiceb-enc-03). Symptoms since May 18, about three months before the request. C2 gets its own status even though C1 has a problem: every criterion is labeled on its own terms."}, "C3_informs_management": {"status": "supported", "evidence": ["Encounter/practiceb-enc-03", "note:p5"], "also_fine": [], "why": "He is referred to spine surgery to discuss a decompression, so surgery is under consideration, and the assessment and plan (note:p5) say the MRI will look for narrowing of the spinal canal and its level before that visit, which is what decides whether and where surgery could help."}, "C4_no_duplicate_imaging": {"status": "supported", "evidence": [], "also_fine": [], "why": "No earlier lumbar imaging anywhere in the record, so the status rests on what the record does not contain and evidence stays empty."}}, "routing": "route", "gap": null, "routing_why": "C2, C3, and C4 would support an approval, which is exactly why this case is worth practicing. The criteria say that when a red flag is stated only in the note, the case routes. It is not a request either. You might think of asking for the urgent care record, but the rule settles it, for a reason that is part of the tool's design: a possible red flag is something a person should look at, not something the tool waits on paperwork for.", "lesson": "Check every note paragraph against the red-flag list, including ones that read like background. A red flag that appears only in the note makes C1 undeterminable and sends the case to a physician, even when everything else is in order."}};
const GUIDE_HTML = "\u003ch2>Labeling training\u003c/h2>\n\u003cp>About an hour, before you label the 12 cases. This is practice only. Nothing you do here is uploaded or counted, and none of the 12 cases appears in it. The two practice cases were written for this training from the policy and the criteria, and they are not part of the golden set.\u003c/p>\n\u003ch3>How to use this training\u003c/h3>\n\u003col>\u003cli>Read Parts 1 to 5 below. That takes about 25 minutes. You can come back to this guide at any time, including while you label the real cases.\u003c/li>\u003cli>Open the practice page (Part 6) and label \u003cb>Practice A\u003c/b> without looking at the answers.\u003c/li>\u003cli>Click \u003cb>Check my answers\u003c/b>. Read every explanation, especially where your answer differs.\u003c/li>\u003cli>Do the same for \u003cb>Practice B\u003c/b>.\u003c/li>\u003cli>If both explanations made sense, you are ready for the 12 cases.\u003c/li>\u003c/ol>\n\u003cp>Questions about the practice cases or the rules are welcome before you start the 12. Once you start, use only the labeling page, its \u003cb>Policy and criteria\u003c/b> panel, a printed copy of the cases if you made one, and this guide.\u003c/p>\n\u003ch3>Part 1. What you are doing\u003c/h3>\n\u003cp>For each case you answer five questions: a status for each of the four criteria (C1 to C4), with the record items it rests on, and then the routing for the whole case (approve, request, or route).\u003c/p>\n\u003cp>You are not making a diagnosis. You are reading what the record shows and checking it against the policy's wording and this project's rules. The rules are on the labeling page under \u003cb>Policy and criteria\u003c/b>, and this guide explains them in plain words. Where this guide and that panel ever seem to differ, the panel wins.\u003c/p>\n\u003cp>You know each case's designed outcome from the evaluation plan. That is expected. Label what the record on the page shows, criterion by criterion.\u003c/p>\n\u003ch4>Two kinds of information in a record\u003c/h4>\n\u003cp>Every case page has the same two kinds of information, and the difference matters for C1 and C2.\u003c/p>\n\u003cul>\u003cli>\u003cb>Structured entries.\u003c/b> The lists at the top: Conditions, Visits, Procedures, Imaging reports, Medications, and Observations. Each item starts with a blue id, such as \u003ccode class=\"id\">Procedure/practicea-pt-01\u003c/code>. Think of these as the fields and lists in a chart.\u003c/li>\u003cli>\u003cb>The visit note.\u003c/b> The clinician's free text at the bottom, split into numbered paragraphs: \u003ccode class=\"id\">note:p1\u003c/code>, \u003ccode class=\"id\">note:p2\u003c/code>, and so on.\u003c/li>\u003c/ul>\n\u003cp>For C1 and C2, this project's rule is that the note alone is not enough. A red flag or a course of conservative care has to show up in a structured entry too. For C3 and C4, the note counts on its own.\u003c/p>\n\u003ch3>Part 2. The three statuses, and evidence\u003c/h3>\n\u003cp>The form repeats these at the top. In plain words:\u003c/p>\n\u003cul>\u003cli>\u003cb>supported\u003c/b>: the record shows the criterion is met. You can point to where.\u003c/li>\u003cli>\u003cb>unsupported\u003c/b>: the record shows the criterion is not met. You can point to that too, or the record plainly lacks what the criterion needs.\u003c/li>\u003cli>\u003cb>undeterminable\u003c/b>: the record does not let you decide either way, or it contradicts itself.\u003c/li>\u003c/ul>\n\u003cp>A good test for each criterion: ask yourself \"what in the record shows this?\" If you can point to it, the status is supported or unsupported. If the record leaves the question open, or two parts of it disagree, the status is undeterminable.\u003c/p>\n\u003cp>\u003cb>Evidence\u003c/b> is the set of ids your status rests on. Click \u003cb>Evidence (0 selected)\u003c/b> under a criterion and tick them. Leave evidence empty when the status rests on something the record does not contain, for example no earlier lumbar imaging for C4.\u003c/p>\n\u003cp>When your labels are compared with the other readers', the status matters most. Small differences in which ids people tick are normal and get talked through.\u003c/p>\n\u003ch3>Part 3. The four criteria\u003c/h3>\n\u003ch4>C1. A red flag is present\u003c/h4>\n\u003cp>In plain words, a red flag is a sign that something more serious than ordinary back pain could be going on, so waiting a month would be wrong. The policy lists them. Here is the list exactly as the criteria give it, grouped under headings to make it easier to scan. The words in parentheses are plain-language explanations, not part of the rule.\u003c/p>\n\u003cul>\u003cli>\u003cb>Injury and bone:\u003c/b> major trauma; minor trauma in a potentially osteoporotic patient (a minor fall or knock in someone whose bones may be thin).\u003c/li>\u003cli>\u003cb>Cancer:\u003c/b> history of cancer.\u003c/li>\u003cli>\u003cb>Infection and the immune system:\u003c/b> fever; chills; recent bacterial infection; IV drug abuse; immune suppression (a weakened immune system, for example from long-term steroid tablets or chemotherapy).\u003c/li>\u003cli>\u003cb>Weight:\u003c/b> unexplained weight loss.\u003c/li>\u003cli>\u003cb>Pain pattern:\u003c/b> pain that worsens when supine (lying flat on the back) or at night.\u003c/li>\u003cli>\u003cb>Nerves and spinal cord:\u003c/b> saddle anesthesia (numbness where a saddle would touch: buttocks, inner thighs, groin); recent onset of bladder dysfunction; clinically significant or progressive neurologic deficit in the lower extremity; unexpected laxity of the anal sphincter; perianal or perineal sensory loss; clinically significant motor weakness; other nerve root compromise.\u003c/li>\u003c/ul>\n\u003cp>Anything not on the list is not a red flag for this criterion, however serious it sounds. High blood pressure and arthritis are common examples you will see in the Conditions list.\u003c/p>\n\u003cp>\u003cb>The nerve items, as this project reads them.\u003c/b> The criteria spell this out. C1 is supported by objective nerve root or spinal cord compromise in the record:\u003c/p>\n\u003cul>\u003cli>clinically significant or progressive weakness\u003c/li>\u003cli>a reduced or absent reflex\u003c/li>\u003cli>sensory loss in a nerve root pattern\u003c/li>\u003cli>new bladder or bowel dysfunction\u003c/li>\u003cli>saddle or perianal sensory loss\u003c/li>\u003c/ul>\n\u003cp>Pain that runs down the leg, or a positive straight leg raise (a test where lifting the straight leg brings on the leg pain), does \u003cb>not\u003c/b> support C1 on its own. A case like that is assessed under C2.\u003c/p>\n\u003cp>\u003cb>Where the red flag has to be written.\u003c/b> This is the rule that decides most C1 labels:\u003c/p>\n\u003cul>\u003cli>\u003cb>Supported\u003c/b> when a structured entry documents the red flag: a Condition, Observation, Procedure, Imaging report, medication order, or any other entry that is not the visit note. An Observation counts whether it holds a number, a code, or text.\u003c/li>\u003cli>\u003cb>Undeterminable\u003c/b> when the red flag is stated only in the note, with nothing structured behind it, or when the structured record contradicts it. In both situations the criteria say \u003cb>the case routes\u003c/b>.\u003c/li>\u003cli>\u003cb>Unsupported\u003c/b> when nothing on the list appears anywhere in the record, or what appears does not meet the list's words (for example, leg pain with a normal nerve exam).\u003c/li>\u003c/ul>\n\u003cp>A contradiction means two parts of the record say opposite things about the same fact. For example, if the note said \"temperature 101\" but the vital signs recorded at the same visit said 98.6, the structured record would contradict the note.\u003c/p>\n\u003cp>\u003cb>A step-by-step check for C1:\u003c/b>\u003c/p>\n\u003col>\u003cli>Read the whole record first, every note paragraph included. Look for anything on the list.\u003c/li>\u003cli>If you find nothing on the list, C1 is \u003cb>unsupported\u003c/b>. Evidence can stay empty, because the status rests on what the record does not contain. If a particular exam is what settled it for you (for example, one showing that a leg finding falls short), you may tick it instead. Either is fine.\u003c/li>\u003cli>For a nerve finding, check it against the reading above. Leg pain or a positive straight leg raise alone does not count.\u003c/li>\u003cli>For a red flag that is on the list, find where it is written. In a structured entry, and not contradicted: \u003cb>supported\u003c/b>, and tick that entry.\u003c/li>\u003cli>Only in the note, or contradicted by a structured entry: \u003cb>undeterminable\u003c/b>. Tick the note paragraph, and the contradicting entry if there is one.\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Words that carry a condition.\u003c/b> Some items have a qualifier: \"unexplained\" weight loss, \"potentially osteoporotic\", \"recent\" bacterial infection, \"clinically significant\" or \"progressive\". Read them literally and check whether the record says enough to meet the words. If the record truly does not let you decide, that is what undeterminable is for.\u003c/p>\n\u003ch4>C2. Four weeks of conservative care that hasn't worked\u003c/h4>\n\u003cp>The criteria: for a non-red-flag condition, the patient \"has not responded to a reasonable trial of conservative management lasting at least four weeks,\" and the MRI is being considered after at least one month of symptoms.\u003c/p>\n\u003cp>So C2 has three parts, and all three have to hold:\u003c/p>\n\u003col>\u003cli>\u003cb>Conservative care for at least four weeks.\u003c/b> In plain words, conservative care is treatment short of surgery or injections, such as physical therapy or pain medicine. It has to be in a structured entry: a therapy in Procedures, or a medication order in Medications.\u003c/li>\u003cli>\u003cb>No response.\u003c/b> The latest visit or the note says the pain persists, is unchanged, or is worse.\u003c/li>\u003cli>\u003cb>At least a month of symptoms\u003c/b> before the MRI request. Compare the low back pain Condition's onset date with the request date at the top of the page.\u003c/li>\u003c/ol>\n\u003cp>\u003cb>How to count four weeks.\u003c/b> Use the dates printed on the entry: a Procedure's \"2026-06-15 to 2026-08-03\", or a medication's \"dosage period\". Four weeks is 28 days. For example, June 1 to June 29 is exactly four weeks.\u003c/p>\n\u003cp>\u003cb>Note-only care.\u003c/b> Conservative care stated only in the note, with nothing structured behind it (no therapy Procedure or medication order), or contradicted by the structured record, is labeled undeterminable. Unlike C1, the criteria do not say this alone routes the case; the routing questions in Part 4 decide that.\u003c/p>\n\u003cp>C2 always gets its own status, even when C1 is supported. The criteria say the criterion an approval does not rest on \"is still labeled with its status.\"\u003c/p>\n\u003ch4>C3. The MRI will change what happens next\u003c/h4>\n\u003cp>The criteria: \"a surgical intervention or other aggressive treatment (for example intervertebral joint injection) is under consideration, and the findings would affect treatment choices.\"\u003c/p>\n\u003cp>Two parts:\u003c/p>\n\u003col>\u003cli>\u003cb>Surgery or another aggressive treatment is under consideration.\u003c/b> The criteria's example is an intervertebral joint injection (an injection into a joint of the spine). Look at the latest visit and the note's assessment and plan, and read the policy's own wording in the \u003cb>Policy and criteria\u003c/b> panel.\u003c/li>\u003cli>\u003cb>The MRI's result would affect the treatment choice.\u003c/b> The record should say, in some form, how the result would change what happens next.\u003c/li>\u003c/ol>\n\u003cp>The note counts as evidence for C3 on its own.\u003c/p>\n\u003ch4>C4. Not a repeat of earlier imaging\u003c/h4>\n\u003cp>The criteria: \"The study is not a duplication of other imaging (such as a spinal CT) unless documentation supports the need for both, for example inconclusive findings on the prior study.\"\u003c/p>\n\u003cp>Look for earlier imaging of the lumbar spine in Procedures, Imaging reports, and the note.\u003c/p>\n\u003cul>\u003cli>\u003cb>No earlier lumbar imaging anywhere:\u003c/b> supported, with \u003cb>empty\u003c/b> evidence. The status rests on what the record does not contain.\u003c/li>\u003cli>\u003cb>Earlier lumbar imaging exists:\u003c/b> ask whether the MRI would duplicate it (the criteria's example is a spinal CT). If it would, check whether the record documents the need for both, such as an inconclusive result on the earlier study, and label from what you find.\u003c/li>\u003c/ul>\n\u003cp>The note counts as evidence for C4 on its own.\u003c/p>\n\u003ch3>Part 4. Routing the case\u003c/h3>\n\u003cp>After the four criteria, choose one outcome. Ask these questions in order and stop at the first \"yes\":\u003c/p>\n\u003col>\u003cli>\u003cb>Is there a red flag stated only in the note, or one the structured record contradicts?\u003c/b> Route. (The C1 rule.)\u003c/li>\u003cli>\u003cb>Are C3 and C4 supported, and C1 or C2 supported with cited evidence?\u003c/b> Approve. A case needs a red flag or a failed four-week trial, not both. (C4's evidence can be empty when there is no earlier imaging; that still counts as supported.)\u003c/li>\u003cli>\u003cb>Otherwise the case is not approvable. Does the record contradict itself on any criterion?\u003c/b> Route, even if a document could resolve it.\u003c/li>\u003cli>\u003cb>Would one record item that the provider could send settle the open question?\u003c/b> Request, and name the criterion and the missing item. If no single document could make the case approvable, route.\u003c/li>\u003c/ol>\n\u003cp>These four questions restate the criteria's own sentences: \"A case is approvable when C3 and C4 hold and either C1 or C2 holds with cited evidence,\" and, when a case is not approvable, \"request when one record element the provider could send would settle the question, naming the criterion and the element; route when the record contradicts itself on a criterion, even if a document could resolve it, or when the case could not be approved whatever such a document said.\"\u003c/p>\n\u003cp>\u003cb>Filling in a request.\u003c/b> Choose \u003cb>request\u003c/b>. Two boxes appear. In the first, pick the criterion the gap belongs to. In the second, type what is missing in a few plain words, then click anywhere outside the box so it saves.\u003c/p>\n\u003ch3>Part 5. Habits for the 12 cases\u003c/h3>\n\u003cul>\u003cli>\u003cb>Read the whole record before answering anything.\u003c/b> C1 in particular depends on every part of it.\u003c/li>\u003cli>\u003cb>For each status, ask \"what in the record shows this?\"\u003c/b> Then tick those ids.\u003c/li>\u003cli>\u003cb>Approve only when C3 and C4 hold and you can point to the evidence\u003c/b> for whichever of C1 or C2 the approval rests on. That is the approve rule itself.\u003c/li>\u003cli>\u003cb>When the record truly doesn't let you decide,\u003c/b> use undeterminable. It is a real answer, not a failure.\u003c/li>\u003cli>\u003cb>Keep a short paper list\u003c/b> of case numbers that felt hard and why, in a sentence. Those are the first ones to look at when disagreements are settled.\u003c/li>\u003cli>\u003cb>Pace:\u003c/b> about 12 minutes a case, three or four cases a sitting.\u003c/li>\u003cli>\u003cb>You are not the last word.\u003c/b> Your labels, the third reader's, and the locked intended answers are compared, and every disagreement is settled against the policy text. Hard calls are expected, and they are what the settling step is for.\u003c/li>\u003c/ul>\n\u003ch3>Part 6. Open the practice page\u003c/h3>\n\u003cp>\u003cb>Programs:\u003c/b> GitHub Desktop, Finder, and Google Chrome.\u003c/p>\n\u003col>\u003cli>Open \u003cb>GitHub Desktop\u003c/b>. Check that \u003cb>Current Repository\u003c/b> says \u003cb>prior-auth-review-agent\u003c/b> and \u003cb>Current Branch\u003c/b> says \u003cb>main\u003c/b>.\u003c/li>\u003cli>Click \u003cb>Fetch origin\u003c/b> at the top right. If the button changes to \u003cb>Pull origin\u003c/b>, click it again.\u003c/li>\u003cli>Open \u003cb>Finder\u003c/b>, press \u003cb>Cmd+Shift+G\u003c/b>, type \u003ccode class=\"id\">~/Projects/prior-auth-review-agent/eval/labeling\u003c/code> and press \u003cb>Return\u003c/b>.\u003c/li>\u003cli>Right-click \u003cb>training.html\u003c/b>, choose \u003cb>Open With\u003c/b>, then \u003cb>Google Chrome\u003c/b>.\u003c/li>\u003c/ol>\n\u003cp>What you should see: a page titled \u003cb>Labeling Practice\u003c/b>, with two buttons at the top (\u003cb>Practice A\u003c/b> and \u003cb>Practice B\u003c/b>) and two at the top right (\u003cb>Training guide\u003c/b>, which opens this text, and \u003cb>Policy and criteria\u003c/b>). It looks and works like the real labeling page, with a \u003cb>Check my answers\u003c/b> button under each form and no download button.\u003c/p>\n\u003cp>Your practice answers are saved in Chrome separately from your real labels, so nothing you do on the practice page can change them. To try a case again, click \u003cb>Clear this case\u003c/b>.\u003c/p>";
const NAMES = {"practice_a": "Practice A", "practice_b": "Practice B"};
function LABEL(c){ return NAMES[c] || c; }
const shown = {};
function checkHtml(c){
  const a=ANSWERS[c], r=rec(c); let h='<div class="card" id="checkout"><h2>Worked answer, '+esc(LABEL(c))+'</h2>';
  CRIT.forEach(([k,label])=>{ const want=a.criteria[k], got=r.criteria[k];
    h+='<div class="crit"><div class="name">'+esc(label)+'</div><p>';
    h+=got.status===want.status?'<span class="okmark">Same as yours: '+esc(want.status)+'</span>':'<span class="diffmark">Worked answer: '+esc(want.status)+'. Yours: '+esc(got.status||"none")+'</span>';
    h+='</p>';
    if(!want.evidence.length){
      const fine=got.evidence.filter(x=>want.also_fine.includes(x)), extra=got.evidence.filter(x=>!want.also_fine.includes(x));
      h+='<p class="status">Evidence in the worked answer: empty'+(got.evidence.length?'':', and yours is empty too.')+'</p>';
      if(fine.length) h+='<p class="status">Also fine: '+fine.map(esc).join(", ")+'</p>';
      if(extra.length) h+='<p class="status">Not needed for this criterion: '+extra.map(esc).join(", ")+'</p>';
    } else {
      const miss=want.evidence.filter(x=>!got.evidence.includes(x)), fine=got.evidence.filter(x=>want.also_fine.includes(x)), extra=got.evidence.filter(x=>!want.evidence.includes(x)&&!want.also_fine.includes(x));
      h+='<p class="status">Evidence in the worked answer: '+want.evidence.map(x=>'<code class="id">'+esc(x)+'</code>'+(got.evidence.includes(x)?' &#10003;':'')).join(" ")+'</p>';
      if(miss.length) h+='<p class="status">Not ticked by you: '+miss.map(esc).join(", ")+'</p>';
      if(fine.length) h+='<p class="status">Also fine: '+fine.map(esc).join(", ")+'</p>';
      if(extra.length) h+='<p class="status">Not needed for this criterion: '+extra.map(esc).join(", ")+'</p>';
    }
    h+='<p>'+esc(want.why)+'</p></div>'; });
  h+='<div class="crit"><div class="name">Routing</div><p>'+(r.routing===a.routing?'<span class="okmark">Same as yours: '+esc(a.routing)+'</span>':'<span class="diffmark">Worked answer: '+esc(a.routing)+'. Yours: '+esc(r.routing||"none")+'</span>')+'</p>';
  if(a.gap) h+='<p class="status">Gap: '+esc(a.gap.criterion)+', '+esc(a.gap.missing)+'</p>';
  h+='<p>'+esc(a.routing_why)+'</p></div>';
  h+='<div class="crit"><div class="name">What this case teaches</div><p>'+esc(a.lesson)+'</p></div></div>';
  return h;
}
function bindCheck(c){
  const msg=document.getElementById("checkmsg");
  document.getElementById("check").onclick=()=>{
    if(!complete(c)){ msg.innerHTML='Finish every criterion and the routing first. <a href="#" id="anyway">Show the worked answer anyway</a>';
      document.getElementById("anyway").onclick=e=>{ e.preventDefault(); shown[c]=true; render(); document.getElementById("checkout").scrollIntoView(); }; return; }
    shown[c]=true; render(); document.getElementById("checkout").scrollIntoView(); };
  document.getElementById("clear").onclick=()=>{ delete store[c]; shown[c]=false; save(); render(); };
}
function openGuide(){ document.getElementById("guidebody").innerHTML=GUIDE_HTML; document.getElementById("guidedlg").style.display="block"; }
document.getElementById("showguide").onclick=openGuide;
document.getElementById("closeguide").onclick=()=>{ document.getElementById("guidedlg").style.display="none"; };
if(!CASES.some(v=>{ const r=store[v.case]; return r && (r.routing || CRIT.some(([k])=>r.criteria[k].status)); })) openGuide();
render();
</script>
