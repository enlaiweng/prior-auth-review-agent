const CASES = [{"case": "practice_a", "request": {"id": "Claim/practicea-claim", "date": "2026-08-19", "text": "MRI lumbar spine without contrast (SNOMED CT 241648005 MRI of lumbar spine); use: preauthorization; priority: Normal"}, "patient": {"id": "Patient/8f48ea64-12eb-a55e-c747-42fd4dab5908", "text": "62 years old on the request date; sex: female"}, "sections": [{"title": "Conditions", "items": [{"id": "Condition/practicea-cond-01", "date": "2026-06-08", "text": "Low back pain with radiculopathy (ICD-10-CM M54.16); clinical status: active; onset 2026-06-08"}]}, {"title": "Visits", "items": [{"id": "Encounter/practicea-enc-01", "date": "2026-06-09", "text": "2026-06-09 primary care visit (ambulatory): Low back pain and left leg pain for one day, no injury or fall; physical therapy referral and home exercises"}, {"id": "Encounter/practicea-enc-02", "date": "2026-07-14", "text": "2026-07-14 follow-up (ambulatory): Left leg pain unchanged; physical therapy ongoing"}, {"id": "Encounter/practicea-enc-03", "date": "2026-08-14", "text": "2026-08-14 follow-up (ambulatory): Left sciatica unchanged after seven weeks of physical therapy; epidural steroid injection planned with pain management; lumbar MRI ordered to choose the level"}]}, {"title": "Procedures", "items": [{"id": "Procedure/practicea-pt-01", "date": "2026-06-15", "text": "Physical therapy procedure; 2026-06-15 to 2026-08-03; status: completed; 12 sessions"}]}, {"title": "Observations", "items": [{"id": "Observation/practicea-obs-01", "date": "2026-08-14", "text": "2026-08-14 Physical findings Narrative: Straight leg raise positive on the left at 50 degrees, reproducing pain down the back of the left thigh and calf; negative on the right. Strength 5/5 in both lower extremities. Patellar and Achilles reflexes 2+ and equal. Sensation to light touch normal in both legs and feet."}]}], "note": {"id": "DocumentReference/practicea-note-01", "date": "2026-08-14", "paragraphs": [{"id": "note:p1", "text": "Seen 2026-08-14 for left leg pain. 62-year-old woman whose low back pain and left leg pain began on June 8, with no injury or fall. The leg pain follows the back of the left thigh into the calf and is now the main problem; the back pain is mild. No numbness, tingling, or weakness. No fever, chills, or weight loss, and no history of cancer. Bladder and bowel function normal."}, {"id": "note:p2", "text": "She has done physical therapy since June 15, twelve sessions through August 3, plus daily home exercises. Neither the back pain nor the leg pain has changed, and the leg pain is 6/10 most days. She cannot sit through a full work day. She prefers not to take pain medicine."}, {"id": "note:p3", "text": "On exam the straight leg raise is positive on the left at 50 degrees, with full strength, equal reflexes, and normal sensation in both legs. Impression: left lumbar radiculopathy without neurologic deficit, persisting after seven weeks of physical therapy."}, {"id": "note:p4", "text": "Plan: pain management referral for a lumbar epidural steroid injection. MRI of the lumbar spine without contrast so the injection can be aimed at the right level and side. Keep up the home exercises."}]}}, {"case": "practice_b", "request": {"id": "Claim/practiceb-claim", "date": "2026-08-20", "text": "MRI lumbar spine without contrast (SNOMED CT 241648005 MRI of lumbar spine); use: preauthorization; priority: Normal"}, "patient": {"id": "Patient/ba1a5e29-bd6d-1385-6e12-3a099fc0b84f", "text": "83 years old on the request date; sex: male"}, "sections": [{"title": "Conditions", "items": [{"id": "Condition/practiceb-cond-01", "date": "2026-05-18", "text": "Low back pain (ICD-10-CM M54.50); clinical status: active; onset 2026-05-18"}]}, {"title": "Visits", "items": [{"id": "Encounter/practiceb-enc-01", "date": "2026-05-19", "text": "2026-05-19 primary care visit (ambulatory): Low back pain since the previous morning, no fall or injury; walking program"}, {"id": "Encounter/practiceb-enc-02", "date": "2026-06-16", "text": "2026-06-16 follow-up (ambulatory): Low back pain at four weeks, now with heaviness in both thighs after walking two blocks; physical therapy referral"}, {"id": "Encounter/practiceb-enc-03", "date": "2026-08-18", "text": "2026-08-18 follow-up (ambulatory): Neurogenic claudication unchanged after seven weeks of physical therapy; spine surgery consultation for possible decompression; lumbar MRI ordered beforehand"}]}, {"title": "Procedures", "items": [{"id": "Procedure/practiceb-pt-01", "date": "2026-06-22", "text": "Physical therapy procedure; 2026-06-22 to 2026-08-10; status: completed; 14 sessions"}]}, {"title": "Observations", "items": [{"id": "Observation/practiceb-obs-01", "date": "2026-08-18", "text": "2026-08-18 Physical findings Narrative: Mild tenderness at the lumbosacral junction. Lumbar flexion relieves the pain; extension reproduces back pain and bilateral thigh heaviness. Straight leg raise negative bilaterally. Strength 5/5 in both lower extremities. Patellar and Achilles reflexes 2+ and symmetric. Sensation intact to light touch in both legs. Dorsalis pedis pulses 2+ bilaterally."}]}], "note": {"id": "DocumentReference/practiceb-note-01", "date": "2026-08-18", "paragraphs": [{"id": "note:p1", "text": "Follow-up visit, 2026-08-18. 83-year-old with low back pain since mid-May, now about three months, which started for no clear reason, with no fall or injury. Over the summer he has developed heaviness and aching in both thighs after walking about two blocks, which eases within a few minutes of sitting down or leaning on a shopping cart. No leg pain at rest. He has not noticed numbness or weakness. Bladder and bowel function normal. Denies fever and weight loss."}, {"id": "note:p2", "text": "Since the last visit he was seen at an urgent care in late July for a urinary tract infection and finished a course of antibiotics on August 4. He feels well otherwise."}, {"id": "note:p3", "text": "He did physical therapy from June 22 to August 10, 14 sessions, focused on flexion exercises and walking, and keeps up the home program. He takes no regular pain medicine. His walking distance has not improved, and the back pain is 5/10."}, {"id": "note:p4", "text": "Exam: mild tenderness at the lumbosacral junction. Leaning forward relieves the pain; extension brings on back pain and thigh heaviness. Straight leg raise negative on both sides. Strength 5/5 in both legs. Knee and ankle reflexes 2+ and symmetric. Sensation intact. Foot pulses normal."}, {"id": "note:p5", "text": "Assessment and plan: symptoms that fit lumbar spinal stenosis with neurogenic claudication, not better after three months, including seven weeks of physical therapy; neurologically intact. Spine surgery consultation to discuss a decompression, with an MRI of the lumbar spine without contrast beforehand to look for stenosis and its level."}]}}];
const POLICY_HEAD = "# LCD L34220, Lumbar MRI\nContractor: Noridian Healthcare Solutions, LLC\nRevision effective date: 2025-10-23\nSource: https://www.cms.gov/medicare-coverage-database/view/lcd.aspx?lcdid=34220\nRetrieved: 2026-09-10 (automated fetch; verified against the live page on 2026-09-14 by EW)\nQuoted with attribution from the CMS Medicare Coverage Database; code tables not included.";
const POLICY_BODY = "## Coverage Indications, Limitations, and/or Medical Necessity\n\nMagnetic Resonance Imaging (MRI) is a noninvasive method of imaging body structures based on the distribution of fixed water and other hydrogen-rich molecules in the human body. MRI uses a powerful magnet to align hydrogen atoms within the patient's soft tissues. As the nuclei return from excitation to equilibrium, the MRI receiver coil receives radio frequency wave signals that are transformed by the computer into diagnostic images. MRI produces cross sectional and 3-D images of soft tissues. Because bone contains little water (hydrogen nuclei), bone is relatively invisible to MRI. Blood is also relatively invisible because the hydrogen nuclei are moving in the blood stream.\n\nMRI contrast agents can improve the sensitivity and/or specificity of an image, by altering inherent tissue response to magnetic fields. The contrast agent most commonly used is gadolinium.\n\nMRI has proven useful in diagnosing cerebral infarctions, tumors, abscesses, edema, hemorrhage, nerve fiber demyelination (as in multiple sclerosis), and other disorders that increase fluid content of the affected tissues.\n\nMRI of the spinal canal has the advantage of noninvasive visualization of the spinal cord.\n\nMRI can:\n\n* Differentiate solid from cystic tumors,\n* Diagnose and localize spinal cord compression;\n* Diagnose syringomyelia (progressive, chronic sensory disturbance, atrophy and spasticity of the spinal cord), disc disease, and any altered relationship between vertebral bodies, discs, spinal cord and nerve roots;\n* Detect congenital spinal dysraphism (failure of fusion of parts along the dorsal midline of the spinal cord);\n* Provide early detection of osteomyelitis, and\n* Detect spinal cord abnormalities associated with osteomyelitis.\n\nCoverage is limited to MRI units that have received FDA pre-market approval. Such units must be operated within the parameters specified by the approval.\n\nContrast is indicated for studying the central nervous system for metastatic disease, inflammatory disease, recurrent tumor versus scar, differentiation of microvascular from macrovascular infarction, and selected cases of complex vascular disease. Within the study of the spine, contrast also is indicated to differentiate recurrent disc versus scar or granulation tissue, spinal cord neoplasm, any case of myelopathy, and inflammatory cord disease.\n\nHistory and clinical findings are critical factors to determine when a lumbar MRI is needed in order to efficiently manage low back pain and related disorders.\n\nLumbar MRI may be indicated for a patient with a \"red-flag\" condition, such as a suspected tumor, infection, herniated intervertebral disc with nerve compression, or a major neurological problem. The MRI test result may be needed to evaluate these conditions to determine the need for surgery or other aggressive therapy, such as a work-up for metastatic cancer.\n\n\"Red flags\" are identified through an appropriate history plus a physical examination that typically includes evaluating muscle strength, limb circumference, reflexes, sensation, straight leg raise, and sitting knee extension tests.\n\n\"Red flags\" include:\n\n* Major trauma\n* Minor trauma in a potentially osteoporotic patient\n* History of cancer\n* Fever\n* Chills\n* Unexplained weight loss\n* Recent bacterial infection\n* IV drug abuse\n* Immune suppression\n* Pain that worsens when supine or at night\n* Saddle anesthesia\n* Recent onset of bladder dysfunction\n* Clinically significant or progressive neurologic deficit in the lower extremity\n* Unexpected laxity of the anal sphincter\n* Perianal or perineal sensory loss,\n* Clinically significant motor weakness, or\n* Other nerve root compromise\n\nEighty (80) to ninety (90) percent of patients with low back pain improve one month after symptom onset even without treatment. Therefore, spinal imaging tests are not generally necessary during the first month of symptoms except when a \"red flag\" (suggesting a medically emergent condition) is noted on the medical history and physical examination. For a \"non-red flag\" condition, the MRI may be appropriate after 1 month of symptoms.\n\nFor example, for a patient with low back pain syndrome where there is no known injury, history of cancer, or septic disorder and there are no symptoms or signs suggesting nerve root disorder or spinal cord dysfunction (i.e. no \"red flags\"), MRI will be covered only if the patient has not responded to a reasonable trial of conservative management lasting at least four weeks.\n\nIf a patient's limitations due to low back symptoms do not improve within four weeks, findings on reassessment may reveal an indication for a MRI. However, since MRI changes are common in asymptomatic patients, MRI abnormalities alone do not retrospectively validate the need for the test without other supporting clinical rationale.\n\nA lumbar MRI used to evaluate uncomplicated degenerative disc disease or herniated nucleus pulposus is not considered medically necessary when a surgical intervention or other aggressive treatment (e.g. intervertebral joint injection) is not under consideration.\n\nWhen a lumbar MRI is ordered, Medicare expects that the information gained from the test will be used for medical decision-making. When the findings will not affect the treatment choices, the test is not reasonable or necessary.\n\nCertain uses of lumbar MRI are considered investigational and are therefore not covered by Medicare. These include the measurement of blood flow, spectroscopy, imaging of cortical bone and calcifications, and for procedures involving spatial resolution of bone or calcifications.\n\nA lumbar MRI that is a duplication of other imaging studies (such as a spinal CT scan) may be unreasonable or unnecessary. A lumbar MRI, however, could be complementary to a lumbar CT if there are inconclusive findings on a CT scan. Conversely, a lumbar CT may be warranted following an MRI study if the MRI study is found to be inconclusive. Documentation should support the medical necessity for the need for both studies.\n\nThe payment for a single lumbar MRI procedure includes two (2) and three (3) sequences.\n\nContraindications and limitations of lumbar MRI testing include:\n\n* Patients with an allergy to contrast media,\n* The effects upon a fetus are unknown at this time; therefore, pregnancy is to be handled at the discretion of the primary doctor,\n* When the technical component is performed without the professional component.\n\n(Payment paragraphs on multiple professional components and multi-position MRI omitted; they do not bear on coverage criteria.)";
const CRITERIA = "The criteria the agent checks, from L34220 (revision effective October 23, 2025).\n\nC1. A red-flag indication is present. The LCD's list: major trauma; minor trauma in a potentially osteoporotic patient; history of cancer; fever; chills; unexplained weight loss; recent bacterial infection; IV drug abuse; immune suppression; pain that worsens when supine or at night; saddle anesthesia; recent onset of bladder dysfunction; clinically significant or progressive neurologic deficit in the lower extremity; unexpected laxity of the anal sphincter; perianal or perineal sensory loss; clinically significant motor weakness; other nerve root compromise. A red flag counts as supported when a structured element of the record documents it (a Condition, Observation, Procedure, DiagnosticReport, or other discrete entry), with or without the note. A red flag stated only in the note, with nothing structured behind it, or one the structured record contradicts, is labeled undeterminable. It cannot carry an approval, and it does not block one that C2 carries; when the case is not approvable, the case routes rather than waiting on a document.\n\nReading of the neurologic items in C1 (adopted 2026-10-14, before any case was authored; reasons and sources in DATASHEET.md). The LCD describes red flags as findings that suggest a medically emergent condition and qualifies its neurologic items as clinically significant or progressive, and the American College of Radiology and American College of Physicians imaging guidance treat uncomplicated radiculopathy separately from red flags. So C1 is supported by objective nerve root or spinal cord compromise in the record: clinically significant or progressive weakness, a reduced or absent reflex, sensory loss in a nerve root pattern, new bladder or bowel dysfunction, or saddle or perianal sensory loss. Radiating leg pain or a positive straight leg raise on its own does not support C1, and such a case is assessed under C2.\nC2. For a non-red-flag condition, the patient \"has not responded to a reasonable trial of conservative management lasting at least four weeks,\" and the MRI is being considered after at least one month of symptoms. As for C1, conservative care stated only in the note, with nothing structured behind it (no therapy Procedure or medication order), or contradicted by the structured record, is labeled undeterminable.\nC3. The study will inform medical decision-making: a surgical intervention or other aggressive treatment (for example intervertebral joint injection) is under consideration, and the findings would affect treatment choices.\nC4. The study is not a duplication of other imaging (such as a spinal CT) unless documentation supports the need for both, for example inconclusive findings on the prior study.\n\nWhy C1 and C2 ask for more than the note: their note-only rules are this project's rule for automatic approval, not the policy's own wording. L34220 says red flags \"are identified through an appropriate history plus a physical examination\", which a visit note records. An agent that can never deny asks for a second source in the record before it approves, because the note is where an overstated claim or an embedded instruction would sit, and asking costs a reviewer's time, never a denial. For C1, a structured element is any entry in the record other than the visit note; an Observation counts whether it holds a number, a code, or text. For C2, it is a therapy Procedure or a medication order, as stated above.\n\nA case is approvable when C3 and C4 hold and either C1 or C2 holds with cited evidence. The criteria that apply to an approval are C3, C4, and whichever of C1 or C2 it rests on; the other is still labeled with its status.\n\nWhen a case is not approvable: request when one record element the provider could send would settle the question, naming the criterion and the element; route when the record contradicts itself on a criterion, even if a document could resolve it, or when the case could not be approved whatever such a document said. A status that rests on something the record does not contain (for example, no prior lumbar imaging for C4) is labeled with empty evidence.";

function rec(c){ if(!store[c]) store[c]={criteria:{},routing:"",gap_criterion:"",gap_missing:"",labeled_on:""}; CRIT.forEach(([k])=>{ if(!store[c].criteria[k]) store[c].criteria[k]={status:"",evidence:[]}; }); return store[c]; }

  lines.push("labeled_on: "+(r.labeled_on||today()));
  lines.push("criteria:");
  CRIT.forEach(([k])=>{ const x=r.criteria[k]; lines.push("  "+(k+":").padEnd(25)+"{status: "+(x.status||"")+", evidence: ["+x.evidence.join(", ")+"]}"); });
  lines.push("expected_routing:"+(r.routing?" "+r.routing:""));
  if(r.routing==="request" && r.gap_criterion) lines.push("named_gap: {criterion: "+r.gap_criterion+", missing: "+yq(r.gap_missing.trim())+"}"); else lines.push("named_gap: null");
  return lines.join("\n")+"\n";
}

  CASES.forEach((v,i)=>{ const b=document.createElement("button"); b.textContent=LABEL(v.case); b.className=(i===cur?"cur ":"")+(complete(v.case)?"done":""); b.onclick=()=>{cur=i;render();window.scrollTo(0,0);}; nav.appendChild(b); });

  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="check">Check my answers</button><button class="btn ghost" id="clear">Clear this case</button></div><p class="status" id="checkmsg"></p>';

  if(shown[c]) h+=checkHtml(c);

  const gc=document.getElementById("gapc"), gm=document.getElementById("gapm");

}

// Minimal zip writer (stored, no compression), so the page works offline with no libraries.
const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>>8)&255], u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(f=>{ const name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(local,name,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=local.length+name.length+data.length; });
  const csize=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:"application/zip"});
}

};

  return "<h3>Criteria (EVAL_PLAN.md, Criterion inventory)</h3>"+md(CRITERIA)+"<h3>Routing (CHARTER.md, authority statement)</h3>"+md(OUTPUTS)+"<h3>Policy text, LCD L34220</h3><p class='status'>"+esc(POLICY_HEAD).replace(/\n/g,"<br>")+"</p>"+md(POLICY_BODY);

the policy's list, and note:p2 says he was treated for a urinary tract infection in late July and finished antibiotics on August 4. It is recent (about two weeks before this visit) and bacterial (treated with antibiotics). But it appears only in the visit note: there is no Condition for the infection, no antibiotic order, and nothing else in the record behind it. The criteria say a red flag stated only in the note, with nothing structured behind it, is labeled undeterminable, and it can't carry an approval. The thigh heaviness with walking is not a red flag, because the exam shows full strength, normal reflexes, and normal sensation. Evidence: note:p2, the paragraph where the red flag is stated."}, "C2_conservative_4wk": {"status": "supported", "evidence": ["Procedure/practiceb-pt-01", "Encounter/practiceb-enc-03"], "also_fine": ["note:p3", "Condition/practiceb-cond-01", "Encounter/practiceb-enc-02"], "why": "Physical therapy from June 22 to August 10 is seven weeks (Procedure/practiceb-pt-01). The August 18 visit says the symptoms are unchanged after it (Encounter/practiceb-enc-03). Symptoms since May 18, about three months before the request. C2 gets its own status even though C1 has a problem: every criterion is labeled on its own terms."}, "C3_informs_management": {"status": "supported", "evidence": ["Encounter/practiceb-enc-03", "note:p5"], "also_fine": [], "why": "He is referred to spine surgery to discuss a decompression, so surgery is under consideration, and the assessment and plan (note:p5) say the MRI will look for narrowing of the spinal canal and its level before that visit, which is what decides whether and where surgery could help."}, "C4_no_duplicate_imaging": {"status": "supported", "evidence": [], "also_fine": [], "why": "No earlier lumbar imaging anywhere in the record, so the status rests on what the record does not contain and evidence stays empty."}}, "routing": "approve", "gap": null, "routing_why": "An approval needs C3 and C4, plus C1 or C2 const GUIDE_HTML = "\u003ch2>Labeling training\u003c/h2>\n\u003cp>This training teaches you to label the 12 cases, starting from zero. You don't need any medical or insurance background. It takes about two hours, and you can stop and come back at any point.\u003c/p>\n\u003cp>Nothing you do here is uploaded or counted, and none of the 12 real cases appears in it. The two practice cases were made up for this training and are not part of the 12.\u003c/p>\n\u003ch3>The plan\u003c/h3>\n\u003col>\u003cli>\u003cb>Open the practice page\u003c/b> (Part 1, 5 minutes).\u003c/li>\u003cli>\u003cb>Read the big picture:\u003c/b> what this project is and what your labels are for (Part 2, 10 minutes).\u003c/li>\u003cli>\u003cb>Skim the word list,\u003c/b> so you know where to find a word later (Part 3, 10 minutes).\u003c/li>\u003cli>\u003cb>Do the guided walkthrough:\u003c/b> label Practice A with step-by-step help (Part 4, 35 minutes).\u003c/li>\u003cli>\u003cb>Read the rules,\u003c/b> now that you've seen them used (Part 5, 15 minutes).\u003c/li>\u003cli>\u003cb>Label Practice B on your own,\u003c/b> then check your answers (Part 6, 20 minutes).\u003c/li>\u003cli>\u003cb>Read what the practice cases don't show\u003c/b> (Part 7, 5 minutes) and \u003cb>the habits for the 12 real cases\u003c/b> (Part 8, 5 minutes).\u003c/li>\u003c/ol>\n\u003cp>By the end you will have labeled two complete cases and seen the reasoning behind every answer.\u003c/p>\n\u003ch3>Part 1. Open the practice page\u003c/h3>\n\u003cp>If you're reading this inside the practice page, you've already done this part. Skip to Part 2.\u003c/p>\n\u003cp>\u003cb>Programs:\u003c/b> GitHub Desktop, Finder, and Google Chrome.\u003c/p>\n\u003col>\u003cli>Open \u003cb>GitHub Desktop\u003c/b>, the app that keeps your copy of the project up to date. At the top left, \u003cb>Current Repository\u003c/b> should say \u003cb>prior-auth-review-agent\u003c/b>; if not, click it and choose that name. Next to it, \u003cb>Current Branch\u003c/b> should say \u003cb>main\u003c/b>; if not, click it and choose \u003cb>main\u003c/b>.\u003c/li>\u003cli>Click \u003cb>Fetch origin\u003c/b> at the top right. If the button changes to \u003cb>Pull origin\u003c/b>, click it again. This downloads the newest version of the project to your Mac.\u003c/li>\u003cli>Open \u003cb>Finder\u003c/b>, press \u003cb>Cmd+Shift+G\u003c/b>, type \u003ccode class=\"id\">~/Projects/prior-auth-review-agent/eval/labeling\u003c/code> and press \u003cb>Return\u003c/b>. This opens the folder that holds the labeling pages.\u003c/li>\u003cli>Right-click \u003cb>training.html\u003c/b>, choose \u003cb>Open With\u003c/b>, then \u003cb>Google Chrome\u003c/b>.\u003c/li>\u003c/ol>\n\u003cp>\u003cb>What you should see:\u003c/b> a page titled \u003cb>Labeling Practice\u003c/b>. The first time, this guide opens on top of it; click \u003cb>Close\u003c/b> to see the page, and the \u003cb>Training guide\u003c/b> button at the top right brings the guide back at any time. At the top left are two buttons, \u003cb>Practice A\u003c/b> and \u003cb>Practice B\u003c/b>. At the top right, next to \u003cb>Training guide\u003c/b>, is \u003cb>Policy and criteria\u003c/b> (the official rules). The patient's record fills the left side of the page, and the answer form is on the right. The \u003cb>Previous case\u003c/b> and \u003cb>Next case\u003c/b> buttons under the form just switch between the two practice cases.\u003c/p>\n\u003cp>Make the Chrome window wide, so the record and the form sit side by side. Your practice answers are saved in Chrome automatically, and separately from your real labels, so nothing here can touch them.\u003c/p>\n\u003ch3>Part 2. The big picture\u003c/h3>\n\u003ch4>The situation\u003c/h4>\n\u003cp>Low back pain is very common, and most of it gets better on its own within a few weeks. An \u003cb>MRI\u003c/b> is a detailed scan made with a strong magnet. An MRI of the \u003cb>lumbar spine\u003c/b> (the lower back) is expensive, and early on it rarely changes what a doctor does.\u003c/p>\n\u003cp>So \u003cb>Medicare\u003c/b>, the U.S. government's health insurance for people 65 and older and some younger people (for example, people with certain disabilities), has written rules for when it will pay for a lower-back MRI. Those rules are a \u003cb>policy\u003c/b> called \u003cb>LCD L34220\u003c/b>. \"LCD\" stands for Local Coverage Determination: the coverage rules for one region, here the region that includes California, Nevada, and Hawaii. Many people with Medicare are in \u003cb>Medicare Advantage\u003c/b> plans, which are run by private insurance companies but must apply the same rules.\u003c/p>\n\u003cp>Before the scan is done, the doctor's office sends the plan a \u003cb>prior authorization request\u003c/b>: in effect, \"may we do this MRI, and will you pay for it?\" Someone at the plan, often a nurse, reads the patient's record and checks it against the policy's rules.\u003c/p>\n\u003ch4>What this project builds\u003c/h4>\n\u003cp>This project builds an AI tool (the project's documents call it the \u003cb>agent\u003c/b>) that does a first pass of that check. For each request it can do one of three things:\u003c/p>\n\u003cul>\u003cli>\u003cb>Approve\u003c/b> it, when the record clearly meets the rules.\u003c/li>\u003cli>\u003cb>Request\u003c/b> a missing piece of documentation from the doctor's office, when one item would settle the question.\u003c/li>\u003cli>\u003cb>Route\u003c/b> it to a physician (a doctor) to decide, in every other case.\u003c/li>\u003c/ul>\n\u003cp>It can never say no. Only a person can deny a request.\u003c/p>\n\u003ch4>What your job is\u003c/h4>\n\u003cp>To find out whether the tool gets things right, the project needs an \u003cb>answer key\u003c/b>, the way an exam needs one before it can be graded. The 12 real cases, with their answer key, are called the \u003cb>golden set\u003c/b>.\u003c/p>\n\u003cp>The key is made from three sets of answers to the same 12 cases: \u003cb>yours\u003c/b>, made first and on your own; the \u003cb>third reader's\u003c/b> (another AI model, Gemini, labeling the same cases separately); and answers Claude (the AI that helped build this project) wrote and locked away before labeling began, which stay encrypted until all the labels are in. Every place where they disagree, you settle by re-reading the policy. The settled answers are the key the tool is graded against.\u003c/p>\n\u003cp>You are \u003cb>not\u003c/b> diagnosing anyone. You are reading a record and checking it against written rules. Careful reading matters far more than medical knowledge, and this training explains the medical words you'll need.\u003c/p>\n\u003ch4>What a case is\u003c/h4>\n\u003cp>Each case is a \u003cb>made-up patient's record\u003c/b>, built to look like a real electronic health record (the digital chart a clinic keeps). No real person is in it. Each case shows the request, the patient's diagnoses, visits, treatments, and exam findings, and the visit note written by the \u003cb>clinician\u003c/b> (the doctor, nurse practitioner, or other professional who saw the patient).\u003c/p>\n\u003ch4>The five questions you answer for each case\u003c/h4>\n\u003cp>For every case you answer the same five questions, in the form on the right side of the page:\u003c/p>\n\u003col>\u003cli>\u003cb>C1, red flag:\u003c/b> does the record show a warning sign of something serious, from a list in the policy (for example, a recent bacterial infection, or certain nerve problems)?\u003c/li>\u003cli>\u003cb>C2, conservative care:\u003c/b> has the patient tried at least four weeks of treatment short of injections or surgery, such as physical therapy, without getting better? (\"Conservative\" here is a medical word meaning cautious.)\u003c/li>\u003cli>\u003cb>C3, informs management:\u003c/b> is surgery or another aggressive treatment, such as an injection in the spine, being considered, and would the MRI's result affect that choice?\u003c/li>\u003cli>\u003cb>C4, no duplicate imaging:\u003c/b> would this MRI duplicate imaging the patient already had (such as a spinal CT), unless the record shows why both are needed?\u003c/li>\u003cli>\u003cb>Routing:\u003c/b> given those four answers, should the case be approved, should a document be requested, or should it be routed to a physician?\u003c/li>\u003c/ol>\n\u003cp>C1 and C2 are \u003cb>alternatives\u003c/b>. A red flag is a reason not to wait for four weeks of treatment, so an approval needs C3 and C4 plus \u003cb>either\u003c/b> C1 \u003cb>or\u003c/b> C2, not both.\u003c/p>\n\u003cp>For each of C1 to C4 you pick one of three answers (\u003cb>supported\u003c/b>, \u003cb>unsupported\u003c/b>, or \u003cb>undeterminable\u003c/b>) and tick the parts of the record your answer is based on. The walkthrough in Part 4 shows you exactly how.\u003c/p>\n\u003ch3>Part 3. Words you'll see\u003c/h3>\n\u003cp>You don't need to memorize these. Skim them now, and come back when a word stops you. You may also look up what a medical word means in a dictionary, or on \u003cb>MedlinePlus\u003c/b> (medlineplus.gov, the U.S. National Library of Medicine's plain-language health site). Type just the word, never a sentence from a case. Never search for how to label a case, and never put any part of a case into an AI tool.\u003c/p>\n\u003ch4>The body and back pain\u003c/h4>\n\u003cul>\u003cli>\u003cb>Lumbar spine:\u003c/b> the lower back. \u003cb>Vertebrae\u003c/b> are the bones of the spine. \u003cb>Discs\u003c/b> are the cushions between them. A \u003cb>level\u003c/b> is one spot along the spine, named by the vertebrae there.\u003c/li>\u003cli>\u003cb>Lumbosacral junction:\u003c/b> where the lumbar spine meets the \u003cb>sacrum\u003c/b>, the bone at the back of the pelvis.\u003c/li>\u003cli>\u003cb>Nerve root:\u003c/b> where a nerve leaves the spine. An irritated or pinched nerve root can cause pain, tingling, numbness, or weakness along that nerve, often down a leg. \u003cb>Nerve root compromise\u003c/b> means trouble with a nerve root.\u003c/li>\u003cli>\u003cb>Nerve root pattern:\u003c/b> the strip of skin that one nerve root supplies. Numbness \"in a nerve root pattern\" follows that strip, rather than being everywhere.\u003c/li>\u003cli>\u003cb>Radiating pain:\u003c/b> pain that travels from the back down a leg. \u003cb>Sciatica\u003c/b> is radiating pain down the back of the leg.\u003c/li>\u003cli>\u003cb>Radiculopathy:\u003c/b> a diagnosis meaning an irritated or pinched nerve root.\u003c/li>\u003cli>\u003cb>Spinal cord and spinal canal:\u003c/b> the spinal cord is the bundle of nerves running inside the spine; the canal is the tunnel it runs through. \u003cb>Stenosis\u003c/b> means a narrowing of that canal.\u003c/li>\u003cli>\u003cb>Neurogenic claudication:\u003c/b> heaviness or pain in the legs when walking, caused by a narrowed spinal canal. It eases when the person sits or bends forward.\u003c/li>\u003cli>\u003cb>Herniated disc\u003c/b> (also called \u003cb>herniated nucleus pulposus\u003c/b>): a disc whose soft center pushes out through its tougher outer ring and can press on a nerve. \u003cb>Degenerative disc disease:\u003c/b> wear and tear of the discs.\u003c/li>\u003cli>\u003cb>Bilateral:\u003c/b> on both sides. \u003cb>Symmetric:\u003c/b> the same on both sides. \u003cb>Supine:\u003c/b> lying flat on the back.\u003c/li>\u003cli>\u003cb>Flexion:\u003c/b> bending forward. \u003cb>Extension:\u003c/b> bending backward.\u003c/li>\u003c/ul>\n\u003ch4>Exam words\u003c/h4>\n\u003cul>\u003cli>\u003cb>Tenderness:\u003c/b> pain when an area is pressed.\u003c/li>\u003cli>\u003cb>Straight leg raise:\u003c/b> while the patient lies on their back, the examiner lifts one straightened leg. If that brings on the leg pain, the test is \u003cb>positive\u003c/b>, which suggests an irritated nerve root. \u003cb>Negative\u003c/b> means it didn't.\u003c/li>\u003cli>\u003cb>Strength 5/5:\u003c/b> muscle strength is graded from 0 (no movement) to 5 (normal). \u003cb>Weakness\u003c/b> means a grade below 5. \u003cb>Motor\u003c/b> means to do with muscles and movement, so \u003cb>motor weakness\u003c/b> is muscle weakness.\u003c/li>\u003cli>\u003cb>Reflexes:\u003c/b> the automatic jerk when a tendon is tapped, at the knee (\u003cb>patellar\u003c/b>) or the ankle (\u003cb>Achilles\u003c/b>). \u003cb>2+\u003c/b> is normal; \u003cb>1+\u003c/b> is reduced; \u003cb>0\u003c/b> is absent.\u003c/li>\u003cli>\u003cb>Sensation:\u003c/b> the ability to feel touch. \u003cb>Sensory loss\u003c/b> means reduced or absent feeling (numbness).\u003c/li>\u003cli>\u003cb>Pulses:\u003c/b> the heartbeat felt in an artery. \u003cb>Dorsalis pedis\u003c/b> is the pulse on the top of the foot. Pulses are graded like reflexes, and 2+ is normal.\u003c/li>\u003cli>\u003cb>Neurologic deficit:\u003c/b> a measurable problem with the nerves, such as weakness, a reduced reflex, or numbness. \u003cb>Neurologically intact\u003c/b> or \u003cb>without neurologic deficit\u003c/b> means none was found.\u003c/li>\u003cli>\u003cb>Pain score:\u003c/b> a number from 0 (no pain) to 10 (the worst), such as 6/10.\u003c/li>\u003c/ul>\n\u003ch4>The red-flag words\u003c/h4>\n\u003cp>These words come from the red-flag list and the policy text around it. Part 5 explains how the list is used.\u003c/p>\n\u003cul>\u003cli>\u003cb>Trauma:\u003c/b> an injury. \u003cb>Osteoporosis:\u003c/b> thinning bones that break easily. \u003cb>Potentially osteoporotic:\u003c/b> someone whose bones may be thin.\u003c/li>\u003cli>\u003cb>Cancer\u003c/b> that is \u003cb>metastatic\u003c/b> has spread from where it started to other parts of the body.\u003c/li>\u003cli>\u003cb>Bacterial infection:\u003c/b> an infection caused by bacteria.\u003c/li>\u003cli>\u003cb>Immune suppression:\u003c/b> a weakened immune system, so the body fights infection less well. It can come from some illnesses, or from medicines such as long-term steroid pills, chemotherapy, or anti-rejection medicines after an organ transplant.\u003c/li>\u003cli>\u003cb>IV drug abuse:\u003c/b> injecting drugs into a vein.\u003c/li>\u003cli>\u003cb>Saddle anesthesia:\u003c/b> numbness in the area that would touch a saddle (the buttocks, inner thighs, and groin). \u003cb>Perianal or perineal sensory loss:\u003c/b> numbness around the anus or between the legs.\u003c/li>\u003cli>\u003cb>Bladder dysfunction:\u003c/b> trouble controlling or emptying the bladder. \u003cb>Laxity of the anal sphincter:\u003c/b> looseness of the muscle that keeps the bowel closed.\u003c/li>\u003cli>\u003cb>Clinically significant:\u003c/b> important enough to matter for the patient's care. \u003cb>Progressive:\u003c/b> getting worse over time. The policy doesn't define either more exactly.\u003c/li>\u003c/ul>\n\u003ch4>Tests and treatments\u003c/h4>\n\u003cul>\u003cli>\u003cb>MRI:\u003c/b> a detailed scan made with a strong magnet. \u003cb>Contrast:\u003c/b> a dye injected so some things show up better; \"without contrast\" means no dye.\u003c/li>\u003cli>\u003cb>CT scan:\u003c/b> a detailed scan made with X-rays. \u003cb>X-ray:\u003c/b> a picture made with X-rays, mostly used to show bones.\u003c/li>\u003cli>\u003cb>Conservative care:\u003c/b> treatment short of injections or surgery, such as physical therapy, exercises, or pain medicine.\u003c/li>\u003cli>\u003cb>Physical therapy:\u003c/b> exercises and hands-on treatment with a physical therapist, usually over several weeks. A \u003cb>home program\u003c/b> is exercises the patient does at home.\u003c/li>\u003cli>\u003cb>NSAID:\u003c/b> a common type of anti-inflammatory pain medicine, such as ibuprofen or naproxen. \u003cb>Acetaminophen\u003c/b> (Tylenol) is another common pain medicine.\u003c/li>\u003cli>\u003cb>Antibiotics:\u003c/b> medicines that treat infections caused by bacteria. A \u003cb>urinary tract infection\u003c/b> (UTI) is an infection of the bladder or the tubes that carry urine.\u003c/li>\u003cli>\u003cb>Epidural steroid injection:\u003c/b> a shot of anti-inflammatory medicine placed next to an irritated nerve in the spine.\u003c/li>\u003cli>\u003cb>Intervertebral joint injection:\u003c/b> an injection into one of the joints between two vertebrae. It is the policy's own example of an \"aggressive treatment.\"\u003c/li>\u003cli>\u003cb>Decompression:\u003c/b> surgery that makes more room for squeezed nerves.\u003c/li>\u003cli>\u003cb>Pain management:\u003c/b> a clinic that specializes in treating pain, including with injections.\u003c/li>\u003cli>\u003cb>Urgent care:\u003c/b> a walk-in clinic for problems that need care the same day.\u003c/li>\u003cli>\u003cb>Work-up:\u003c/b> a set of tests to find out what is going on.\u003c/li>\u003c/ul>\n\u003ch4>Record words\u003c/h4>\n\u003cul>\u003cli>\u003cb>Request:\u003c/b> the prior authorization request, shown at the top of each case. Its id starts with \u003cb>Claim/\u003c/b>, the record's technical name for a request. \"Use: preauthorization\" means the office is asking before the scan is done; \"priority: Normal\" means it isn't urgent.\u003c/li>\u003cli>\u003cb>Conditions:\u003c/b> the patient's list of diagnoses. Each has an \u003cb>onset date\u003c/b> (when it started). \"Clinical status: active\" means a current problem. The codes in brackets, such as ICD-10-CM M54.16, are billing codes you can ignore.\u003c/li>\u003cli>\u003cb>Visits:\u003c/b> the patient's appointments, each with a one-line summary. Their ids start with \u003cb>Encounter/\u003c/b>, the record's name for a visit. \u003cb>Ambulatory\u003c/b> means an office visit, not a hospital stay.\u003c/li>\u003cli>\u003cb>Procedures:\u003c/b> treatments or tests that were done, with their dates.\u003c/li>\u003cli>\u003cb>Imaging reports:\u003c/b> the written results of earlier scans or X-rays. Their ids start with \u003cb>DiagnosticReport/\u003c/b>.\u003c/li>\u003cli>\u003cb>Medications:\u003c/b> medicines a clinician ordered, with their dates. Their ids start with \u003cb>MedicationRequest/\u003c/b>.\u003c/li>\u003cli>\u003cb>Observations:\u003c/b> findings recorded in the chart, such as an exam result or a weight. \u003cb>Narrative\u003c/b> means written in words rather than numbers.\u003c/li>\u003cli>\u003cb>Visit note:\u003c/b> the clinician's own write-up of the last visit, in numbered paragraphs (\u003cb>note:p1\u003c/b>, \u003cb>note:p2\u003c/b>, and so on). The id starting with \u003cb>DocumentReference/\u003c/b> means the whole note. When the note is your evidence, tick the paragraph instead.\u003c/li>\u003cli>\u003cb>Impression\u003c/b> or \u003cb>assessment:\u003c/b> the clinician's summary of what is going on. \u003cb>Plan:\u003c/b> what happens next.\u003c/li>\u003cli>\u003cb>Provider:\u003c/b> the doctor's office or clinic that sent the request.\u003c/li>\u003cli>\u003cb>Id:\u003c/b> the short blue label at the start of each item, such as \u003ccode class=\"id\">Procedure/practicea-pt-01\u003c/code>. You tick ids to show what your answer is based on.\u003c/li>\u003c/ul>\n\u003cp>A case shows a section only when it has something in it. A case with no Medications section simply has no medication orders.\u003c/p>\n\u003ch4>Labeling words\u003c/h4>\n\u003cul>\u003cli>\u003cb>Criterion\u003c/b> (plural \u003cb>criteria\u003c/b>): one of the four questions, C1 to C4.\u003c/li>\u003cli>\u003cb>Supported:\u003c/b> the record shows the criterion is met. \u003cb>Unsupported:\u003c/b> the record shows it is not met. \u003cb>Undeterminable:\u003c/b> the record doesn't let you decide either way, or it contradicts itself. (The short legend at the top of the form leaves out \"or it contradicts itself,\" but it still applies.)\u003c/li>\u003cli>\u003cb>Evidence:\u003c/b> the ids your answer is based on. The evidence list under each question shows every id on the page, including the request and the patient; most answers need only a few. Each id matches the blue label at the start of an item on the left, so look there to see which item it is.\u003c/li>\u003cli>\u003cb>Structured entry:\u003c/b> any item in the lists at the top of the record (Conditions, Visits, Procedures, Imaging reports, Medications, Observations), as opposed to the free-text visit note. An Observation written in words is still a structured entry.\u003c/li>\u003cli>\u003cb>Contradiction:\u003c/b> two parts of the record saying opposite things about the same fact.\u003c/li>\u003cli>\u003cb>Routing:\u003c/b> the outcome for the whole case. Its three answers are \u003cb>approve\u003c/b>, \u003cb>request\u003c/b>, and \u003cb>route\u003c/b> (send to a physician).\u003c/li>\u003cli>\u003cb>Gap:\u003c/b> for a request, the criterion and the missing item you name. The form asks for it when you choose request.\u003c/li>\u003c/ul>\n\u003ch3>Part 4. The guided walkthrough (Practice A)\u003c/h3>\n\u003cp>This is where you learn by doing. The walkthrough labels Practice A with you, one step at a time.\u003c/p>\n\u003col>\u003cli>Click \u003cb>Close\u003c/b> on this guide.\u003c/li>\u003cli>Click \u003cb>Practice A\u003c/b> at the top left, if it isn't already selected.\u003c/li>\u003cli>At the top of the right side, click \u003cb>Start the guided walkthrough\u003c/b>.\u003c/li>\u003c/ol>\n\u003cp>A box appears at the top of the right side with the first step. At each step, the part of the record it talks about is \u003cb>highlighted\u003c/b> in yellow on the left, and the page scrolls to it. When a step asks you to click something in the form, that part of the form is highlighted too, and so are the evidence boxes to tick. Use \u003cb>Next\u003c/b> and \u003cb>Back\u003c/b> to move between steps. If the box says \u003cb>More in this box, scroll down\u003c/b>, scroll inside the box to read the rest before clicking Next. If you close the page, it remembers which step you were on.\u003c/p>\n\u003cp>Go slowly. Read each highlighted part of the record yourself before you read the step's explanation. The goal isn't only to get Practice A right; it's to learn the order of looking, which you'll use on every case.\u003c/p>\n\u003cp>When you finish, come back to this guide and read Part 5 before Practice B.\u003c/p>\n\u003cp>The same steps are written out at the end of this guide, under \"The walkthrough, in writing,\" if you'd rather read them first or print them.\u003c/p>\n\u003ch3>Part 5. The rules, explained\u003c/h3>\n\u003cp>This part restates the official rules in plain words. You've seen most of them used in the walkthrough; here they are in one place, including the ones Practice A didn't need.\u003c/p>\n\u003cp>\u003cb>About the Policy and criteria panel.\u003c/b> It has three parts. \u003cb>Criteria:\u003c/b> C1 to C4 and, at the end, the rules for approve, request, and route. These are the ones you'll use most. \u003cb>Routing:\u003c/b> the three outputs the tool may give. (Both headings name the project files the text comes from, EVAL_PLAN.md and CHARTER.md; you can ignore the file names.) \u003cb>Policy text:\u003c/b> the full policy, which is long and technical; you don't need to understand all of it. If this guide and the criteria ever seem to differ, the criteria win. Where the policy text reads more broadly than the criteria (for example on the nerve items), follow the criteria: they say how this project reads the policy.\u003c/p>\n\u003ch4>The three answers, and evidence\u003c/h4>\n\u003cul>\u003cli>\u003cb>Supported:\u003c/b> the record shows the criterion is met. You can point to where.\u003c/li>\u003cli>\u003cb>Unsupported:\u003c/b> the record shows the criterion is not met. You can point to that too, or the record plainly lacks what the criterion needs.\u003c/li>\u003cli>\u003cb>Undeterminable:\u003c/b> the record doesn't let you decide either way, or two parts of it contradict each other.\u003c/li>\u003c/ul>\n\u003cp>A good test for each criterion is to ask yourself: \"What in the record shows this?\" If you can point to it, the answer is supported or unsupported. If the record leaves the question open, or two parts disagree, the answer is undeterminable.\u003c/p>\n\u003cp>\u003cb>Evidence\u003c/b> is the set of ids your answer is based on. Under each criterion, click \u003cb>Evidence (0 selected)\u003c/b> and tick them. Leave evidence empty when your answer rests on something the record does \u003cb>not\u003c/b> contain, for example no earlier scan for C4.\u003c/p>\n\u003cp>When your labels are compared with others', the answer (supported, unsupported, or undeterminable) matters most. Small differences in which ids people tick are normal and get talked through.\u003c/p>\n\u003ch4>Why the note alone isn't enough for C1 and C2\u003c/h4>\n\u003cp>For C1 and C2, this project has a rule: the visit note alone is not enough. A red flag, or a course of conservative care, also has to show up in a \u003cb>structured entry\u003c/b> (an item in one of the lists at the top of the record; for C2, only a therapy in Procedures or a medication order counts). The reason is that the tool can approve requests automatically, and the note is the easiest place for a claim to be overstated, so the project asks for a second source in the record before an approval rests on what the note says. For C3 and C4, the note counts on its own.\u003c/p>\n\u003ch4>C1. A red flag is present\u003c/h4>\n\u003cp>A \u003cb>red flag\u003c/b> is a warning sign that something more serious than ordinary back pain could be going on, so waiting a month would be wrong. The policy lists them. Here is the list exactly as the criteria give it, grouped under headings to make it easier to scan (the words in parentheses are plain explanations, not part of the rule):\u003c/p>\n\u003cul>\u003cli>\u003cb>Injury and bone:\u003c/b> major trauma; minor trauma in a potentially osteoporotic patient (a minor fall or knock in someone whose bones may be thin).\u003c/li>\u003cli>\u003cb>Cancer:\u003c/b> history of cancer.\u003c/li>\u003cli>\u003cb>Infection and the immune system:\u003c/b> fever; chills; recent bacterial infection; IV drug abuse; immune suppression.\u003c/li>\u003cli>\u003cb>Weight:\u003c/b> unexplained weight loss.\u003c/li>\u003cli>\u003cb>Pain pattern:\u003c/b> pain that worsens when supine (lying flat on the back) or at night.\u003c/li>\u003cli>\u003cb>Nerves and spinal cord:\u003c/b> saddle anesthesia; recent onset of bladder dysfunction; clinically significant or progressive neurologic deficit in the lower extremity (a nerve problem in the leg that is serious or getting worse); unexpected laxity of the anal sphincter; perianal or perineal sensory loss; clinically significant motor weakness; other nerve root compromise.\u003c/li>\u003c/ul>\n\u003cp>Anything not on the list is not a red flag for this criterion, however serious it sounds. An item on the list can turn up anywhere in the record, in any paragraph, and it doesn't have to look connected to the back: what matters is whether the record meets the list's words.\u003c/p>\n\u003cp>\u003cb>The nerve items, as this project reads them.\u003c/b> The criteria spell this out: C1 is supported by \u003cb>objective\u003c/b> nerve root or spinal cord compromise in the record, which they list as:\u003c/p>\n\u003cul>\u003cli>clinically significant or progressive weakness\u003c/li>\u003cli>a reduced or absent reflex\u003c/li>\u003cli>sensory loss (numbness) in a nerve root pattern\u003c/li>\u003cli>new bladder or bowel trouble\u003c/li>\u003cli>numbness in the saddle area or around the anus\u003c/li>\u003c/ul>\n\u003cp>Radiating leg pain, or a positive straight leg raise, does \u003cb>not\u003c/b> support C1 on its own. A case like that is judged under C2 instead. For the same reason, a diagnosis name such as \"radiculopathy\" in Conditions, without one of the signs above, doesn't count for the nerve items. This applies to the nerve items only; for the other items, a structured entry that names the red flag shows it.\u003c/p>\n\u003cp>\u003cb>Where the red flag is written decides the answer:\u003c/b>\u003c/p>\n\u003cul>\u003cli>\u003cb>Supported\u003c/b> when a structured entry shows the red flag: a Condition, an Observation, a Procedure, an Imaging report, a medication order, or any other entry that is not the visit note. An Observation counts whether it holds a number, a code, or text.\u003c/li>\u003cli>\u003cb>Undeterminable\u003c/b> when the red flag appears \u003cb>only in the note\u003c/b>, with nothing in the structured entries behind it, or when the structured record \u003cb>contradicts\u003c/b> it. Either way, C1 can't carry an approval. It doesn't block an approval that C2 carries, but if the case can't be approved, it goes to a physician rather than waiting on a document for C1.\u003c/li>\u003cli>\u003cb>Unsupported\u003c/b> when nothing on the list appears anywhere in the record, or what appears doesn't meet the list's words (for example, leg pain with a normal nerve exam).\u003c/li>\u003c/ul>\n\u003cp>A contradiction means two parts of the record say opposite things about the same fact. For example, if the note said \"temperature 101\" but the vital signs recorded at the same visit said 98.6, the structured entry would contradict the note.\u003c/p>\n\u003cp>\u003cb>Step-by-step check for C1:\u003c/b>\u003c/p>\n\u003col>\u003cli>Read the whole record first, every note paragraph included. Look for anything on the list.\u003c/li>\u003cli>If you find nothing on the list, C1 is \u003cb>unsupported\u003c/b>. Evidence can stay empty, because the answer rests on what the record does not contain. If a particular exam is what settled it for you (for example, one showing that a leg finding falls short), you may tick it instead. Either is fine.\u003c/li>\u003cli>For a nerve finding, check it against the nerve reading above. Leg pain or a positive straight leg raise alone does not count.\u003c/li>\u003cli>For a red flag that is on the list, find where it is written. If a structured entry shows it and the structured record doesn't contradict it, C1 is \u003cb>supported\u003c/b>; tick that entry.\u003c/li>\u003cli>If it's only in the note, or the structured record contradicts it, C1 is \u003cb>undeterminable\u003c/b>. Tick the note paragraph, and the contradicting entry if there is one.\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Words that carry a condition.\u003c/b> Some items include a qualifier: \"unexplained\" weight loss, \"potentially osteoporotic,\" \"recent\" bacterial infection, \"clinically significant,\" or \"progressive.\" The policy gives no exact cut-off for any of them (no number of weeks for \"recent,\" for example). Read them literally, and check whether the record says enough to meet the words. If the record truly doesn't let you decide, that is what undeterminable is for.\u003c/p>\n\u003ch4>C2. Four weeks of conservative care that hasn't worked\u003c/h4>\n\u003cp>The official wording: for a non-red-flag condition, the patient \"has not responded to a reasonable trial of conservative management lasting at least four weeks,\" and the MRI is being considered after at least one month of symptoms.\u003c/p>\n\u003cp>So C2 has three parts, and all three must hold:\u003c/p>\n\u003col>\u003cli>\u003cb>A reasonable trial of conservative care for at least four weeks, in the right kind of entry:\u003c/b> a therapy in Procedures, or an order in Medications for a medicine given for the back pain. Medicines for other conditions are not conservative care. For C2, only these two kinds of entry count; the note, or a visit summary that mentions treatment, isn't enough by itself.\u003c/li>\u003cli>\u003cb>No response:\u003c/b> the latest visit or the note says the care hasn't helped.\u003c/li>\u003cli>\u003cb>At least a month of symptoms\u003c/b> before the request. Compare the low back pain Condition's onset date with the request date at the top of the page.\u003c/li>\u003c/ol>\n\u003cp>\u003cb>How to count four weeks.\u003c/b> Use the dates printed on the entry: a Procedure's \"2026-06-15 to 2026-08-03,\" or a medication's \"dosage period.\" Four weeks is 28 days. For example, June 1 to June 29 is exactly four weeks. A calendar makes this easy. Some entries show only a start date (\"from 2026-07-20\") and a status saying they are still going: no end date is recorded.\u003c/p>\n\u003cp>\u003cb>Note-only care.\u003c/b> Conservative care that appears only in the note, with no therapy Procedure or medication order behind it, or that a structured entry contradicts, is \u003cb>undeterminable\u003c/b>. Unlike C1, the criteria don't say this alone routes the case; the routing questions below decide that.\u003c/p>\n\u003cp>C2 always gets its own answer, even when C1 is supported. The criteria say the criterion an approval doesn't rest on \"is still labeled with its status.\"\u003c/p>\n\u003ch4>C3. The MRI will change what happens next\u003c/h4>\n\u003cp>The official wording: \"a surgical intervention or other aggressive treatment (for example intervertebral joint injection) is under consideration, and the findings would affect treatment choices.\"\u003c/p>\n\u003cp>Two parts:\u003c/p>\n\u003col>\u003cli>\u003cb>Surgery or another aggressive treatment is under consideration.\u003c/b> The criteria's example is an intervertebral joint injection (an injection into a joint of the spine). Look at the latest visit and the note's assessment and plan.\u003c/li>\u003cli>\u003cb>The MRI's findings would affect the treatment choice.\u003c/b> Ask what in the record shows that.\u003c/li>\u003c/ol>\n\u003cp>The note counts as evidence for C3 on its own.\u003c/p>\n\u003ch4>C4. Not a duplicate of earlier imaging\u003c/h4>\n\u003cp>The official wording: \"The study is not a duplication of other imaging (such as a spinal CT) unless documentation supports the need for both, for example inconclusive findings on the prior study.\"\u003c/p>\n\u003cp>Look for earlier imaging of the lower back in Procedures, Imaging reports, and the note.\u003c/p>\n\u003cul>\u003cli>\u003cb>No earlier lower-back imaging anywhere:\u003c/b> supported, with \u003cb>empty\u003c/b> evidence. The answer rests on what the record does not contain.\u003c/li>\u003cli>\u003cb>Earlier lower-back imaging exists:\u003c/b> ask whether the MRI would duplicate it (the criteria's example is a spinal CT). If it would, check whether the record documents the need for both, such as an inconclusive result on the earlier study, and label from what you find. If you decide it would not duplicate it, the \"unless\" part doesn't apply; label from what you find, and tick what your answer rests on.\u003c/li>\u003c/ul>\n\u003cp>The note counts as evidence for C4 on its own.\u003c/p>\n\u003ch4>Routing the case\u003c/h4>\n\u003cp>After the four criteria, choose one outcome. Ask these questions in order, and stop at the first \"yes\":\u003c/p>\n\u003col>\u003cli>\u003cb>Are C3 and C4 supported, and C1 or C2 supported with cited evidence?\u003c/b> Approve. A case needs a red flag \u003cb>or\u003c/b> a failed four-week trial, not both. (C4's evidence can be empty when there's no earlier imaging; that still counts as supported.) A red flag stated only in the note, or one the structured record contradicts, leaves C1 undeterminable, so it can't be what the approval rests on; but it doesn't stop an approval that C2 carries.\u003c/li>\u003cli>\u003cb>Otherwise the case can't be approved. Is there a red flag stated only in the note, or one the structured record contradicts?\u003c/b> Route. A possible red flag goes to a physician rather than waiting on a document.\u003c/li>\u003cli>\u003cb>Does the record contradict itself on any criterion?\u003c/b> Route, even if a document could clear it up.\u003c/li>\u003cli>\u003cb>Would one record item that the doctor's office could send settle the open question?\u003c/b> Request it, naming the criterion and the missing item. If no single document could make the case approvable, route. A request is never for C1 (question 2 and the project's routing rule, ARCHITECTURE.md, ADR-10).\u003c/li>\u003c/ol>\n\u003cp>These questions restate the criteria's own sentences: \"A case is approvable when C3 and C4 hold and either C1 or C2 holds with cited evidence\"; C1's sentence that such a red flag \"cannot carry an approval, and it does not block one that C2 carries; when the case is not approvable, the case routes rather than waiting on a document\"; and, when a case is not approvable, \"request when one record element the provider could send would settle the question, naming the criterion and the element; route when the record contradicts itself on a criterion, even if a document could resolve it, or when the case could not be approved whatever such a document said.\" (The panel's routing text says to approve \"when every applicable criterion is supported.\" The applicable ones are C3, C4, and one of C1 or C2.)\u003c/p>\n\u003cp>\u003cb>Filling in a request.\u003c/b> Click \u003cb>request\u003c/b>. Two boxes appear. In the first, pick the criterion the gap belongs to (C1 to C4). In the second, type the missing item in a few plain words, then click anywhere outside the box so it saves.\u003c/p>\n\u003ch3>Part 6. Your turn (Practice B)\u003c/h3>\n\u003cp>Now label a case on your own.\u003c/p>\n\u003col>\u003cli>Click \u003cb>Practice B\u003c/b> at the top left. A \u003cb>Your turn\u003c/b> box at the top of the right side has a checklist of the order to look in, if you want it.\u003c/li>\u003cli>Work through the case the way the walkthrough did: read the whole record from top to bottom, then answer C1, C2, C3, and C4, then the routing.\u003c/li>\u003cli>When the line under the form turns green, click \u003cb>Check my answers\u003c/b>. The worked answer appears below your form, with the reasoning for each question. (If you click it before you've finished, the page offers to show the worked answer anyway. Don't take that offer unless you're truly stuck, because it shows every answer at once.)\u003c/li>\u003cli>Read every explanation, especially where your answer differs. A difference is the most useful part of practice, not a failure.\u003c/li>\u003c/ol>\n\u003cp>If you get stuck, use Part 5 and the \u003cb>Policy and criteria\u003c/b> panel, just as you will on the real cases. To try a case again, click \u003cb>Clear this case\u003c/b>.\u003c/p>\n\u003ch3>Part 7. What the practice cases don't show\u003c/h3>\n\u003cp>Both practice cases are fairly simple on C2, C3, and C4: weeks of physical therapy, a plan that names an injection or surgery, and no earlier imaging. Real cases can have things the practice cases don't, such as medication orders, earlier imaging, a red flag in a structured entry, a contradiction, or a documentation request.\u003c/p>\n\u003cp>That's on purpose. A practice case for each of those paths would look a lot like one of the 12, and then your labels would partly be Claude's reading instead of your own. So for those, use Part 5 and the official wording, and decide from the record in front of you. A few reminders:\u003c/p>\n\u003cul>\u003cli>\u003cb>The three answers work the same way everywhere.\u003c/b> Supported: the record shows the criterion is met. Unsupported: the record shows it isn't. Undeterminable: the record doesn't let you decide, or contradicts itself.\u003c/li>\u003cli>\u003cb>Routing always follows the four questions in Part 5, in order.\u003c/b>\u003c/li>\u003cli>\u003cb>A request names one criterion and one missing item\u003c/b> the doctor's office could send, in a few plain words.\u003c/li>\u003cli>\u003cb>A label can turn on a word\u003c/b> the policy doesn't define exactly, such as \"recent,\" \"clinically significant,\" or \"duplication.\" If one does, read it literally, decide what the record supports, and put the case on your paper list. Those cases are what the settling step is for, and a careful label you can explain is worth more than a guess at what anyone intended.\u003c/li>\u003c/ul>\n\u003ch3>Part 8. Habits for the 12 real cases\u003c/h3>\n\u003cul>\u003cli>\u003cb>Read the whole record before answering anything,\u003c/b> in the same order as the walkthrough: request, patient, Conditions, Visits, Procedures, Imaging reports, Medications, Observations, then the note, paragraph by paragraph.\u003c/li>\u003cli>\u003cb>For each answer, ask \"What in the record shows this?\"\u003c/b> Then tick those ids.\u003c/li>\u003cli>\u003cb>Approve only when C3 and C4 hold and you can point to the evidence\u003c/b> for whichever of C1 or C2 the approval rests on. That's the approve rule itself.\u003c/li>\u003cli>\u003cb>When the record truly doesn't let you decide,\u003c/b> use undeterminable. It's a real answer, not a failure.\u003c/li>\u003cli>\u003cb>Keep a short paper list\u003c/b> of case numbers that felt hard, with a sentence on why. Those are the first ones to look at when disagreements are settled.\u003c/li>\u003cli>\u003cb>Pace:\u003c/b> about 12 minutes a case, and three or four cases a sitting.\u003c/li>\u003cli>\u003cb>What you may use:\u003c/b> the labeling page, its \u003cb>Policy and criteria\u003c/b> panel, a printed copy of the cases if you made one, this guide, and a dictionary or MedlinePlus for what a single word means. Never search for how to label a case, never put any part of a case into an AI tool, and don't ask anyone about a case until your labels are in.\u003c/li>\u003cli>\u003cb>You are not the last word.\u003c/b> Your labels, the third reader's, and the locked answers are compared, and every disagreement is settled against the policy text. If a label is still split after re-reading the policy, it becomes undeterminable and the case routes. Hard calls are expected, and they're what the settling step is for.\u003c/li>\u003c/ul>\n\u003cp>Questions about the practice cases or the rules are welcome before you start the 12.\u003c/p>\n\u003ch3>The walkthrough, in writing\u003c/h3>\n\u003cp>These are the steps the guided walkthrough shows for Practice A, for reading ahead or printing. On the practice page, each step also highlights the part of the record it talks about.\u003c/p>\n\u003ch4>Step 1. The request: what is being asked for\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">Claim/practicea-claim\u003c/code>.\u003c/p>\n\u003cp>Every case starts with the \u003cb>request\u003c/b>. A clinic is asking the patient's insurance plan to approve an \u003cb>MRI of the lumbar spine\u003c/b>: a detailed scan of the lower back. \"Without contrast\" means no dye is injected. \"Use: preauthorization\" means the clinic is asking \u003cb>before\u003c/b> the scan. \"Priority: Normal\" means it isn't urgent.\u003c/p>\n\u003cp>The blue id starts with \u003cb>Claim/\u003c/b>, which is the record's technical name for a request. The long code (SNOMED CT 241648005) is a standard code for the test; you can ignore it.\u003c/p>\n\u003cp>\u003cb>Write down the request date: August 19, 2026.\u003c/b> You'll use it to count how long the symptoms have lasted.\u003c/p>\n\u003ch4>Step 2. The patient\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">Patient/8f48ea64-12eb-a55e-c747-42fd4dab5908\u003c/code>.\u003c/p>\n\u003cp>A 62-year-old woman. She is under 65, and some younger people have Medicare too, for example because of a disability; the record doesn't need to say why.\u003c/p>\n\u003cp>Read the age and sex, but they rarely decide anything by themselves. The long string of letters and numbers is just the patient's id in the record.\u003c/p>\n\u003ch4>Step 3. Conditions: the patient's list of diagnoses\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">Condition/practicea-cond-01\u003c/code>.\u003c/p>\n\u003cp>\u003cb>Conditions\u003c/b> is the patient's problem list: the diagnoses in the chart. Here there is one: \u003cb>low back pain with radiculopathy\u003c/b>. Radiculopathy means an irritated or pinched nerve root in the spine, which causes pain that travels down a leg. \"Clinical status: active\" means it's a current problem. The code in brackets (ICD-10-CM M54.16) is a billing code; you can ignore it.\u003c/p>\n\u003cp>Two things to note:\u003c/p>\n\u003cul>\u003cli>The \u003cb>onset date, June 8\u003c/b>, is when the symptoms began. It starts the clock for \"at least a month of symptoms\" in C2.\u003c/li>\u003cli>\"Radiculopathy\" is a diagnosis: a name someone gave the problem. It is \u003cb>not\u003c/b> an exam finding. That matters for the nerve items in C1, as Step 10 explains.\u003c/li>\u003c/ul>\n\u003ch4>Step 4. Visits: the story in order\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">Encounter/practicea-enc-01\u003c/code>, \u003ccode class=\"id\">Encounter/practicea-enc-02\u003c/code>, \u003ccode class=\"id\">Encounter/practicea-enc-03\u003c/code>.\u003c/p>\n\u003cp>\u003cb>Visits\u003c/b> are the patient's appointments, with a one-line summary of each. Their ids start with \u003cb>Encounter/\u003c/b>, the record's technical name for a visit. Read them in date order:\u003c/p>\n\u003cul>\u003cli>\u003cb>June 9:\u003c/b> back pain and left leg pain for one day, with no injury or fall. She is sent to physical therapy and given exercises to do at home.\u003c/li>\u003cli>\u003cb>July 14:\u003c/b> the leg pain is unchanged.\u003c/li>\u003cli>\u003cb>August 14:\u003c/b> still unchanged after seven weeks of physical therapy. The plan is an \u003cb>epidural steroid injection\u003c/b> (a shot of anti-inflammatory medicine next to the irritated nerve) from a \u003cb>pain management\u003c/b> clinic. The MRI is to choose the \u003cb>level\u003c/b>: the spot along the spine where the shot goes.\u003c/li>\u003c/ul>\n\u003cp>\"Ambulatory\" means an office visit. \"Sciatica\" means pain running down the back of the leg.\u003c/p>\n\u003ch4>Step 5. Procedures: treatment that was done\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">Procedure/practicea-pt-01\u003c/code>.\u003c/p>\n\u003cp>\u003cb>Procedures\u003c/b> lists treatments that were carried out. Here: \u003cb>physical therapy from June 15 to August 3, 12 sessions, completed.\u003c/b> Physical therapy is the kind of treatment C2 calls \u003cb>conservative care\u003c/b>: treatment short of injections or surgery. (\"Conservative\" here is a medical word meaning cautious.)\u003c/p>\n\u003cp>\u003cb>Count the weeks.\u003c/b> Four weeks is 28 days. Four weeks after June 15 is July 13. August 3 is seven weeks after June 15. So the therapy lasted \u003cb>seven weeks\u003c/b>, more than the four that C2 asks for.\u003c/p>\n\u003cp>Tip: a calendar on your phone makes counting weeks easy.\u003c/p>\n\u003ch4>Step 6. Imaging reports and Medications: none here\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">note:p2\u003c/code>.\u003c/p>\n\u003cp>A case shows a section only when it has something in it. Two sections that some cases have are missing here:\u003c/p>\n\u003cul>\u003cli>\u003cb>Imaging reports\u003c/b> would come right after Procedures. It lists earlier scans or X-rays, with their dates and results. Its absence is one thing C4 looks at; earlier imaging can also show up in Procedures or the note.\u003c/li>\u003cli>\u003cb>Medications\u003c/b> would list medicines a clinician ordered, with their dates. The note's second paragraph (highlighted) says she prefers not to take pain medicine, which explains why there are none.\u003c/li>\u003c/ul>\n\u003cp>A missing section just means there is nothing of that kind in the record.\u003c/p>\n\u003ch4>Step 7. Observations: the exam, in plain words\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">Observation/practicea-obs-01\u003c/code>.\u003c/p>\n\u003cp>\u003cb>Observations\u003c/b> are findings recorded in the chart. This one is the August 14 exam. \"Narrative\" means it's written in words; it is still a structured entry. Phrase by phrase:\u003c/p>\n\u003cul>\u003cli>\u003cb>Straight leg raise positive on the left at 50 degrees:\u003c/b> lifting her straightened left leg brought on the leg pain. That points to an irritated nerve root. On the right it was negative: no pain.\u003c/li>\u003cli>\u003cb>Strength 5/5:\u003c/b> strength is graded 0 to 5, and 5 is normal.\u003c/li>\u003cli>\u003cb>Patellar and Achilles reflexes 2+ and equal:\u003c/b> the knee and ankle reflexes. 2+ is normal; reduced would be 1+, absent 0.\u003c/li>\u003cli>\u003cb>Sensation to light touch normal:\u003c/b> she feels a light touch normally on both legs and feet.\u003c/li>\u003c/ul>\n\u003cp>So: signs of an irritated nerve, but \u003cb>no weakness, no reflex change, and no numbness\u003c/b>. That difference decides C1.\u003c/p>\n\u003ch4>Step 8. The visit note, paragraph by paragraph\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">note:p1\u003c/code>, \u003ccode class=\"id\">note:p2\u003c/code>, \u003ccode class=\"id\">note:p3\u003c/code>, \u003ccode class=\"id\">note:p4\u003c/code>.\u003c/p>\n\u003cp>The \u003cb>visit note\u003c/b> is the clinician's write-up of the last visit, in numbered paragraphs. (Its id, DocumentReference/..., means the whole note. When the note is your evidence, tick the paragraph instead, such as note:p2.)\u003c/p>\n\u003cul>\u003cli>\u003cb>note:p1, the history.\u003c/b> The clinician asked about red flags and ruled them out: no injury, no numbness or weakness, no fever, chills, or weight loss, no cancer, normal bladder and bowel.\u003c/li>\u003cli>\u003cb>note:p2, treatment so far:\u003c/b> therapy since June 15, no change. 6/10 is a pain score (0 is none, 10 the worst).\u003c/li>\u003cli>\u003cb>note:p3, the exam and the impression\u003c/b> (the clinician's summary): \"without neurologic deficit,\" meaning no weakness, reflex change, or loss of feeling.\u003c/li>\u003cli>\u003cb>note:p4, the plan:\u003c/b> the injection, with the MRI to aim it.\u003c/li>\u003c/ul>\n\u003cp>Red flags can turn up in \u003cb>any\u003c/b> paragraph, so in every case, read each one against the list. Now, the questions.\u003c/p>\n\u003ch4>Step 9. C1, red flag: go through the list\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">note:p1\u003c/code>.\u003c/p>\n\u003cp>A \u003cb>red flag\u003c/b> is a warning sign of something more serious than ordinary back pain. If a case has one, it doesn't have to wait for four weeks of treatment, which is why C1 and C2 are alternatives.\u003c/p>\n\u003cp>The list is in Part 5 of the Training guide, grouped; \u003cb>Policy and criteria\u003c/b> at the top right has the official wording. Check every group against the \u003cb>whole\u003c/b> record:\u003c/p>\n\u003cul>\u003cli>\u003cb>Injury and bone:\u003c/b> no injury or fall.\u003c/li>\u003cli>\u003cb>Cancer:\u003c/b> \"no history of cancer.\"\u003c/li>\u003cli>\u003cb>Infection and immune system:\u003c/b> no fever or chills, and nothing anywhere about an infection, IV drug use, or immune suppression.\u003c/li>\u003cli>\u003cb>Weight:\u003c/b> no weight loss.\u003c/li>\u003cli>\u003cb>Pain pattern:\u003c/b> nothing about pain at night or lying flat. Not being able to sit through a work day isn't on the list either.\u003c/li>\u003c/ul>\n\u003cp>That leaves the nerve items, in the next step.\u003c/p>\n\u003ch4>Step 10. C1, the nerve items\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">Observation/practicea-obs-01\u003c/code>, \u003ccode class=\"id\">Condition/practicea-cond-01\u003c/code>, \u003ccode class=\"id\">note:p3\u003c/code>.\u003c/p>\n\u003cp>The list has several nerve items, including \"other nerve root compromise\" (compromise means damage or trouble). The leg pain and the positive straight leg raise do suggest an irritated nerve root. But the criteria explain how this project reads the nerve items: C1 is supported by \u003cb>objective\u003c/b> nerve root or spinal cord compromise in the record, which they list as:\u003c/p>\n\u003cul>\u003cli>clinically significant or progressive weakness\u003c/li>\u003cli>a reduced or absent reflex\u003c/li>\u003cli>loss of feeling in a nerve root pattern\u003c/li>\u003cli>new bladder or bowel trouble\u003c/li>\u003cli>numbness in the saddle area or around the anus\u003c/li>\u003c/ul>\n\u003cp>Her exam shows \u003cb>none\u003c/b> of them. The diagnosis \"radiculopathy\" in Conditions is a name, not one of these signs, so it doesn't count for the nerve items either. The criteria also say it directly: radiating leg pain or a positive straight leg raise on its own does not support C1, and such a case is judged under C2.\u003c/p>\n\u003ch4>Step 11. C1, where a red flag is written\u003c/h4>\n\u003cp>One more C1 rule, which Practice A doesn't need but Practice B will. When a case does have something on the list, \u003cb>where\u003c/b> it is written decides the answer:\u003c/p>\n\u003cul>\u003cli>In a \u003cb>structured entry\u003c/b> (any item in the lists at the top, not the visit note), and the structured record doesn't contradict it: \u003cb>supported\u003c/b>.\u003c/li>\u003cli>\u003cb>Only in the visit note\u003c/b>, or contradicted by the structured record: \u003cb>undeterminable\u003c/b>. It can't carry an approval. If the rest of the case can't be approved either, the case goes to a physician.\u003c/li>\u003cli>Nothing on the list anywhere: \u003cb>unsupported\u003c/b>.\u003c/li>\u003c/ul>\n\u003cp>The reason: the tool can approve on its own, so the project wants a second source in the record before an approval rests on the note.\u003c/p>\n\u003ch4>Step 12. C1, your answer\u003c/h4>\n\u003cp>\u003cb>In the form:\u003c/b> the \u003cb>C1 red flag\u003c/b> block.\u003c/p>\n\u003cp>In Practice A, nothing on the list appears anywhere in the record.\u003c/p>\n\u003cp>\u003cb>Answer: unsupported.\u003c/b> In the highlighted \u003cb>C1 red flag\u003c/b> block on the right, click \u003cb>unsupported\u003c/b>.\u003c/p>\n\u003cp>\u003cb>Evidence\u003c/b> can stay empty: the answer rests on red flags the record doesn't contain. (If the exam is what settled it for you, ticking \u003cb>Observation/practicea-obs-01\u003c/b> is fine too.)\u003c/p>\n\u003ch4>Step 13. C2, conservative care: the three parts\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">Procedure/practicea-pt-01\u003c/code>, \u003ccode class=\"id\">Encounter/practicea-enc-03\u003c/code>, \u003ccode class=\"id\">Condition/practicea-cond-01\u003c/code>.\u003c/p>\n\u003cp>C2 asks whether at least four weeks of conservative care hasn't worked. It has three parts, and all three must hold:\u003c/p>\n\u003col>\u003cli>\u003cb>A reasonable trial of conservative care, at least four weeks, in the right kind of entry.\u003c/b> For C2 that means a therapy in \u003cb>Procedures\u003c/b> or an order in \u003cb>Medications\u003c/b> for a medicine given for the back pain; the note or a visit summary alone isn't enough. Here: physical therapy for seven weeks, in Procedures. \u003cb>Yes.\u003c/b>\u003c/li>\u003cli>\u003cb>No response:\u003c/b> the August 14 visit says the leg pain is unchanged after the therapy, so it hasn't helped. \u003cb>Yes.\u003c/b>\u003c/li>\u003cli>\u003cb>At least a month of symptoms before the request:\u003c/b> June 8 (the Condition's onset) to August 19 (the request) is about ten weeks. \u003cb>Yes.\u003c/b>\u003c/li>\u003c/ol>\n\u003ch4>Step 14. C2, your answer and evidence\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">Procedure/practicea-pt-01\u003c/code>, \u003ccode class=\"id\">Encounter/practicea-enc-03\u003c/code>. \u003cb>In the form:\u003c/b> the \u003cb>C2 conservative care, four weeks\u003c/b> block.\u003c/p>\n\u003cp>\u003cb>Answer: supported.\u003c/b> In the highlighted \u003cb>C2 conservative care, four weeks\u003c/b> block, click \u003cb>supported\u003c/b>.\u003c/p>\n\u003cp>Then click \u003cb>Evidence (0 selected)\u003c/b> under it. A list of every id on the page opens. Tick the two highlighted boxes:\u003c/p>\n\u003cul>\u003cli>\u003cb>Procedure/practicea-pt-01\u003c/b>, the therapy\u003c/li>\u003cli>\u003cb>Encounter/practicea-enc-03\u003c/b>, the August 14 visit that shows no improvement\u003c/li>\u003c/ul>\n\u003cp>Each id in th
