e list matches the blue label at the start of an item on the left, so you can always look there to see which item it is. Ticking note:p2 as well is fine.\u003c/p>\n\u003ch4>Step 15. C3, the MRI will change what happens next\u003c/h4>\n\u003cp>\u003cb>Look at:\u003c/b> \u003ccode class=\"id\">Encounter/practicea-enc-03\u003c/code>, \u003ccode class=\"id\">note:p4\u003c/code>. \u003cb>In the form:\u003c/b> the \u003cb>C3 informs management\u003c/b> block.\u003c/p>\n\u003cp>C3 (\"informs management\") has two parts: a surgery or other aggressive treatment is being considered, \u003cb>and\u003c/b> the MRI's findings would affect that choice.\u003c/p>\n\u003cul>\u003cli>The plan is an \u003cb>epidural steroid injection\u003c/b>. It isn't the criteria's exact example (an injection into a joint between vertebrae), but the worked answer counts it as an \"other aggressive treatment\": the national guidance the project cites ties MRI to candidates for surgery or an epidural steroid injection. \u003cb>Yes.\u003c/b>\u003c/li>\u003cli>The note says the MRI is how the injection will be aimed. \u003cb>Yes.\u003c/b>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Answer: supported.\u003c/b> In the \u003cb>C3 informs management\u003c/b> block, click \u003cb>supported\u003c/b>, then open its Evidence and tick \u003cb>Encounter/practicea-enc-03\u003c/b> and \u003cb>note:p4\u003c/b>. For C3, the note counts as evidence on its own.\u003c/p>\n\u003ch4>Step 16. C4, not a duplicate of earlier imaging\u003c/h4>\n\u003cp>\u003cb>In the form:\u003c/b> the \u003cb>C4 no duplicate imaging\u003c/b> block.\u003c/p>\n\u003cp>C4 asks whether this MRI would duplicate imaging the patient already had. Look for any earlier scan or X-ray of the lower back: an \u003cb>Imaging reports\u003c/b> section (there isn't one, as Step 6 noted), imaging in \u003cb>Procedures\u003c/b>, or a mention in the note. There is none.\u003c/p>\n\u003cp>\u003cb>Answer: supported, with no evidence ticked.\u003c/b> The answer rests on something the record doesn't contain, so evidence stays empty. In the \u003cb>C4 no duplicate imaging\u003c/b> block, click \u003cb>supported\u003c/b> and leave its Evidence alone.\u003c/p>\n\u003ch4>Step 17. Routing: the outcome for the whole case\u003c/h4>\n\u003cp>\u003cb>In the form:\u003c/b> the \u003cb>Routing\u003c/b> block.\u003c/p>\n\u003cp>\u003cb>Routing\u003c/b> is the question; \u003cb>approve\u003c/b>, \u003cb>request\u003c/b>, and \u003cb>route\u003c/b> are its three answers. Ask these routing questions in order, and stop at the first \"yes\":\u003c/p>\n\u003col>\u003cli>\u003cb>Are C3 and C4 supported, and C1 or C2 supported with evidence?\u003c/b> Yes: C2, C3, and C4 are supported, and C2 has its evidence ticked.\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Answer: approve.\u003c/b> In the \u003cb>Routing\u003c/b> block, click \u003cb>approve\u003c/b>. C1 being unsupported doesn't matter: a case needs C1 \u003cb>or\u003c/b> C2, not both.\u003c/p>\n\u003cp>Questions 2 to 4, about open red flags, contradictions, and requests, only come up when a case can't be approved. Part 5 of the Training guide explains them.\u003c/p>\n\u003ch4>Step 18. Check your work\u003c/h4>\n\u003cp>The line near the bottom of the form should now be green and say \u003cb>Complete. Saved in this browser.\u003c/b> If it says \"Not complete yet,\" look for a block with nothing clicked.\u003c/p>\n\u003cp>Click \u003cb>Check my answers\u003c/b> under that line. The worked answer appears below the form and should match every choice you just made, with the reasoning written out.\u003c/p>\n\u003cp>That's one full case. Next: click \u003cb>Exit walkthrough\u003c/b>, then open \u003cb>Training guide\u003c/b> and read \u003cb>Part 5, the rules\u003c/b> (about 15 minutes). Then click \u003cb>Practice B\u003c/b> at the top left and label it \u003cb>on your own\u003c/b>, the same way.\u003c/p>";
const NAMES = {"practice_a": "Practice A", "practice_b": "Practice B"};
function LABEL(c){ return NAMES[c] || c; }
const shown = {};
// The guided walkthrough. walk is {case, step}: step 0 is the introduction, 1 to N the steps. It is kept in this
// browser under its own name, so a closed page reopens on the same step.
const WALKS = {"practice_a": {"intro": {"title": "How this walkthrough works", "html": "\u003cp>This walkthrough labels one whole case with you, one step at a time. After this introduction there are 18 steps, and they take about 35 minutes. You don't need to know any medicine: each step explains the words it uses.\u003c/p>\n\u003cul>\u003cli>The \u003cb>left side\u003c/b> of the page is the patient's record. At each step, the part to look at is \u003cb>highlighted\u003c/b> in yellow, and the page scrolls to it.\u003c/li>\u003cli>The \u003cb>right side\u003c/b> is the form. It has a block for each question: C1, C2, C3, C4, and Routing. Each block has three choices to click, and an \u003cb>Evidence\u003c/b> list that opens when you click it. When a step asks you to click something, that block is highlighted too.\u003c/li>\u003cli>Use \u003cb>Next\u003c/b> and \u003cb>Back\u003c/b> in this box. \u003cb>Exit walkthrough\u003c/b> closes it; your answers stay.\u003c/li>\u003c/ul>\n\u003cp>Steps 1 to 8 read the record from top to bottom. Steps 9 to 17 answer the five questions. Step 18 checks your work.\u003c/p>"}, "steps": [{"title": "The request: what is being asked for", "html": "\u003cp>Every case starts with the \u003cb>request\u003c/b>. A clinic is asking the patient's insurance plan to approve an \u003cb>MRI of the lumbar spine\u003c/b>: a detailed scan of the lower back. \"Without contrast\" means no dye is injected. \"Use: preauthorization\" means the clinic is asking \u003cb>before\u003c/b> the scan. \"Priority: Normal\" means it isn't urgent.\u003c/p>\n\u003cp>The blue id starts with \u003cb>Claim/\u003c/b>, which is the record's technical name for a request. The long code (SNOMED CT 241648005) is a standard code for the test; you can ignore it.\u003c/p>\n\u003cp>\u003cb>Write down the request date: August 19, 2026.\u003c/b> You'll use it to count how long the symptoms have lasted.\u003c/p>", "highlight": ["Claim/practicea-claim"], "focus": null, "tick": []}, {"title": "The patient", "html": "\u003cp>A 62-year-old woman. She is under 65, and some younger people have Medicare too, for example because of a disability; the record doesn't need to say why.\u003c/p>\n\u003cp>Read the age and sex, but they rarely decide anything by themselves. The long string of letters and numbers is just the patient's id in the record.\u003c/p>", "highlight": ["Patient/8f48ea64-12eb-a55e-c747-42fd4dab5908"], "focus": null, "tick": []}, {"title": "Conditions: the patient's list of diagnoses", "html": "\u003cp>\u003cb>Conditions\u003c/b> is the patient's problem list: the diagnoses in the chart. Here there is one: \u003cb>low back pain with radiculopathy\u003c/b>. Radiculopathy means an irritated or pinched nerve root in the spine, which causes pain that travels down a leg. \"Clinical status: active\" means it's a current problem. The code in brackets (ICD-10-CM M54.16) is a billing code; you can ignore it.\u003c/p>\n\u003cp>Two things to note:\u003c/p>\n\u003cul>\u003cli>The \u003cb>onset date, June 8\u003c/b>, is when the symptoms began. It starts the clock for \"at least a month of symptoms\" in C2.\u003c/li>\u003cli>\"Radiculopathy\" is a diagnosis: a name someone gave the problem. It is \u003cb>not\u003c/b> an exam finding. That matters for the nerve items in C1, as Step 10 explains.\u003c/li>\u003c/ul>", "highlight": ["Condition/practicea-cond-01"], "focus": null, "tick": []}, {"title": "Visits: the story in order", "html": "\u003cp>\u003cb>Visits\u003c/b> are the patient's appointments, with a one-line summary of each. Their ids start with \u003cb>Encounter/\u003c/b>, the record's technical name for a visit. Read them in date order:\u003c/p>\n\u003cul>\u003cli>\u003cb>June 9:\u003c/b> back pain and left leg pain for one day, with no injury or fall. She is sent to physical therapy and given exercises to do at home.\u003c/li>\u003cli>\u003cb>July 14:\u003c/b> the leg pain is unchanged.\u003c/li>\u003cli>\u003cb>August 14:\u003c/b> still unchanged after seven weeks of physical therapy. The plan is an \u003cb>epidural steroid injection\u003c/b> (a shot of anti-inflammatory medicine next to the irritated nerve) from a \u003cb>pain management\u003c/b> clinic. The MRI is to choose the \u003cb>level\u003c/b>: the spot along the spine where the shot goes.\u003c/li>\u003c/ul>\n\u003cp>\"Ambulatory\" means an office visit. \"Sciatica\" means pain running down the back of the leg.\u003c/p>", "highlight": ["Encounter/practicea-enc-01", "Encounter/practicea-enc-02", "Encounter/practicea-enc-03"], "focus": null, "tick": []}, {"title": "Procedures: treatment that was done", "html": "\u003cp>\u003cb>Procedures\u003c/b> lists treatments that were carried out. Here: \u003cb>physical therapy from June 15 to August 3, 12 sessions, completed.\u003c/b> Physical therapy is the kind of treatment C2 calls \u003cb>conservative care\u003c/b>: treatment short of injections or surgery. (\"Conservative\" here is a medical word meaning cautious.)\u003c/p>\n\u003cp>\u003cb>Count the weeks.\u003c/b> Four weeks is 28 days. Four weeks after June 15 is July 13. August 3 is seven weeks after June 15. So the therapy lasted \u003cb>seven weeks\u003c/b>, more than the four that C2 asks for.\u003c/p>\n\u003cp>Tip: a calendar on your phone makes counting weeks easy.\u003c/p>", "highlight": ["Procedure/practicea-pt-01"], "focus": null, "tick": []}, {"title": "Imaging reports and Medications: none here", "html": "\u003cp>A case shows a section only when it has something in it. Two sections that some cases have are missing here:\u003c/p>\n\u003cul>\u003cli>\u003cb>Imaging reports\u003c/b> would come right after Procedures. It lists earlier scans or X-rays, with their dates and results. Its absence is one thing C4 looks at; earlier imaging can also show up in Procedures or the note.\u003c/li>\u003cli>\u003cb>Medications\u003c/b> would list medicines a clinician ordered, with their dates. The note's second paragraph (highlighted) says she prefers not to take pain medicine, which explains why there are none.\u003c/li>\u003c/ul>\n\u003cp>A missing section just means there is nothing of that kind in the record.\u003c/p>", "highlight": ["note:p2"], "focus": null, "tick": []}, {"title": "Observations: the exam, in plain words", "html": "\u003cp>\u003cb>Observations\u003c/b> are findings recorded in the chart. This one is the August 14 exam. \"Narrative\" means it's written in words; it is still a structured entry. Phrase by phrase:\u003c/p>\n\u003cul>\u003cli>\u003cb>Straight leg raise positive on the left at 50 degrees:\u003c/b> lifting her straightened left leg brought on the leg pain. That points to an irritated nerve root. On the right it was negative: no pain.\u003c/li>\u003cli>\u003cb>Strength 5/5:\u003c/b> strength is graded 0 to 5, and 5 is normal.\u003c/li>\u003cli>\u003cb>Patellar and Achilles reflexes 2+ and equal:\u003c/b> the knee and ankle reflexes. 2+ is normal; reduced would be 1+, absent 0.\u003c/li>\u003cli>\u003cb>Sensation to light touch normal:\u003c/b> she feels a light touch normally on both legs and feet.\u003c/li>\u003c/ul>\n\u003cp>So: signs of an irritated nerve, but \u003cb>no weakness, no reflex change, and no numbness\u003c/b>. That difference decides C1.\u003c/p>", "highlight": ["Observation/practicea-obs-01"], "focus": null, "tick": []}, {"title": "The visit note, paragraph by paragraph", "html": "\u003cp>The \u003cb>visit note\u003c/b> is the clinician's write-up of the last visit, in numbered paragraphs. (Its id, DocumentReference/..., means the whole note. When the note is your evidence, tick the paragraph instead, such as note:p2.)\u003c/p>\n\u003cul>\u003cli>\u003cb>note:p1, the history.\u003c/b> The clinician asked about red flags and ruled them out: no injury, no numbness or weakness, no fever, chills, or weight loss, no cancer, normal bladder and bowel.\u003c/li>\u003cli>\u003cb>note:p2, treatment so far:\u003c/b> therapy since June 15, no change. 6/10 is a pain score (0 is none, 10 the worst).\u003c/li>\u003cli>\u003cb>note:p3, the exam and the impression\u003c/b> (the clinician's summary): \"without neurologic deficit,\" meaning no weakness, reflex change, or loss of feeling.\u003c/li>\u003cli>\u003cb>note:p4, the plan:\u003c/b> the injection, with the MRI to aim it.\u003c/li>\u003c/ul>\n\u003cp>Red flags can turn up in \u003cb>any\u003c/b> paragraph, so in every case, read each one against the list. Now, the questions.\u003c/p>", "highlight": ["note:p1", "note:p2", "note:p3", "note:p4"], "focus": null, "tick": []}, {"title": "C1, red flag: go through the list", "html": "\u003cp>A \u003cb>red flag\u003c/b> is a warning sign of something more serious than ordinary back pain. If a case has one, it doesn't have to wait for four weeks of treatment, which is why C1 and C2 are alternatives.\u003c/p>\n\u003cp>The list is in Part 5 of the Training guide, grouped; \u003cb>Policy and criteria\u003c/b> at the top right has the official wording. Check every group against the \u003cb>whole\u003c/b> record:\u003c/p>\n\u003cul>\u003cli>\u003cb>Injury and bone:\u003c/b> no injury or fall.\u003c/li>\u003cli>\u003cb>Cancer:\u003c/b> \"no history of cancer.\"\u003c/li>\u003cli>\u003cb>Infection and immune system:\u003c/b> no fever or chills, and nothing anywhere about an infection, IV drug use, or immune suppression.\u003c/li>\u003cli>\u003cb>Weight:\u003c/b> no weight loss.\u003c/li>\u003cli>\u003cb>Pain pattern:\u003c/b> nothing about pain at night or lying flat. Not being able to sit through a work day isn't on the list either.\u003c/li>\u003c/ul>\n\u003cp>That leaves the nerve items, in the next step.\u003c/p>", "highlight": ["note:p1"], "focus": null, "tick": []}, {"title": "C1, the nerve items", "html": "\u003cp>The list has several nerve items, including \"other nerve root compromise\" (compromise means damage or trouble). The leg pain and the positive straight leg raise do suggest an irritated nerve root. But the criteria explain how this project reads the nerve items: C1 is supported by \u003cb>objective\u003c/b> nerve root or spinal cord compromise in the record, which they list as:\u003c/p>\n\u003cul>\u003cli>clinically significant or progressive weakness\u003c/li>\u003cli>a reduced or absent reflex\u003c/li>\u003cli>loss of feeling in a nerve root pattern\u003c/li>\u003cli>new bladder or bowel trouble\u003c/li>\u003cli>numbness in the saddle area or around the anus\u003c/li>\u003c/ul>\n\u003cp>Her exam shows \u003cb>none\u003c/b> of them. The diagnosis \"radiculopathy\" in Conditions is a name, not one of these signs, so it doesn't count for the nerve items either. The criteria also say it directly: radiating leg pain or a positive straight leg raise on its own does not support C1, and such a case is judged under C2.\u003c/p>", "highlight": ["Observation/practicea-obs-01", "Condition/practicea-cond-01", "note:p3"], "focus": null, "tick": []}, {"title": "C1, where a red flag is written", "html": "\u003cp>One more C1 rule, which Practice A doesn't need but Practice B will. When a case does have something on the list, \u003cb>where\u003c/b> it is written decides the answer:\u003c/p>\n\u003cul>\u003cli>In a \u003cb>structured entry\u003c/b> (any item in the lists at the top, not the visit note), and the structured record doesn't contradict it: \u003cb>supported\u003c/b>.\u003c/li>\u003cli>\u003cb>Only in the visit note\u003c/b>, or contradicted by the structured record: \u003cb>undeterminable\u003c/b>. It can't carry an approval. If the rest of the case can't be approved either, the case goes to a physician.\u003c/li>\u003cli>Nothing on the list anywhere: \u003cb>unsupported\u003c/b>.\u003c/li>\u003c/ul>\n\u003cp>The reason: the tool can approve on its own, so the project wants a second source in the record before an approval rests on the note.\u003c/p>", "highlight": [], "focus": null, "tick": []}, {"title": "C1, your answer", "html": "\u003cp>In Practice A, nothing on the list appears anywhere in the record.\u003c/p>\n\u003cp>\u003cb>Answer: unsupported.\u003c/b> In the highlighted \u003cb>C1 red flag\u003c/b> block on the right, click \u003cb>unsupported\u003c/b>.\u003c/p>\n\u003cp>\u003cb>Evidence\u003c/b> can stay empty: the answer rests on red flags the record doesn't contain. (If the exam is what settled it for you, ticking \u003cb>Observation/practicea-obs-01\u003c/b> is fine too.)\u003c/p>", "highlight": [], "focus": "C1_red_flag", "tick": []}, {"title": "C2, conservative care: the three parts", "html": "\u003cp>C2 asks whether at least four weeks of conservative care hasn't worked. It has three parts, and all three must hold:\u003c/p>\n\u003col>\u003cli>\u003cb>A reasonable trial of conservative care, at least four weeks, in the right kind of entry.\u003c/b> For C2 that means a therapy in \u003cb>Procedures\u003c/b> or an order in \u003cb>Medications\u003c/b> for a medicine given for the back pain; the note or a visit summary alone isn't enough. Here: physical therapy for seven weeks, in Procedures. \u003cb>Yes.\u003c/b>\u003c/li>\u003cli>\u003cb>No response:\u003c/b> the August 14 visit says the leg pain is unchanged after the therapy, so it hasn't helped. \u003cb>Yes.\u003c/b>\u003c/li>\u003cli>\u003cb>At least a month of symptoms before the request:\u003c/b> June 8 (the Condition's onset) to August 19 (the request) is about ten weeks. \u003cb>Yes.\u003c/b>\u003c/li>\u003c/ol>", "highlight": ["Procedure/practicea-pt-01", "Encounter/practicea-enc-03", "Condition/practicea-cond-01"], "focus": null, "tick": []}, {"title": "C2, your answer and evidence", "html": "\u003cp>\u003cb>Answer: supported.\u003c/b> In the highlighted \u003cb>C2 conservative care, four weeks\u003c/b> block, click \u003cb>supported\u003c/b>.\u003c/p>\n\u003cp>Then click \u003cb>Evidence (0 selected)\u003c/b> under it. A list of every id on the page opens. Tick the two highlighted boxes:\u003c/p>\n\u003cul>\u003cli>\u003cb>Procedure/practicea-pt-01\u003c/b>, the therapy\u003c/li>\u003cli>\u003cb>Encounter/practicea-enc-03\u003c/b>, the August 14 visit that shows no improvement\u003c/li>\u003c/ul>\n\u003cp>Each id in the list matches the blue label at the start of an item on the left, so you can always look there to see which item it is. Ticking note:p2 as well is fine.\u003c/p>", "highlight": ["Procedure/practicea-pt-01", "Encounter/practicea-enc-03"], "focus": "C2_conservative_4wk", "tick": ["Procedure/practicea-pt-01", "Encounter/practicea-enc-03"]}, {"title": "C3, the MRI will change what happens next", "html": "\u003cp>C3 (\"informs management\") has two parts: a surgery or other aggressive treatment is being considered, \u003cb>and\u003c/b> the MRI's findings would affect that choice.\u003c/p>\n\u003cul>\u003cli>The plan is an \u003cb>epidural steroid injection\u003c/b>. It isn't the criteria's exact example (an injection into a joint between vertebrae), but the worked answer counts it as an \"other aggressive treatment\": the national guidance the project cites ties MRI to candidates for surgery or an epidural steroid injection. \u003cb>Yes.\u003c/b>\u003c/li>\u003cli>The note says the MRI is how the injection will be aimed. \u003cb>Yes.\u003c/b>\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Answer: supported.\u003c/b> In the \u003cb>C3 informs management\u003c/b> block, click \u003cb>supported\u003c/b>, then open its Evidence and tick \u003cb>Encounter/practicea-enc-03\u003c/b> and \u003cb>note:p4\u003c/b>. For C3, the note counts as evidence on its own.\u003c/p>", "highlight": ["Encounter/practicea-enc-03", "note:p4"], "focus": "C3_informs_management", "tick": ["Encounter/practicea-enc-03", "note:p4"]}, {"title": "C4, not a duplicate of earlier imaging", "html": "\u003cp>C4 asks whether this MRI would duplicate imaging the patient already had. Look for any earlier scan or X-ray of the lower back: an \u003cb>Imaging reports\u003c/b> section (there isn't one, as Step 6 noted), imaging in \u003cb>Procedures\u003c/b>, or a mention in the note. There is none.\u003c/p>\n\u003cp>\u003cb>Answer: supported, with no evidence ticked.\u003c/b> The answer rests on something the record doesn't contain, so evidence stays empty. In the \u003cb>C4 no duplicate imaging\u003c/b> block, click \u003cb>supported\u003c/b> and leave its Evidence alone.\u003c/p>", "highlight": [], "focus": "C4_no_duplicate_imaging", "tick": []}, {"title": "Routing: the outcome for the whole case", "html": "\u003cp>\u003cb>Routing\u003c/b> is the question; \u003cb>approve\u003c/b>, \u003cb>request\u003c/b>, and \u003cb>route\u003c/b> are its three answers. Ask these routing questions in order, and stop at the first \"yes\":\u003c/p>\n\u003col>\u003cli>\u003cb>Are C3 and C4 supported, and C1 or C2 supported with evidence?\u003c/b> Yes: C2, C3, and C4 are supported, and C2 has its evidence ticked.\u003c/li>\u003c/ol>\n\u003cp>\u003cb>Answer: approve.\u003c/b> In the \u003cb>Routing\u003c/b> block, click \u003cb>approve\u003c/b>. C1 being unsupported doesn't matter: a case needs C1 \u003cb>or\u003c/b> C2, not both.\u003c/p>\n\u003cp>Questions 2 to 4, about open red flags, contradictions, and requests, only come up when a case can't be approved. Part 5 of the Training guide explains them.\u003c/p>", "highlight": [], "focus": "routing", "tick": []}, {"title": "Check your work", "html": "\u003cp>The line near the bottom of the form should now be green and say \u003cb>Complete. Saved in this browser.\u003c/b> If it says \"Not complete yet,\" look for a block with nothing clicked.\u003c/p>\n\u003cp>Click \u003cb>Check my answers\u003c/b> under that line. The worked answer appears below the form and should match every choice you just made, with the reasoning written out.\u003c/p>\n\u003cp>That's one full case. Next: click \u003cb>Exit walkthrough\u003c/b>, then open \u003cb>Training guide\u003c/b> and read \u003cb>Part 5, the rules\u003c/b> (about 15 minutes). Then click \u003cb>Practice B\u003c/b> at the top left and label it \u003cb>on your own\u003c/b>, the same way.\u003c/p>", "highlight": [], "focus": null, "tick": []}]}};
const CHECKLIST_HTML = "\u003col>\u003cli>The request: note the request date.\u003c/li>\u003cli>The patient.\u003c/li>\u003cli>Conditions: note when the back pain began (the onset date).\u003c/li>\u003cli>Visits, in date order.\u003c/li>\u003cli>Procedures: count the weeks of any treatment.\u003c/li>\u003cli>Imaging reports and Medications, if the case has them.\u003c/li>\u003cli>Observations: the exam.\u003c/li>\u003cli>The visit note, every paragraph.\u003c/li>\u003cli>C1: go through the red-flag list. Where is each one written?\u003c/li>\u003cli>C2: the three parts (four weeks of care in a therapy Procedure or a medication order, no response, a month of symptoms).\u003c/li>\u003cli>C3: the two parts (surgery or another aggressive treatment considered, and the MRI's findings would affect that choice).\u003c/li>\u003cli>C4: any earlier imaging of the lower back?\u003c/li>\u003cli>Routing: the four questions, in order, stopping at the first yes.\u003c/li>\u003c/ol>";
const WKEY = "labeling-practice-walk-v1";
let walk = null, turnOpen = false;
try { walk = JSON.parse(localStorage.getItem(WKEY) || "null"); } catch (e) { walk = null; }
if (!walk || !WALKS[walk.case] || !(walk.step >= 0 && walk.step <= WALKS[walk.case].steps.length)) walk = null;
function saveWalk(){ try { if (walk) localStorage.setItem(WKEY, JSON.stringify(walk)); else localStorage.removeItem(WKEY); } catch (e) {} }
function walkHtml(c){
  const w = WALKS[c];
  if (walk && walk.case === c) {
    const n = w.steps.length, i = walk.step, s = i ? w.steps[i-1] : w.intro;
    let h = '<div class="card walk '+(s.focus ? 'act' : 'read')+'" id="walkcard"><p class="walkpos">Guided walkthrough, '+(i ? 'step '+i+' of '+n : 'introduction')+'</p>';
    h += '<h2>'+(i ? 'Step '+i+'. ' : '')+esc(s.title)+'</h2>'+s.html+'<div class="walkbtns">';
    h += '<button class="btn ghost" id="wback"'+(i ? '' : ' disabled')+'>Back</button>';
    h += i < n ? '<button class="btn" id="wnext">Next</button><button class="btn ghost" id="wexit">Exit walkthrough</button>'
               : '<button class="btn" id="wexit">Exit walkthrough</button>';
    return h+'<span class="wmore" id="wmore">More in this box, scroll down &#8595;</span></div></div>';
  }
  if (w) return '<div class="card"><h2>New to labeling?</h2><p>The guided walkthrough labels this case with you, one step at a time, in about 35 minutes. It highlights each part of the record as it explains it, and tells you what to click.</p><button class="btn" id="wstart">Start the guided walkthrough</button></div>';
  return '<div class="card turn"><h2>Your turn</h2><p>Label this case on your own, the way the walkthrough did. If you haven&#39;t yet, read Part 5 of the <b>Training guide</b> (the rules) first. When the line under the form turns green, click <b>Check my answers</b>.</p><details id="turnlist"'+(turnOpen ? ' open' : '')+'><summary>Show the checklist</summary>'+CHECKLIST_HTML+'</details></div>';
}
function walkStep(){ return walk && walk.step && walk.case === CASES[cur].case ? WALKS[walk.case].steps[walk.step-1] : null; }
function moreHint(card){ const m = document.getElementById("wmore"); if (m) m.style.visibility = card.scrollTop + card.clientHeight < card.scrollHeight - 4 ? "visible" : "hidden"; }
function walkKeep(){ const card = document.getElementById("walkcard"); return card ? card.scrollTop : 0; }
function afterRender(keep){
  const card = document.getElementById("walkcard");
  document.body.classList.toggle("walking", !!card);
  if (card) { card.scrollTop = keep; card.onscroll = () => moreHint(card); moreHint(card); }
  const s = walkStep(); if (!s) return;
  document.querySelectorAll("#casecol code.id").forEach(el => { if (s.highlight.includes(el.textContent)) { const t = el.closest("li,p"); if (t) t.classList.add("hl"); } });
  const inp = s.focus && document.querySelector('#formcol input[name="'+s.focus+'"]'), box = inp && inp.closest(".crit");
  if (!box) return;
  box.classList.add("hl");
  const tick = s.tick || [];
  box.querySelectorAll(".ev input[type=checkbox]").forEach(cb => { if (tick.includes(cb.value)) cb.closest("label").classList.add("tick"); });
  const sum = box.querySelector("summary"); if (sum && tick.length) sum.classList.add("tick");
}
function scrollToStep(){
  const card = document.getElementById("walkcard"); if (!card) return;
  card.scrollTop = 0; moreHint(card);
  const side = document.getElementById("formcol"), hl = document.querySelector("#casecol .hl"), box = document.querySelector("#formcol .crit.hl");
  if (getComputedStyle(card).position === "fixed") {  // narrow screen: the step box sits at the bottom
    const t = box || hl; if (t) t.scrollIntoView({block: "start"}); else window.scrollTo(0, 0);
    return;
  }
  if (hl) hl.scrollIntoView({block: "start"}); else if (!walk.step) window.scrollTo(0, 0);
  side.scrollTop = box ? Math.max(0, side.scrollTop + box.getBoundingClientRect().top - side.getBoundingClientRect().top - card.offsetHeight - 12) : 0;
}
function goStep(i){ walk.step = i; saveWalk(); render(); scrollToStep(); }
function bindWalk(c){
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on("wstart", () => { walk = {case: c, step: 0}; goStep(0); });
  on("wback", () => goStep(Math.max(0, walk.step - 1)));
  on("wnext", () => goStep(Math.min(WALKS[c].steps.length, walk.step + 1)));
  on("wexit", () => { walk = null; saveWalk(); render(); window.scrollTo(0, 0); document.getElementById("formcol").scrollTop = 0; });
  const d = document.getElementById("turnlist"); if (d) d.ontoggle = () => { turnOpen = d.open; };
}
function checkHtml(c){
  const a=ANSWERS[c], r=rec(c); let h='<div class="card" id="checkout"><h2>Worked answer, '+esc(LABEL(c))+'</h2>';
  CRIT.forEach(([k,label])=>{ const want=a.criteria[k], got=r.criteria[k];
    h+='<div class="crit"><div class="name">'+esc(label)+'</div><p>';
    h+=got.status===want.status?'<span class="okmark">Same as yours: '+esc(want.status)+'</span>':'<span class="diffmark">Worked answer: '+esc(want.status)+'. Yours: '+esc(got.status||"none")+'</span>';
    h+='</p>';
    if(!want.evidence.length){
      const fine=got.evidence.filter(x=>want.also_fine.includes(x)), extra=got.evidence.filter(x=>!want.also_fine.includes(x));
      h+='<p class="status">Evidence in the worked answer: empty'+(got.evidence.length?'':', and yours is empty too.')+'</p>';
      if(fine.length) h+='<p class="status">Also fine: '+fine.map(esc).join(", ")+'</p>';
      if(extra.length) h+='<p class="status">Not needed for this criterion: '+extra.map(esc).join(", ")+'</p>';
    } else {
      const miss=want.evidence.filter(x=>!got.evidence.includes(x)), fine=got.evidence.filter(x=>want.also_fine.includes(x)), extra=got.evidence.filter(x=>!want.evidence.includes(x)&&!want.also_fine.includes(x));
      h+='<p class="status">Evidence in the worked answer: '+want.evidence.map(x=>'<code class="id">'+esc(x)+'</code>'+(got.evidence.includes(x)?' &#10003;':'')).join(" ")+'</p>';
      if(miss.length) h+='<p class="status">Not ticked by you: '+miss.map(esc).join(", ")+'</p>';
      if(fine.length) h+='<p class="status">Also fine: '+fine.map(esc).join(", ")+'</p>';
      if(extra.length) h+='<p class="status">Not needed for this criterion: '+extra.map(esc).join(", ")+'</p>';
    }
    h+='<p>'+esc(want.why)+'</p></div>'; });
  h+='<div class="crit"><div class="name">Routing</div><p>'+(r.routing===a.routing?'<span class="okmark">Same as yours: '+esc(a.routing)+'</span>':'<span class="diffmark">Worked answer: '+esc(a.routing)+'. Yours: '+esc(r.routing||"none")+'</span>')+'</p>';
  if(a.gap) h+='<p class="status">Gap: '+esc(a.gap.criterion)+', '+esc(a.gap.missing)+'</p>';
  h+='<p>'+esc(a.routing_why)+'</p></div>';
  h+='<div class="crit"><div class="name">What this case teaches</div><p>'+esc(a.lesson)+'</p></div></div>';
  return h;
}
function showCheckout(){  // below the step box when the walkthrough is open, else at the top
  const el=document.getElementById("checkout"), card=document.getElementById("walkcard"), side=document.getElementById("formcol");
  if(card && getComputedStyle(card).position!=="fixed") side.scrollTop += el.getBoundingClientRect().top - side.getBoundingClientRect().top - card.offsetHeight - 12;
  else el.scrollIntoView();
}
function bindCheck(c){
  const msg=document.getElementById("checkmsg");
  document.getElementById("check").onclick=()=>{
    if(!complete(c)){ msg.innerHTML='Finish every criterion and the routing first. <a href="#" id="anyway">Show the worked answer anyway</a> (it shows every answer at once)';
      document.getElementById("anyway").onclick=e=>{ e.preventDefault(); shown[c]=true; render(); showCheckout(); }; return; }
    shown[c]=true; render(); showCheckout(); };
  document.getElementById("clear").onclick=()=>{ delete store[c]; shown[c]=false; save(); render(); };
}
function openGuide(){ document.getElementById("guidebody").innerHTML=GUIDE_HTML; document.getElementById("guidedlg").style.display="block"; }
document.getElementById("showguide").onclick=openGuide;
document.getElementById("closeguide").onclick=()=>{ document.getElementById("guidedlg").style.display="none"; };
if(walk){ const k=CASES.findIndex(v=>v.case===walk.case); if(k>=0) cur=k; }
if(!walk && !CASES.some(v=>{ const r=store[v.case]; return r && (r.routing || CRIT.some(([k])=>r.criteria[k].status)); })) openGuide();
render();
if(walk) scrollToStep();
</script>
</body>
</html>
