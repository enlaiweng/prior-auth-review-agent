<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Set Labeling</title>
<style>
:root{--bg:#fbfaf7;--fg:#1f1d1a;--muted:#6b665e;--line:#e2ddd3;--card:#ffffff;--accent:#2f5d8a;--accent-weak:#e8eef5;--ok:#2e6b3f;--warn:#9a5b13}
@media (prefers-color-scheme: dark){:root{--bg:#191816;--fg:#ece8e1;--muted:#a39d93;--line:#38342e;--card:#22201d;--accent:#8db4dc;--accent-weak:#25303b;--ok:#7fc495;--warn:#e0a35a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 12px 0 0}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit;font-size:13px}
nav button.cur{border-color:var(--accent);background:var(--accent-weak)}
nav button.done::after{content:" \2713";color:var(--ok)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
ul.items{list-style:none;padding:0;margin:0}ul.items li{padding:5px 0;border-top:1px solid var(--line)}ul.items li:first-child{border-top:0}
code.id{font-size:12px;color:var(--accent);background:var(--accent-weak);padding:1px 5px;border-radius:4px;white-space:nowrap}
.para{margin:8px 0;white-space:pre-line}
.crit{border-top:1px solid var(--line);padding:10px 0}
.crit:first-of-type{border-top:0}
.crit .name{font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.opts label{display:flex;gap:5px;align-items:center;font-size:14px}
details{margin-top:4px}summary{cursor:pointer;color:var(--muted);font-size:13px}
.ev{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ev label{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;display:flex;gap:4px;align-items:center}
.ev label.on{border-color:var(--accent);background:var(--accent-weak)}
textarea,input[type=text],select{width:100%;font:inherit;font-size:14px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
pre{white-space:pre-wrap;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:260px;overflow:auto}
.status{font-size:13px;color:var(--muted)}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}
.ref{font-size:13.5px}.ref p{margin:6px 0}
.side{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto}
@media (max-width:900px){.side{position:static;max-height:none}}
</style>
</head>
<body>
<header>

cal therapy procedure; 2026-06-02 to 2026-07-28; status: completed; 16 sessions"}]}, {"title": "Medications", "items": [{"id": "MedicationRequest/e41b538b-0efc-031d-3b99-f238f2b533d6", "date": "2025-08-17", "text": "Hydrochlorothiazide 25 MG Oral Tablet; ordered 2025-08-17; status: active"}, {"id": "MedicationRequest/e41b538b-0efc-031d-b0aa-94ed54eeb601", "date": "2025-08-17", "text": "lisinopril 10 MG Oral Tablet; ordered 2025-08-17; status: active"}, {"id": "MedicationRequest/case01-med-01", "date": "2026-04-29", "text": "Acetaminophen 500 MG Oral Tablet; ordered 2026-04-29; dosage period from 2026-04-29; status: active"}]}, {"title": "Observations", "items": [{"id": "Observation/case01-obs-01", "date": "2026-08-04", "text": "2026-08-04 Physical findings Narrative: Tenderness over the lower lumbar facet joints; pain on lumbar extension and rotation. Straight leg raise negative bilaterally. Strength 5/5 in both lower extremities. Patellar and Achilles reflexes 2+ and symmetric. Sensation intact to light touch in both legs."}]}], "note": {"id": "DocumentReference/case01-note-01", "date": "2026-08-04", "paragraphs": [{"id": "note:p1", "text": "Follow-up visit, 2026-08-04. 77-year-old with low back pain since late April, now a little over three months. It began without any injury, sits across the lower back, and is worse with standing and twisting; sitting helps. The legs are not involved: no pain, numbness, or tingling below the buttocks. Denies fever and weight loss. Bladder and bowel function normal."}, {"id": "note:p2", "text": "Treatment so far: acetaminophen since April 29, with anti-inflammatories avoided because of diabetic kidney disease, and physical therapy from June 2 to July 28, 16 sessions, with a home program that continues. A brief improvement in June did not last, and the pain is now about where it started, 6/10. It makes housework and gardening hard."}, {"id": "note:p3", "text": "Exam: tenderness over the lower lumbar facet joints, with pain on extension and rotation. Straight leg raise negative on both sides. Strength 5/5 in both legs. Knee and ankle reflexes 2+ and symmetric. Sensation intact."}, {"id": "note:p4", "text": "Assessment: persistent axial low back pain despite a full course of physical therapy and medication, with exam findings pointing to the facet joints. Neurologically intact."}, {"id": "note:p5", "text": "Plan: refer to pain management for lumbar facet joint injection. MRI of the lumbar spine without contrast to identify the levels involved and plan the injection. Continue home exercises and acetaminophen. Follow up after the pain management visit."}]}}, {"case": "case_02", "request": {"id": "Claim/case02-claim", "date": "2026-08-13", "text": "MRI lumbar spine without contrast (SNOMED CT 241648005 MRI of lumbar spine); use: preauthorization; priority: Normal"}, "patient": {"id": "Patient/eaa2965b-1037-7ac2-22e8-a5d380fc1f81", "text": "72 years old on the request date; sex: female"}, "sections": [{"title": "Conditions", "items": [{"id": "Condition/eaa2965b-1037-7ac2-2bea-73df8f8b64a7", "date": "1988-07-03", "text": "Prediabetes (finding); clinical status: active; onset 1988-07-03"}, {"id": "Condition/eaa2965b-1037-7ac2-a313-dccf675d79bb", "date": "1988-07-03", "text": "Essential hypertension (disorder); clinical status: active; onset 1988-07-03"}, {"id": "Condition/case02-cond-01", "date": "2026-07-18", "text": "Low back pain (ICD-10-CM M54.50); clinical status: active; onset 2026-07-18"}]}, {"title": "Visits", "items": [{"id": "Encounter/case02-enc-01", "date": "2026-07-20", "text": "2026-07-20 primary care visit (ambulatory): Low back pain for two days, gradual onset, no fall or injury, no leg symptoms; naproxen started and physical therapy referral placed"}, {"id": "Encounter/case02-enc-02", "date": "2026-08-10", "text": "2026-08-10 follow-up (ambulatory): Low back pain unchanged at three weeks; physical therapy in progress; patient asks for an MRI"}]}, {"title": "Procedures", "items": [{"i const POLICY_BODY = "## Coverage Indications, Limitations, and/or Medical Necessity\n\nMagnetic Resonance Imaging (MRI) is a noninvasive method of imaging body structures based on the distribution of fixed water and other hydrogen-rich molecules in the human body. MRI uses a powerful magnet to align hydrogen atoms within the patient's soft tissues. As the nuclei return from excitation to equilibrium, the MRI receiver coil receives radio frequency wave signals that are transformed by the computer into diagnostic images. MRI produces cross sectional and 3-D images of soft tissues. Because bone contains little water (hydrogen nuclei), bone is relatively invisible to MRI. Blood is also relatively invisible because the hydrogen nuclei are moving in the blood stream.\n\nMRI contrast agents can improve the sensitivity and/or specificity of an image, by altering inherent tissue response to magnetic fields. The contrast agent most commonly used is gadolinium.\n\nMRI has proven useful in diagnosing cerebral infarctions, tumors, abscesses, edema, hemorrhage, nerve fiber demyelination (as in multiple sclerosis), and other disorders that increase fluid content of the affected tissues.\n\nMRI of the spinal canal has the advantage of noninvasive visualization of the spinal cord.\n\nMRI can:\n\n* Differentiate solid from cystic tumors,\n* Diagnose and localize spinal cord compression;\n* Diagnose syringomyelia (progressive, chronic sensory disturbance, atrophy and spasticity of the spinal cord), disc disease, and any altered relationship between vertebral bodies, discs, spinal cord and nerve roots;\n* Detect congenital spinal dysraphism (failure of fusion of parts along the dorsal midline of the spinal cord);\n* Provide early detection of osteomyelitis, and\n* Detect spinal cord abnormalities associated with osteomyelitis.\n\nCoverage is limited to MRI units that have received FDA pre-market approval. Such units must be operated within the parameters specified by the approval.\n\nContrast is indicated for studying the central nervous system for metastatic disease, inflammatory disease, recurrent tumor versus scar, differentiation of microvascular from macrovascular infarction, and selected cases of complex vascular disease. Within the study of the spine, contrast also is indicated to differentiate recurrent disc versus scar or granulation tissue, spinal cord neoplasm, any case of myelopathy, and inflammatory cord disease.\n\nHistory and clinical findings are critical factors to determine when a lumbar MRI is needed in order to efficiently manage low back pain and related disorders.\n\nLumbar MRI may be indicated for a patient with a \"red-flag\" condition, such as a suspected tumor, infection, herniated intervertebral disc with nerve compression, or a major neurological problem. The MRI test result may be needed to evaluate these conditions to determine the need for surgery or other aggressive therapy, such as a work-up for metastatic cancer.\n\n\"Red flags\" are identified through an appropriate history plus a physical examination that typically includes evaluating muscle strength, limb circumference, reflexes, sensation, straight leg raise, and sitting knee extension tests.\n\n\"Red flags\" include:\n\n* Major trauma\n* Minor trauma in a potentially osteoporotic patient\n* History of cancer\n* Fever\n* Chills\n* Unexplained weight loss\n* Recent bacterial infection\n* IV drug abuse\n* Immune suppression\n* Pain that worsens when supine or at night\n* Saddle anesthesia\n* Recent onset of bladder dysfunction\n* Clinically significant or progressive neurologic deficit in the lower extremity\n* Unexpected laxity of the anal sphincter\n* Perianal or perineal sensory loss,\n* Clinically significant motor weakness, or\n* Other nerve root compromise\n\nEighty (80) to ninety (90) percent of patients with low back pain improve one month after symptom onset even without treatment. Therefore, spinal imaging tests are not generally necessary during the first month of symptoms except when a \"red flag\" (suggesting a medically emergent condition) is noted on the medical history and physical examination. For a \"non-red flag\" condition, the MRI may be appropriate after 1 month of symptoms.\n\nFor example, for a patient with low back pain syndrome where there is no known injury, history of cancer, or septic disorder and there are no symptoms or signs suggesting nerve root disorder or spinal cord dysfunction (i.e. no \"red flags\"), MRI will be covered only if the patient has not responded to a reasonable trial of conservative management lasting at least four weeks.\n\nIf a patient's limitations due to low back symptoms do not improve within four weeks, findings on reassessment may reveal an indication for a MRI. However, since MRI changes are common in asymptomatic patients, MRI abnormalities alone do not retrospectively validate the need for the test without other supporting clinical rationale.\n\nA lumbar MRI used to evaluate uncomplicated degenerative disc disease or herniated nucleus pulposus is not considered medically necessary when a surgical intervention or other aggressive treatment (e.g. intervertebral joint injection) is not under consideration.\n\nWhen a lumbar MRI is ordered, Medicare expects that the information gained from the test will be used for medical decision-making. When the findings will not affect the treatment choices, the test is not reasonable or necessary.\n\nCertain uses of lumbar MRI are considered investigational and are therefore not covered by Medicare. These include the measurement of blood flow, spectroscopy, imaging of cortical bone and calcifications, and for procedures involving spatial resolution of bone or calcifications.\n\nA lumbar MRI that is a duplication of other imaging studies (such as a spinal CT scan) may be unreasonable or unnecessary. A lumbar MRI, however, could be complementary to a lumbar CT if there are inconclusive findings on a CT scan. Conversely, a lumbar CT may be warranted following an MRI study if the MRI study is found to be inconclusive. Documentation should support the medical necessity for the need for both studies.\n\nThe payment for a single lumbar MRI procedure includes two (2) and three (3) sequences.\n\nContraindications and limitations of lumbar MRI testing include:\n\n* Patients with an allergy to contrast media,\n* The effects upon a fetus are unknown at this time; therefore, pregnancy is to be handled at the discretion of the primary doctor,\n* When the technical component is performed without the professional component.\n\n(Payment paragraphs on multiple professional components and multi-position MRI omitted; they do not bear on coverage criteria.)";

 and the MRI is being considered after at least one month of symptoms. As for C1, conservative care stated only in the note, with nothing structured behind it (no therapy Procedure or medication order), or contradicted by the structured record, is labeled undeterminable.\nC3. The study will inform medical decision-making: a surgical intervention or other aggressive treatment (for example intervertebral joint injection) is under consideration, and the findings would affect treatment choices.\nC4. The study is not a duplication of other imaging (such as a spinal CT) unless documentation supports the need for both, for example inconclusive findings on the prior study.\n\nWhy C1 and C2 ask for more than the note: their note-only rules are this project's rule for automatic approval, not the policy's own wording. L34220 says red flags \"are identified through an appropriate history plus a physical examination\", which a visit note records. An agent that can only approve or route asks for a second source in the record before it approves, because the note is where an overstated claim or an embedded instruction would sit, and asking costs a reviewer's time, never a denial. For C1, a structured element is any entry in the record other than the visit note; an Observation counts whether it holds a number, a code, or text. For C2, it is a therapy Procedure or a medication order, as stated above.\n\nA case is approvable when C3 and C4 hold and either C1 or C2 holds with cited evidence. The criteria that apply to an approval are C3, C4, and whichever of C1 or C2 it rests on; the other is still labeled with its status.\n\nWhen a case is not approvable: request when one record element the provider could send would settle the question, naming the criterion and the element; route when the record contradicts itself on a criterion, even if a document could resolve it, or when the case could not be approved whatever such a document said. A status that rests on something the record does n   h+='</div><div id="gapbox" style="display:'+(r.routing==="request"?"block":"none")+'"><p class="status">For a documentation request: which criterion, and what is missing.</p><select id="gapc"><option value="">Criterion</option>'+["C1","C2","C3","C4"].map(g=>'<option'+(r.gap_criterion===g?" selected":"")+'>'+g+'</option>').join("")+'</select><div style="height:6px"></div><input type="text" id="gapm" placeholder="What is missing" value="'+esc(r.gap_missing)+'"></div></div>';
  h+='<p class="status '+(complete(c)?"ok":"warn")+'">'+(complete(c)?(storageOk?"Complete. Saved in this browser.":"Complete, but this browser is not saving it; download the labels before closing the page."):"Not complete yet. Every criterion needs a status, and a request needs its gap."+(storageOk?"":" This browser is not saving your work."))+'</p>';
  h+='<details><summary>Preview labels_blind.yaml</summary><pre>'+esc(yaml(c))+'</pre></details>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn ghost" id="prev">Previous case</button><button class="btn ghost" id="next">Next case</button></div></div>';
  document.getElementById("formcol").innerHTML=h;
  document.querySelectorAll('#formcol input[type=radio]').forEach(el=>el.onchange=()=>{ if(el.name==="routing"){ r.routing=el.value; if(el.value!=="request"){r.gap_criterion="";r.gap_missing="";} } else { r.criteria[el.name].status=el.value; } r.labeled_on=today(); save(); render(); });
  document.querySelectorAll('#formcol input[type=checkbox]').forEach(el=>el.onchange=()=>{ const x=r.criteria[el.dataset.crit]; const i=x.evidence.indexOf(el.value); if(el.checked&&i<0) x.evidence.push(el.value); if(!el.checked&&i>=0) x.evidence.splice(i,1); x.evidence.sort((a,b)=>all.indexOf(a)-all.indexOf(b)); r.labeled_on=today(); save(); render(); });
  const gc=document.getElementById("gapc"), gm=document.getElementById("gapm");
  if(gc) gc.onchange=()=>{ r.gap_criterion=gc.value; save(); renderNav(); };
  if(gm) gm.onchange=()=>{ r.gap_missing=gm.value; save(); render(); };
  document.getElementById("prev").onclick=()=>{ cur=(cur+CASES.length-1)%CASES.length; render(); window.scrollTo(0,0); };
  document.getElementById("next").onclick=()=>{ cur=(cur+1)%CASES.length; render(); window.scrollTo(0,0); };
}
function render(){ renderNav(); renderCase(); renderForm(); }
// Minimal zip writer (stored, no compression), so the page works offline with no libraries.
const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>>8)&255], u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(f=>{ const name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(local,name,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=local.length+name.length+data.length; });
  const csize=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:"application/zip"});
}
document.getElementById("zip").onclick=()=>{
  const missing=CASES.filter(v=>!complete(v.case)).map(v=>v.case.replace("case_",""));
  if(missing.length && !confirm("Not complete yet: cases "+missing.join(", ")+". Download anyway?")) return;
  const files=CASES.map(v=>({name:"data/golden/"+v.case+"/labels_blind.yaml", text:yaml(v.case)}));
  const a=document.createElement("a"); a.href=URL.createObjectURL(zip(files)); a.download="labels_blind.zip"; document.body.appendChild(a); a.click(); a.remove();
};
function refHtml(){
  const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n\s*\n/).map(p=>"<p>"+p.replace(/\n\* /g,"<br>&bull; ").replace(/^\* /,"&bull; ").replace(/\n/g,"<br>")+"</p>").join("");
  return "<h3>Criteria (EVAL_PLAN.md, Criterion inventory)</h3>"+md(CRITERIA)+"<h3>Routing (CHARTER.md, authority statement)</h3>"+md(OUTPUTS)+"<h3>Policy text, LCD L34220</h3><p class='status'>"+esc(POLICY_HEAD).replace(/\n/g,"<br>")+"</p>"+md(POLICY_BODY);
}
document.getElementById("showref").onclick=()=>{ document.getElementById("refbody").innerHTML=refHtml(); document.getElementById("refdlg").style.display="block"; };
document.getElementById("closeref").onclick=()=>{ document.getElementById("refdlg").style.display="none"; };
render();
</script>
