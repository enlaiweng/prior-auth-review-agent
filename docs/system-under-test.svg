<svg viewBox="0 0 1280 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram showing the prior-authorization agent is a five-stage pipeline: inputs, an agent block where the model is one of four sub-components, output, a grading step against a golden set, and a metrics scorecard. The model is highlighted as the only piece swapped during vendor-update re-evaluation.">
  <title>System Under Test: Prior Authorization Review Agent</title>
  <desc>The agent being evaluated is a pipeline of four parts (prompt, retrieval, model, output structuring), not the model alone. Case data and policy text feed the agent; its output is checked against a human-adjudicated golden set to produce the release metrics.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1000" fill="#ffffff"/>

  <text x="640" y="28" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">System Under Test: Prior Authorization Review Agent (Lumbar MRI, LCD L34220)</text>

  <!-- Row 1: inputs -->
  <rect x="60" y="60" width="340" height="90" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="230" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">FHIR structured data</text>
  <text x="230" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#475569">conditions, meds, procedures, demographics</text>

  <rect x="470" y="60" width="340" height="90" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="640" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">Clinical note</text>
  <text x="640" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#475569">clinician narrative; some notes carry injected text</text>

  <rect x="880" y="60" width="340" height="90" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="1050" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">Policy source</text>
  <text x="1050" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#475569">LCD L34220, chunked into citable passages</text>

  <!-- arrows into agent container -->
  <line x1="230" y1="150" x2="350" y2="240" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="150" x2="410" y2="240" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#334155">case bundle</text>

  <line x1="1050" y1="150" x2="900" y2="240" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="975" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#334155">passages</text>

  <!-- Agent container -->
  <rect x="60" y="195" width="1160" height="370" rx="10" fill="#eef2f7" stroke="#475569" stroke-width="2"/>
  <text x="640" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1e293b">THE AGENT (system under test)</text>

  <!-- Prompt / Retrieval -->
  <rect x="140" y="240" width="480" height="80" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">Prompt / instructions</text>
  <text x="380" y="295" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#475569">how C1-C4 are described to the model</text>

  <rect x="660" y="240" width="480" height="80" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="900" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">Retrieval step</text>
  <text x="900" y="295" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#475569">selects passages by criterion; cached per case</text>

  <!-- internal arrows into model -->
  <line x1="380" y1="320" x2="490" y2="360" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="320" x2="790" y2="360" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Model (highlighted swap point) -->
  <rect x="400" y="360" width="480" height="90" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="640" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#78350f">Model: Claude Sonnet 5</text>
  <text x="640" y="410" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#78350f">reasons over case + retrieved policy text</text>
  <text x="640" y="430" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#92400e">only box swapped for vendor-update re-eval</text>

  <!-- model to output structuring -->
  <line x1="640" y1="450" x2="640" y2="470" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="463" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">raw response</text>

  <!-- Output structuring -->
  <rect x="400" y="470" width="480" height="65" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="640" y="497" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">Output structuring logic</text>
  <text x="640" y="517" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#475569">turns raw response into the fixed decision schema</text>

  <!-- arrow to decision object -->
  <line x1="640" y1="535" x2="640" y2="610" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="575" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#334155">produces</text>

  <!-- Decision object (single structured output, matches ARCHITECTURE.md's schema) -->
  <rect x="60" y="610" width="1160" height="90" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="640" y="652" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">Structured decision object</text>
  <text x="640" y="678" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#475569">routing, per-criterion status, citations, missing items, confidence tier (fixed schema, validated)</text>

  <!-- arrow into comparison -->
  <line x1="640" y1="700" x2="845" y2="750" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="728" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#334155">checked against</text>

  <!-- Golden set -->
  <rect x="60" y="750" width="340" height="90" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="230" y="788" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">Golden set: adjudicated answer</text>
  <text x="230" y="812" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#475569">human ground truth (agent never sees this)</text>

  <line x1="400" y1="795" x2="470" y2="795" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="435" y="783" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#334155">ground truth</text>

  <!-- Comparison / grading (method open) -->
  <rect x="470" y="750" width="750" height="90" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="845" y="788" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">Comparison / grading step</text>
  <text x="845" y="812" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#7f1d1d">method not yet fixed: automated code check vs. a second model as judge</text>

  <!-- comparison to metrics -->
  <line x1="845" y1="840" x2="640" y2="890" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="868" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#334155">scores</text>

  <!-- Metrics scorecard -->
  <rect x="430" y="890" width="420" height="80" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.5"/>
  <text x="640" y="922" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">Metrics scorecard</text>
  <text x="640" y="944" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#166534">false approvals, citation faithfulness, agreement rates &amp; more</text>
</svg>
