# Checks the labeling page, the third reader's script, and every label file, on GitHub's computers.
# What it uses: the repository's files only. No secrets, no environment, read-only permission.
# When it runs: on every pull request, on pushes to main or a claude/ branch, and by hand.
# Three checks:
#   1. Labeling page: a simulated labeler fills two cases on eval/labeling/labeling.html and downloads the zip
#      (eval/tests/test_labeling.js). The values it picks are arbitrary test inputs, not labels.
#   2. Tests for the third reader's script and the label checker, with a fake Gemini server on the runner
#      (eval/tests/test_third_reader.py). Nothing is sent to Google. (The scoring tests run in Agent checks.)
#   3. Label files: every labels_blind.yaml, labels_gemini.yaml, and labels.yaml has the template's form and cites only
#      ids on its case page (eval/tools/check_labels.py); every labels_gemini.yaml is exactly what the third reader's
#      script writes from Gemini's saved reply (run_third_reader.py --verify), and every label file made from a labeling
#      site export is exactly what that committed export produces (labeling-site/export_to_label_files.py --verify),
#      so none can be edited by hand. On a pull
#      request, no blind or Gemini label file already on main may be changed, renamed, or deleted.
name: Checks

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labeling-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "22"
      - name: Install the pinned test tools
        run: npm ci --prefix eval/tests --no-audit --no-fund
      - name: Simulate a labeler on the labeling page
        run: node eval/tests/test_labeling.js eval/labeling/labeling.html

  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the pinned Python package
        run: python -m pip install "pyyaml==6.0.3"
      - name: Run the tests
        run: python -m unittest eval/tests/test_third_reader.py -v

  label-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the pinned Python package
        run: python -m pip install "pyyaml==6.0.3"
      - name: Check the form of every label file
        run: python3 eval/tools/check_labels.py
      - name: Check that every Gemini label file matches Gemini's saved reply
        run: python3 eval/third_reader/run_third_reader.py --verify
      - name: Check that every label file made from a labeling site export matches that export
        run: python3 labeling-site/export_to_label_files.py --verify
      - name: Check that no blind or Gemini label file already on main is changed
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/${BASE}...HEAD" -- \
            'data/golden/*/labels_blind.yaml' 'data/golden/*/labels_gemini.yaml' 'data/golden/site_exports/*.json')
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error title=Label file edited::Blind and Gemini label files, and labeling site exports, are never edited after they arrive. Final labels go in labels.yaml instead."
            exit 1
          fi
          echo "No blind or Gemini label file, or site export, on ${BASE} was changed." >> "$GITHUB_STEP_SUMMARY"
