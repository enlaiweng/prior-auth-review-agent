# Checks the public demo (demo/README.md; docs/ARCHITECTURE.md, ADR-14) on every change that could affect it.
# Nothing here touches Cloudflare or Anthropic: the tests run the real Worker in Cloudflare's local runtime against a
# fake model, and the bundle check builds the Worker without uploading it. The smoke-records job checks the owner's
# smoke test records (docs/smoke-tests/README.md) against their saved pages, and new ones against the final labels and
# the changelog.
name: Demo checks

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "demo/**"
      - "agent/**"
      - "data/golden/**"
      - "docs/EVAL_PLAN.md"
      - "eval/run_agent.mjs"
      - "eval/tools/build_case_pages.py"
      - "eval/dev_subset.txt"
      - "docs/RELEASE_DECISION.md"
      - "docs/GOVERNANCE.md"
      - ".github/workflows/demo-*.yml"
      - "docs/smoke-tests/**"
      - "docs/CHANGELOG.md"
  pull_request:
    paths:
      - "demo/**"
      - "agent/**"
      - "data/golden/**"
      - "docs/EVAL_PLAN.md"
      - "eval/run_agent.mjs"
      - "eval/tools/build_case_pages.py"
      - "eval/dev_subset.txt"
      - "docs/RELEASE_DECISION.md"
      - "docs/GOVERNANCE.md"
      - ".github/workflows/demo-*.yml"
      - "docs/smoke-tests/**"
      - "docs/CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Build the demo's content from the repository
        run: python3 demo/build_demo.py
      - name: The release gate the Demo switch uses
        run: python3 -m unittest demo/test/test_release_gate.py
      - name: Install the pinned tools
        working-directory: demo
        run: npm ci --no-audit --no-fund
      - name: The Worker builds, within Cloudflare's size limit
        working-directory: demo
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/demo-bundle" > /dev/null
          size=$(gzip -c "$RUNNER_TEMP/demo-bundle/worker.js" | wc -c)
          echo "Worker bundle: $size bytes compressed (the free plan allows 3 MB)."
          [ "$size" -lt 3000000 ] || { echo "::error title=Worker too large::$size bytes compressed"; exit 1; }
      - name: Re-deciding stored decisions, the build's refusals, every route of the Worker, and positive and negative tests of every input
        working-directory: demo
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/github-annotations.mjs --test-reporter-destination=stdout test/decide.test.mjs test/api.test.mjs test/inputs.test.mjs

  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Build the demo's content from the repository
        run: python3 demo/build_demo.py
      - name: Install the pinned tools
        working-directory: demo
        run: npm ci --no-audit --no-fund
      - name: Install the browser the pinned Playwright drives
        working-directory: demo
        run: npx playwright install --with-deps chromium
      - name: The viewer in a real browser, and a visitor's journeys end to end
        working-directory: demo
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/github-annotations.mjs --test-reporter-destination=stdout test/viewer.test.mjs test/scenarios.test.mjs

  smoke-records:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the pinned Python package
        run: python -m pip install "pyyaml==6.0.3"
      - name: Positive and negative tests of the record checker
        run: python3 -m unittest demo/test/test_smoke_records.py -v
      - name: Every smoke test record agrees with its saved page; records added here also with the final labels and the changelog
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          # Records new on this branch are checked against the repository as it is now; merged records only against
          # their own saved page, so a later change (a re-settled case, a changelog edit) never leaves one failing.
          mapfile -t added < <(git diff --name-only --diff-filter=A "origin/${BASE}...HEAD" -- 'docs/smoke-tests/*.md' ':(exclude)docs/smoke-tests/README.md')
          echo "Records new on this branch: ${added[*]:-none}"
          python3 demo/tools/check_smoke_records.py --new "${added[@]}"
      - name: No smoke test record already on main is changed
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/${BASE}...HEAD" -- 'docs/smoke-tests/*' ':(exclude)docs/smoke-tests/README.md')
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error title=Smoke test record edited::A smoke test record is never changed after it is merged. Record a later test in new files."
            exit 1
          fi
          echo "No smoke test record on ${BASE} was changed." >> "$GITHUB_STEP_SUMMARY"
