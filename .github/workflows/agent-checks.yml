# Checks the agent without calling any model, on GitHub's computers.
# What it uses: the repository's files only. No secrets, no environment, read-only permission.
# When it runs: on every pull request, on pushes to main or a claude/ branch, and by hand.
# Three checks:
#   1. The agent's tests (agent/test/): the routing rule, one scenario per rule; the note paragraphs and ids against the
#      Python that builds the case pages, on every bundle; and the module with a fake model (settings, schema output,
#      retries, failures routing). Nothing is sent to Anthropic.
#   2. The scoring script's tests (eval/tests/test_score.py), on the smoke case.
#   3. Up to date: rebuilding agent/spec.generated.js from the instructions, schema, criteria, and policy changes nothing.
name: Agent checks

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the pinned Python package
        run: python -m pip install "pyyaml==6.0.3"
      - name: Agent tests
        run: node --test 'agent/test/*.test.js'
      - name: Scoring tests
        run: python -m unittest eval/tests/test_score.py -v
      - name: The generated spec matches its sources
        run: |
          python3 eval/tools/build_agent_spec.py
          if ! git diff --quiet -- agent/spec.generated.js; then
            git diff --stat -- agent/spec.generated.js
            echo "::error title=Spec out of date::Run python3 eval/tools/build_agent_spec.py and commit agent/spec.generated.js."
            exit 1
          fi
          echo "agent/spec.generated.js matches its sources." >> "$GITHUB_STEP_SUMMARY"
