<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Case Labeling</title>
<style>
__CSS__
main.single{display:block;max-width:860px}
.btn[disabled]{opacity:.4;cursor:default}
.lead{font-size:16px}
table.cases{width:100%;border-collapse:collapse;font-size:14px}
table.cases td,table.cases th{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
table.cases th{color:var(--muted);font-weight:600;border-top:0}
.chip{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.chip.done{color:var(--ok);border-color:var(--ok)}.chip.part{color:var(--warn);border-color:var(--warn)}
.field{margin:10px 0}.field label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.check{display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-size:14px}.check input{margin-top:3px}
.err{color:var(--warn);font-size:14px}
.banner{background:var(--accent-weak);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.ro .opts label,.ro .ev label{opacity:.75}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:center;justify-content:center;padding:16px}
#modal .card{max-width:480px;width:100%}
a.btn{text-decoration:none;display:inline-block}
.jump{display:none}
@media (max-width:900px){table.cases td:nth-child(3),table.cases th:nth-child(3){display:none} header nav{display:none} .jump{display:inline-block}}
</style>
</head>
<body>
<header>
  <h1>Case Labeling</h1>
  <nav id="nav"></nav>
  <div class="tools">
    <button class="btn ghost" id="homebtn" style="display:none">Your cases</button>
    <a class="btn ghost" id="trainbtn" href="/training" target="_blank" rel="noopener" style="display:none">Training</a>
    <button class="btn ghost" id="showref" style="display:none">Policy and criteria</button>
  </div>
</header>
<main id="main" class="single"><div class="card"><p class="status">Loading...</p></div></main>
<div id="refdlg" class="card" style="display:none;position:fixed;inset:60px 16px 16px 16px;z-index:10;overflow:auto;max-width:900px;margin:0 auto">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2>Policy and criteria (reference)</h2><button class="btn ghost" id="closeref">Close</button></div>
  <div class="ref" id="refbody"></div>
</div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle" aria-describedby="mtext"><div class="card"><h2 id="mtitle"></h2><p id="mtext"></p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="mok">Submit</button><button class="btn ghost" id="mcancel">Cancel</button></div></div></div>
<script>
"use strict";
const CRIT = [["C1_red_flag","C1 red flag"],["C2_conservative_4wk","C2 conservative care, four weeks"],["C3_informs_management","C3 informs management"],["C4_no_duplicate_imaging","C4 no duplicate imaging"]];
const STATUSES = ["supported","unsupported","undeterminable"];
const ROUTES = ["approve","request","route"];
const INCOMPLETE = "Not complete yet: every criterion needs a status, the routing needs a choice, and a request needs its gap.";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const main = document.getElementById("main");
let ME = null, DATA = null, cur = null, notice = "", locking = false;
// Per case: the label as this page shows it, the server revision it was based on, and save bookkeeping.
// edit counts local changes; saved is the last change the server confirmed. A case has unsaved changes while saved < edit.
const S = {};
const OPEN = new Set();          // evidence lists the labeler has opened on the current case
let saveChain = Promise.resolve(), gapTimer = null, gapCase = null;

async function api(path, opts = {}) {
  const headers = { "X-Labeling": "1" };
  if (opts.body !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.body); }
  let r;
  try { r = await fetch(path, { credentials: "same-origin", ...opts, headers }); }
  catch (e) { const x = new Error("Couldn't reach the site. Check your internet connection."); x.status = 0; throw x; }
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(data.error || ("The site answered " + r.status + ".")); e.status = r.status; e.code = data.code; throw e; }
  return data;
}
function when(iso) { if (!iso) return ""; const d = new Date(iso); return d.toLocaleDateString(undefined, {month:"short", day:"numeric"}) + " at " + d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}); }
function blank() { const c = {}; CRIT.forEach(([k]) => c[k] = {status: "", evidence: []}); return {criteria: c, routing: "", gap_criterion: "", gap_missing: ""}; }
function complete(l) { if (!l || !l.routing) return false; for (const [k] of CRIT) if (!l.criteria[k].status) return false; if (l.routing === "request" && (!l.gap_criterion || !String(l.gap_missing).trim())) return false; return true; }
function ids(v) { const out = [v.request.id, v.patient.id]; v.sections.forEach(s => s.items.forEach(i => out.push(i.id))); out.push(v.note.id); v.note.paragraphs.forEach(p => out.push(p.id)); return out; }
function unsaved(st) { return st && !st.submitted_at && (st.saved < st.edit || !!st.error); }
function anyUnsaved() { return Object.values(S).some(unsaved) || gapCase !== null; }

function fullStop(title, text) {
  main.className = "single";
  main.innerHTML = '<div class="card"><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p></div>';
}
function signedOut() { fullStop("Please open your link again", "Your session has ended, or your link was turned off. Open the personal link you were sent; if it no longer works, ask the person who sent it for a new one."); }
function loadError(e) { if (e.status === 401) return signedOut(); fullStop("Couldn't load your cases", e.message + " Then reload this page."); }

async function start() {
  try { ME = await api("/api/me"); } catch (e) { return loadError(e); }
  if (!ME.labeler.consent_at) return showConsent();
  try { DATA = await api("/api/cases"); } catch (e) { return loadError(e); }
  document.getElementById("homebtn").style.display = document.getElementById("trainbtn").style.display = document.getElementById("showref").style.display = "";
  const want = location.hash.match(/^#case=([a-z0-9_]+)$/);
  if (want && DATA.cases.some(c => c.case === want[1])) openCase(want[1]); else showHome();
}

// ---- Welcome and consent ----
function showConsent() {
  const l = ME.labeler;
  main.className = "single";
  main.innerHTML = '<div class="card"><h2>Welcome</h2>' +
    '<p class="lead">Thank you for helping. This site collects independent labels for a research project on prior authorization for lower back MRI under the Medicare policy LCD L34220.</p>' +
    '<p>The cases are made-up patient records: no real patient is in them. For each case you check the record against four written criteria and choose an outcome. Your answers are saved as you go, and lock when you submit a case.</p>' +
    '<p>The project is public. Your submitted labels, with the name and role you give below, will be published in its public repository on GitHub and described in its datasheet. You can ask to be removed at any time: before publication your details are deleted from this site; after it, they are removed from the current files, though earlier versions stay in the repository\'s history.</p>' +
    '<div class="field"><label for="cname">Your name, as you would like to be credited</label><input type="text" id="cname" maxlength="100" value="' + esc(l.credit_name || l.invited_name || "") + '"></div>' +
    '<div class="field"><label for="crole">Your role or credentials (optional)</label><input type="text" id="crole" maxlength="150" placeholder="For example: RN, utilization review" value="' + esc(l.role || "") + '"></div>' +
    '<label class="check"><input type="checkbox" id="agree1"><span>I agree that my labels, with the name and role above, may be published in the project\'s public repository and datasheet.</span></label>' +
    '<label class="check"><input type="checkbox" id="agree2"><span>I\'ll label on my own: no AI tools on the cases, no searching for how to label a case, and no discussing a case with anyone until I\'ve submitted it. Looking up what a single medical word means is fine.</span></label>' +
    '<p class="err" id="cerr"></p><button class="btn" id="cgo">Continue</button></div>';
  document.getElementById("cgo").onclick = async () => {
    const err = document.getElementById("cerr"); err.textContent = "";
    try {
      await api("/api/consent", { method: "POST", body: { credit_name: document.getElementById("cname").value, role: document.getElementById("crole").value,
        agree_credit: document.getElementById("agree1").checked, agree_rules: document.getElementById("agree2").checked } });
      start();
    } catch (e) { if (e.status === 401) return signedOut(); err.textContent = e.message; }
  };
}

// ---- Home: the labeler's cases ----
function showHome() {
  cur = null; history.replaceState(null, "", "#");
  document.getElementById("nav").innerHTML = "";
  const l = ME.labeler;
  main.className = "single";
  let h = '<div class="card"><h2>Welcome, ' + esc(l.credit_name || l.invited_name) + '</h2>' +
    '<p>You have <b>' + ME.assignments.length + '</b> case' + (ME.assignments.length === 1 ? "" : "s") + ' to label. For each one you read the patient\'s record, answer four questions (C1 to C4) with the parts of the record your answer rests on, and choose the outcome: approve, request a document, or route to a physician.</p>' +
    '<p>Your answers save as you go; the line under the form says when. You can leave and come back with your link at any time. When a case is finished, click <b>Submit</b>; after that it is locked.</p></div>';
  h += '<div class="card"><h2>Training (optional, recommended)</h2>' +
    '<p>New to this? The training explains the policy and every medical word, then walks you through a practice case step by step and lets you try a second one on your own. It takes about two hours, opens in a new tab, and has a note at the top on which parts apply to you. Practice answers stay in your browser and are never sent here.</p>' +
    '<p><a class="btn" href="/training" target="_blank" rel="noopener">Open the training</a></p>' +
    '<label class="check"><input type="checkbox" id="trained"' + (l.training_done_at ? " checked" : "") + '><span>I\'ve done the training' + (l.training_done_at ? " (" + esc(when(l.training_done_at)) + ")" : "") + '.</span></label><p class="err" id="terr"></p></div>';
  h += '<div class="card"><h2>Your cases</h2>';
  if (!ME.assignments.length) h += '<p>No cases are assigned to you yet. You\'ll be told when they are.</p>';
  else {
    h += '<table class="cases"><tr><th>Case</th><th>Status</th><th>Last change</th><th></th></tr>';
    ME.assignments.forEach(a => {
      const chip = a.status === "submitted" ? '<span class="chip done">Submitted</span>' : a.status === "complete" ? '<span class="chip part">Ready to submit</span>' : a.status === "started" ? '<span class="chip part">Started</span>' : '<span class="chip">Not started</span>';
      h += '<tr><td><b>' + esc(a.name) + '</b></td><td>' + chip + '</td><td>' + esc(when(a.submitted_at || a.updated_at)) + '</td><td><button class="btn ghost" data-open="' + esc(a.case) + '">' + (a.status === "submitted" ? "View" : "Open") + '</button></td></tr>';
    });
    h += '</table>';
  }
  h += '</div><div class="card"><h2>If you\'re unsure</h2><p>Re-read the record and the <b>Policy and criteria</b> panel (top right), choose the answer you think fits, and move on. "Undeterminable" is a real answer when the record doesn\'t let you decide. Every disagreement between readers is talked through afterward.</p></div>';
  main.innerHTML = h;
  main.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openCase(b.dataset.open));
  document.getElementById("trained").onchange = async e => {
    try { const r = await api("/api/training", { method: "POST", body: { done: e.target.checked } }); ME.labeler.training_done_at = r.training_done_at; showHome(); }
    catch (err) { if (err.status === 401) return signedOut(); e.target.checked = !e.target.checked; document.getElementById("terr").textContent = err.message; }
  };
  window.scrollTo(0, 0);
}

// ---- One case: the record and the form ----
async function openCase(id) {
  await flush();
  const st = S[id];
  // Fetch the latest saved copy each time a case opens (it may have been reopened, or changed elsewhere),
  // unless this page holds changes for it that haven't reached the server yet.
  if (!unsaved(st)) {
    try { const r = await api("/api/labels/" + id); S[id] = { label: r.label || blank(), rev: r.rev, updated_at: r.updated_at || null, submitted_at: r.submitted_at || null, edit: 0, saved: 0, error: "" }; }
    catch (e) { if (e.status === 401) return signedOut(); notice = e.message; if (!st) return showHomeWithNotice(); }
  }
  if (cur !== id) OPEN.clear();
  cur = id; history.replaceState(null, "", "#case=" + id);
  renderCase(); renderForm(); renderNav(); window.scrollTo(0, 0);
}
function showHomeWithNotice() { showHome(); if (notice) { main.insertAdjacentHTML("afterbegin", '<div class="banner">' + esc(notice) + '</div>'); notice = ""; } }
function view() { return DATA.cases.find(c => c.case === cur); }
function renderNav() {
  const nav = document.getElementById("nav"); nav.innerHTML = "";
  DATA.cases.forEach(c => {
    const st = S[c.case], a = ME.assignments.find(x => x.case === c.case), b = document.createElement("button");
    b.textContent = c.name; b.className = (c.case === cur ? "cur " : "") + ((st && st.submitted_at) || (!st && a && a.status === "submitted") ? "done" : "");
    b.onclick = () => openCase(c.case); nav.appendChild(b);
  });
}
function renderCase() {
  const c = view(), v = c.view;
  main.className = "";
  let h = '<section id="casecol"><div class="card"><h2>' + esc(c.name) + '</h2><p class="jump"><button class="btn ghost" id="toform">Go to the form</button></p>';
  h += '<p><code class="id">' + esc(v.request.id) + '</code> ' + esc(v.request.text) + '. Requested on ' + esc(v.request.date) + '.</p>';
  h += '<p><code class="id">' + esc(v.patient.id) + '</code> ' + esc(v.patient.text) + '.</p></div>';
  v.sections.forEach(s => { h += '<div class="card"><h3>' + esc(s.title) + '</h3><ul class="items">'; s.items.forEach(i => { h += '<li><code class="id">' + esc(i.id) + '</code> ' + esc(i.text) + '</li>'; }); h += '</ul></div>'; });
  h += '<div class="card"><h3>Visit note</h3><p class="status"><code class="id">' + esc(v.note.id) + '</code> dated ' + esc(v.note.date) + '</p>';
  v.note.paragraphs.forEach(p => { h += '<p class="para"><code class="id">' + esc(p.id) + '</code> ' + esc(p.text) + '</p>'; });
  h += '</div></section><section class="side" id="formcol"></section>';
  main.innerHTML = h;
  document.getElementById("toform").onclick = () => document.getElementById("formcol").scrollIntoView();
}
function stateText(st) {
  if (st.error) return { cls: "warn", text: st.error };
  const base = complete(st.label) ? "Complete. " : INCOMPLETE + " ";
  if (st.saved < st.edit || (gapCase !== null && S[gapCase] === st)) return { cls: complete(st.label) ? "ok" : "warn", text: base + "Saving..." };
  return { cls: complete(st.label) ? "ok" : "warn", text: base + (st.updated_at ? "Saved " + when(st.updated_at) + "." : "") };
}
function renderForm() {
  const c = view(), st = S[cur], l = st.label, locked = !!st.submitted_at, all = ids(c.view);
  const side = document.getElementById("formcol"), keep = side.scrollTop;
  // Remember which control had the keyboard focus, to put it back after redrawing.
  const a = document.activeElement, focusKey = a && side.contains(a) ? (a.id ? "#" + a.id : a.name ? 'input[name="' + a.name + '"][value="' + a.value + '"]' : a.dataset.crit ? 'input[data-crit="' + a.dataset.crit + '"][value="' + CSS.escape(a.value) + '"]' : "") : "";
  const dis = locked || locking ? " disabled" : "";
  let h = '<div class="card' + (locked ? " ro" : "") + '"><h2>Your labels, ' + esc(c.name) + '</h2>';
  if (notice) { h += '<div class="banner">' + esc(notice) + '</div>'; notice = ""; }
  h += '<p class="status">' + esc(DATA.legend) + '</p>';
  CRIT.forEach(([k, label]) => { const x = l.criteria[k];
    h += '<div class="crit"><div class="name">' + esc(label) + '</div><div class="opts">';
    STATUSES.forEach(s => { h += '<label><input type="radio" name="' + k + '" value="' + s + '"' + (x.status === s ? " checked" : "") + dis + '> ' + s + '</label>'; });
    h += '</div><details data-k="' + k + '"' + (x.evidence.length || OPEN.has(k) ? " open" : "") + '><summary>Evidence (' + x.evidence.length + ' selected)</summary><div class="ev">';
    all.forEach(id => { const on = x.evidence.includes(id); h += '<label class="' + (on ? "on" : "") + '"><input type="checkbox" data-crit="' + k + '" value="' + esc(id) + '"' + (on ? " checked" : "") + dis + '>' + esc(id) + '</label>'; });
    h += '</div></details></div>'; });
  h += '<div class="crit"><div class="name">Routing</div><div class="opts">';
  ROUTES.forEach(s => { h += '<label><input type="radio" name="routing" value="' + s + '"' + (l.routing === s ? " checked" : "") + dis + '> ' + s + '</label>'; });
  h += '</div><div id="gapbox" style="display:' + (l.routing === "request" ? "block" : "none") + '"><p class="status">For a documentation request: which criterion, and what is missing.</p><select id="gapc"' + dis + '><option value="">Criterion</option>' +
    ["C1","C2","C3","C4"].map(g => '<option' + (l.gap_criterion === g ? " selected" : "") + '>' + g + '</option>').join("") + '</select><div style="height:6px"></div><input type="text" id="gapm" maxlength="500" placeholder="What is missing" value="' + esc(l.gap_missing) + '"' + dis + '></div></div>';
  if (locked) h += '<p class="status ok">Submitted ' + esc(when(st.submitted_at)) + '. This case is locked.</p>';
  else {
    const s = stateText(st);
    h += '<p class="status ' + s.cls + '" id="state">' + esc(s.text) + '</p><div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn" id="submit"' + (complete(l) && !locking && !st.error ? "" : " disabled") + '>' + (locking ? "Submitting..." : "Submit this case") + '</button>' +
      (st.error ? '<button class="btn ghost" id="retry">Try saving again</button>' : "") + '</div>';
  }
  const i = DATA.cases.findIndex(x => x.case === cur);
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost" id="back">Your cases</button>' +
    (i > 0 ? '<button class="btn ghost" id="prev">Previous case</button>' : "") + (i < DATA.cases.length - 1 ? '<button class="btn ghost" id="next">Next case</button>' : "") + '</div></div>';
  side.innerHTML = h; side.scrollTop = keep;
  if (focusKey) { const f = side.querySelector(focusKey); if (f && !f.disabled) f.focus({ preventScroll: true }); }
  document.getElementById("back").onclick = () => refreshHome();
  if (i > 0) document.getElementById("prev").onclick = () => openCase(DATA.cases[i - 1].case);
  if (i < DATA.cases.length - 1) document.getElementById("next").onclick = () => openCase(DATA.cases[i + 1].case);
  side.querySelectorAll("details[data-k]").forEach(d => d.ontoggle = () => { if (d.open) OPEN.add(d.dataset.k); else OPEN.delete(d.dataset.k); });
  if (locked || locking) return;
  const id = cur;
  side.querySelectorAll("input[type=radio]").forEach(el => el.onchange = () => {
    if (el.name === "routing") { l.routing = el.value; if (el.value !== "request") { l.gap_criterion = ""; l.gap_missing = ""; } }
    else l.criteria[el.name].status = el.value;
    changed(id); });
  side.querySelectorAll("input[type=checkbox]").forEach(el => el.onchange = () => {
    const x = l.criteria[el.dataset.crit], j = x.evidence.indexOf(el.value);
    if (el.checked && j < 0) x.evidence.push(el.value); if (!el.checked && j >= 0) x.evidence.splice(j, 1);
    x.evidence.sort((a, b) => all.indexOf(a) - all.indexOf(b)); changed(id); });
  const gc = document.getElementById("gapc"), gm = document.getElementById("gapm");
  if (gc) gc.onchange = () => { l.gap_criterion = gc.value; changed(id); };
  // Typing waits for a pause before saving; the case is fixed now, so a late save always goes to this case.
  if (gm) gm.oninput = () => { l.gap_missing = gm.value; clearTimeout(gapTimer); gapCase = id; gapTimer = setTimeout(() => { gapCase = null; markAndQueue(id); if (id === cur) setState(); }, 700); setState(); };
  const retry = document.getElementById("retry"); if (retry) retry.onclick = () => { markAndQueue(id); renderForm(); };
  document.getElementById("submit").onclick = () => modal("Submit " + c.name + "?", "After you submit, this case is locked and your answers can't be changed. If you need to change something later, ask the person who invited you.", doSubmit);
}
function setState() {
  const el = document.getElementById("state"), b = document.getElementById("submit"), st = S[cur];
  if (!el || !st) return;
  const s = stateText(st); el.className = "status " + s.cls; el.textContent = s.text;
  if (b) b.disabled = !complete(st.label) || locking || !!st.error;
}

// ---- Saving ----
// Every change counts as an edit and queues a save. Saves go one at a time, in order, each carrying the revision it
// was based on, so the server refuses a save made from an out-of-date copy instead of losing someone's newer answers.
function changed(id) { markAndQueue(id); if (id === cur) renderForm(); }
function markAndQueue(id) { S[id].edit++; S[id].error = ""; return queueSave(id); }
function queueSave(id) { saveChain = saveChain.then(() => pushSave(id)); return saveChain; }
async function pushSave(id) {
  const st = S[id];
  if (!st || st.submitted_at || st.saved >= st.edit) return;
  for (let attempt = 0; attempt < 3; attempt++) {
    const seq = st.edit;
    try {
      const r = await api("/api/labels/" + id, { method: "PUT", body: { label: JSON.parse(JSON.stringify(st.label)), rev: st.rev, content_sha: DATA.content_sha } });
      st.rev = r.rev; st.updated_at = r.updated_at; st.saved = Math.max(st.saved, seq); st.error = "";
      if (id === cur) setState();
      return;   // a change made while this one was saving has its own save queued behind it
    } catch (e) {
      if (e.status === 401) { st.error = "Not saved: your link was turned off or your session ended. Open your link again; this change will need to be made again."; if (id === cur) setState(); return; }
      if (e.status === 409) return conflict(id, e);
      if (e.status === 400) { st.error = "Not saved: " + e.message; if (id === cur) renderForm(); return; }
      st.error = "Not saved yet: " + e.message + " Trying again..."; if (id === cur) setState();
      await sleep(1500 * (attempt + 1));
    }
  }
  st.error = "Not saved: couldn't reach the site. Your answers are still on this page. Click \"Try saving again\" when you're back online.";
  if (id === cur) renderForm();
}
async function conflict(id, e) {
  if (e.code === "content_changed") { S[id].error = e.message; if (id === cur) renderForm(); return; }
  // Changed in another tab or device, or already submitted: show what the server holds now.
  try {
    const r = await api("/api/labels/" + id);
    S[id] = { label: r.label || blank(), rev: r.rev, updated_at: r.updated_at || null, submitted_at: r.submitted_at || null, edit: 0, saved: 0, error: "" };
    notice = e.code === "submitted" ? "This case was already submitted, in another tab or on another device. It now shows what was submitted."
      : "This case was changed in another tab or on another device. It now shows the latest saved answers; please check them, then carry on.";
  } catch (x) { S[id].error = "Not saved: " + e.message; }
  if (id === cur) renderForm();
}
// Saves anything still waiting (typing included) and resolves when every save has finished.
function flush() {
  if (gapCase !== null) { clearTimeout(gapTimer); const id = gapCase; gapCase = null; markAndQueue(id); }
  return saveChain;
}
window.addEventListener("beforeunload", e => { if (anyUnsaved()) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("pagehide", () => {
  // Best effort when the tab closes: send the current case's waiting change.
  const st = cur ? S[cur] : null;
  if (!st) return;   // no case open (the home page): nothing to send
  if (gapCase === cur) { clearTimeout(gapTimer); gapCase = null; st.edit++; }
  if (st.submitted_at || st.saved >= st.edit) return;
  try { fetch("/api/labels/" + cur, { method: "PUT", keepalive: true, credentials: "same-origin", headers: { "X-Labeling": "1", "Content-Type": "application/json" },
    body: JSON.stringify({ label: st.label, rev: st.rev, content_sha: DATA.content_sha }) }); } catch (e) {}
});

// ---- Submitting ----
// The submit carries the label exactly as the page shows it, so what is locked is what the labeler saw.
async function doSubmit() {
  const id = cur;
  locking = true; renderForm();
  await flush();
  const st = S[id];
  if (st.error || st.saved < st.edit) { locking = false; renderForm(); return modal("Not submitted", "Your latest change isn't saved yet, so the case wasn't submitted. Check the message under the form, then try again.", null); }
  try {
    const r = await api("/api/labels/" + id + "/submit", { method: "POST", body: { label: st.label, rev: st.rev, content_sha: DATA.content_sha } });
    Object.assign(st, { label: r.label, rev: r.rev, updated_at: r.updated_at, submitted_at: r.submitted_at, error: "" });
  } catch (e) {
    locking = false;
    if (e.status === 401) { st.error = "Not submitted: your link was turned off or your session ended. Open your link again."; renderForm(); return; }
    if (e.status === 409) return conflict(id, e);
    renderForm(); return modal("Not submitted", e.message, null);
  }
  locking = false; renderForm();
  try { ME = await api("/api/me"); } catch (e) {}
  renderNav();
}
async function refreshHome() {
  await flush();
  try { ME = await api("/api/me"); } catch (e) { return loadError(e); }
  showHomeWithNotice();
}

// A question over the page. It takes the keyboard focus (on its main button), keeps Tab inside it, closes with Escape,
// and gives the focus back to where it was.
function modal(title, text, onOk) {
  const m = document.getElementById("modal"), back = document.activeElement;
  document.getElementById("mtitle").textContent = title; document.getElementById("mtext").textContent = text;
  const ok = document.getElementById("mok"), cancel = document.getElementById("mcancel");
  ok.style.display = onOk ? "" : "none"; cancel.textContent = onOk ? "Cancel" : "Close";
  m.style.display = "flex";
  const keys = e => {
    if (e.key === "Escape") { e.preventDefault(); close(); }
    if (e.key === "Tab") { const b = [ok, cancel].filter(x => x.style.display !== "none"); const i = b.indexOf(document.activeElement); e.preventDefault(); b[(i + (e.shiftKey ? b.length - 1 : 1)) % b.length].focus(); }
  };
  function close() { m.style.display = "none"; document.removeEventListener("keydown", keys, true); if (back && document.contains(back)) back.focus(); }
  document.addEventListener("keydown", keys, true);
  ok.onclick = () => { close(); onOk(); };
  cancel.onclick = close;
  (onOk ? ok : cancel).focus();
}
function refHtml() {
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split(/\n\s*\n/).map(p => "<p>" + p.replace(/\n\* /g, "<br>&bull; ").replace(/^\* /, "&bull; ").replace(/\n/g, "<br>") + "</p>").join("");
  return "<h3>Criteria</h3>" + md(DATA.criteria) + "<h3>Routing outcomes</h3>" + md(DATA.outputs) + "<h3>Policy text, LCD L34220</h3><p class='status'>" + esc(DATA.policy_head).replace(/\n/g, "<br>") + "</p>" + md(DATA.policy_body);
}
document.getElementById("showref").onclick = () => { document.getElementById("refbody").innerHTML = refHtml(); document.getElementById("refdlg").style.display = "block"; };
document.getElementById("closeref").onclick = () => { document.getElementById("refdlg").style.display = "none"; };
document.getElementById("homebtn").onclick = () => refreshHome();
start();
</script>
