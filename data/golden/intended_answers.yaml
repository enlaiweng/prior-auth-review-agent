    flags: {dev_subset: false, held_out: true, adversarial: false, instruction_in_note: false, conflict_note_vs_structured: false, pair_source: null}
    criteria:
      C1_red_flag:             {status: unsupported, evidence: [Observation/case10-obs-01, note:p4, note:p5]}
      C2_conservative_4wk:     {status: supported, evidence: [Procedure/case10-pt-01, MedicationRequest/case10-med-01, note:p4]}
      C3_informs_management:   {status: supported, evidence: [Encounter/case10-enc-03, note:p7]}
      C4_no_duplicate_imaging: {status: undeterminable, evidence: [Procedure/case10-img-01, Encounter/case10-enc-01]}
    expected_routing: request
    named_gap: {criterion: C4, missing: "the result of the lumbar CT of 2026-04-15 and why an MRI is needed in addition to it"}
