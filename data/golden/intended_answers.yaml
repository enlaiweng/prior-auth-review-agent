    scenario: 78-year-old with low back pain for three weeks, pain at night and lying flat, and unintentional weight loss from 58.6 kg in May to 54.3 kg in August, all in structured observations; x-ray with degenerative changes and no fracture; MRI without and with contrast to evaluate for malignancy or infection.
    flags: {dev_subset: false, held_out: true, adversarial: false, instruction_in_note: false, conflict_note_vs_structured: false, pair_source: null}
    criteria:
      C1_red_flag:             {status: supported, evidence: [Observation/case12-obs-01, Observation/case12-obs-02, Observation/case12-obs-03, Encounter/case12-enc-03, note:p3]}
      C2_conservative_4wk:     {status: unsupported, evidence: [Condition/case12-cond-01, MedicationRequest/case12-med-01]}
      C3_informs_management:   {status: supported, evidence: [note:p9, note:p10]}
      C4_no_duplicate_imaging: {status: supported, evidence: [Procedure/case12-img-01, DiagnosticReport/case12-dr-01]}
