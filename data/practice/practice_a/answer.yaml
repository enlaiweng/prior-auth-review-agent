# Worked answer for a practice case (not part of the golden set). Written from the criteria in
# docs/EVAL_PLAN.md and the routing in docs/CHARTER.md only. The training page shows it after you check.
case_id: practice_a
criteria:
  C1_red_flag:
    status: unsupported
    evidence: [Observation/practicea-obs-01]
    also_fine: [note:p1, note:p3, note:p4]
    why: >-
      The only red-flag question this record raises is the leg pain. The policy's list has nerve items, and this
      project reads them as objective signs in the record: clinically significant or progressive weakness, a reduced
      or absent reflex, sensory loss in a nerve root pattern, new bladder or bowel trouble, or saddle or perianal
      numbness. The exam (Observation/practicea-obs-01) shows full strength, normal reflexes, and normal sensation.
      Pain running down the leg and a positive straight leg raise do not count on their own, so the case is assessed
      under C2 instead. Nothing else on the list appears anywhere: no injury, no cancer, no fever, no infection.
      High blood pressure and hip arthritis are in the Conditions list, but neither is on the policy's list.
      Evidence: the exam, because it is what shows the leg findings fall short. Ticking note:p1 (where the note
      rules out fever, weight loss, and cancer) is fine too.
  C2_conservative_4wk:
    status: supported
    evidence: [Procedure/practicea-pt-01, MedicationRequest/practicea-med-01, Encounter/practicea-enc-04]
    also_fine: [note:p2, Condition/practicea-cond-01, Encounter/practicea-enc-03]
    why: >-
      C2 needs three things. Conservative care for at least four weeks, in a structured entry: physical therapy from
      June 23 to August 11 is seven weeks (Procedure/practicea-pt-01), and the muscle relaxant order runs four weeks
      (MedicationRequest/practicea-med-01). No response: the August 17 visit says the leg pain persists after the
      therapy course (Encounter/practicea-enc-04). At least a month of symptoms before the MRI: pain since June 4
      (the low back pain Condition) and a request on August 19, about eleven weeks. The note's treatment paragraph
      (note:p2) says the same things and is fine to tick, but by itself it could not carry C2.
  C3_informs_management:
    status: supported
    evidence: [Encounter/practicea-enc-04, note:p5]
    also_fine: [note:p4]
    why: >-
      C3 needs a surgery or other aggressive treatment under consideration, and an MRI result that would change the
      choice. The August 17 visit refers him for a lumbar epidural steroid injection, an injection like the policy's
      own example, and the plan (note:p5) says the MRI will find the level and side for it. For C3 and C4 the note
      counts as evidence on its own; the note-only rule is only for C1 and C2.
  C4_no_duplicate_imaging:
    status: supported
    evidence: []
    also_fine: []
    why: >-
      There is no earlier lumbar imaging anywhere in the record: no Imaging reports section and no imaging in
      Procedures. The status rests on something the record does not contain, so evidence stays empty, as the legend
      on the form says.
expected_routing: approve
named_gap: null
routing_why: >-
  An approval needs C3 and C4, plus either C1 or C2, each backed by cited evidence. Here C2, C3, and C4 are all
  supported. C1 being unsupported is fine: a case needs a red flag or a failed four-week trial, not both.
lesson: >-
  Leg pain and a positive straight leg raise are not red flags on their own. For C2, count the weeks from the dates in
  the structured entries. For C4, empty evidence is right when there is no earlier imaging.
