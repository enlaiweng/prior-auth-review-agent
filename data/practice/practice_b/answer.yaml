# Worked answer for a practice case (not part of the golden set). Written from the criteria in
# docs/EVAL_PLAN.md and the routing in docs/CHARTER.md only. The training page shows it after you check.
case_id: practice_b
criteria:
  C1_red_flag:
    status: undeterminable
    evidence: [note:p2]
    also_fine: [Observation/practiceb-obs-01, note:p1]
    why: >-
      A recent bacterial infection is on the policy's list, and note:p2 says he was treated for a urinary tract
      infection in late July and finished antibiotics on August 4. It is recent (about two weeks before this visit) and
      bacterial (treated with antibiotics). But it appears only in the visit note: there is no
      Condition for the infection, no antibiotic order, and nothing else in the record behind it. The criteria say a
      red flag stated only in the note, with nothing structured behind it, is labeled undeterminable, and it can't
      carry an approval. The thigh heaviness with walking is not a red flag, because the exam shows full strength, normal
      reflexes, and normal sensation. Evidence: note:p2, the paragraph where the red flag is stated.
  C2_conservative_4wk:
    status: supported
    evidence: [Procedure/practiceb-pt-01, Encounter/practiceb-enc-03]
    also_fine: [note:p3, Condition/practiceb-cond-01, Encounter/practiceb-enc-02]
    why: >-
      Physical therapy from June 22 to August 10 is seven weeks (Procedure/practiceb-pt-01). The August 18 visit says
      the symptoms are unchanged after it (Encounter/practiceb-enc-03). Symptoms since May 18, about three months
      before the request. C2 gets its own status even though C1 has a problem: every criterion is labeled on its own
      terms.
  C3_informs_management:
    status: supported
    evidence: [Encounter/practiceb-enc-03, note:p5]
    also_fine: []
    why: >-
      He is referred to spine surgery to discuss a decompression, so surgery is under consideration, and the
      assessment and plan (note:p5) say the MRI will look for narrowing of the spinal canal and its level before that
      visit, which is what decides whether and where surgery could help.
  C4_no_duplicate_imaging:
    status: supported
    evidence: []
    also_fine: []
    why: >-
      No earlier lumbar imaging anywhere in the record, so the status rests on what the record does not contain and
      evidence stays empty.
expected_routing: approve
named_gap: null
routing_why: >-
  An approval needs C3 and C4, plus C1 or C2 with cited evidence. C2, C3, and C4 are all supported, and C2 rests on
  the physical therapy record (Procedure/practiceb-pt-01), not on the note, so the case is approved. C1 is
  undeterminable, so it can't be what the approval rests on, but a red flag stated only in the note doesn't stop an
  approval that C2 carries. This matches how a clinician doing prior authorization would read the case. If C2 had
  fallen short as well, the possible
  red flag would have sent the case to a physician (routing question 2), not to a request for the urgent care record.
lesson: >-
  Check every note paragraph against the red-flag list, including ones that read like background. A red flag that
  appears only in the note makes C1 undeterminable: it can't carry an approval. It doesn't block one that C2 carries,
  though, so a case like this one is approved on C2.
