# Worked answer for a practice case (not part of the golden set). Written from the criteria in
# docs/EVAL_PLAN.md and the routing in docs/CHARTER.md only. The training page shows it after you check.
case_id: practice_b
criteria:
  C1_red_flag:
    status: undeterminable
    evidence: [note:p2]
    also_fine: [Observation/practiceb-obs-01, note:p1]
    why: >-
      A recent bacterial infection is on the policy's list, and note:p2 says he was treated for a urinary tract
      infection in late July and finished antibiotics on August 4. But it appears only in the visit note: there is no
      Condition for the infection, no antibiotic order, and nothing else in the record behind it. The criteria say a
      red flag stated only in the note, with nothing structured behind it, is labeled undeterminable, and the case
      routes. Two things here are not red flags. The thigh heaviness with walking is not, because the exam shows full
      strength, normal reflexes, and normal sensation. Diabetes is not, because it is in the Conditions list but not
      on the policy's list. Evidence: note:p2, the paragraph where the red flag is stated.
  C2_conservative_4wk:
    status: supported
    evidence: [Procedure/practiceb-pt-01, MedicationRequest/practiceb-med-01, Encounter/practiceb-enc-04]
    also_fine: [note:p3, Condition/practiceb-cond-01, Encounter/practiceb-enc-02, Encounter/practiceb-enc-03]
    why: >-
      Physical therapy from June 22 to August 10 is seven weeks (Procedure/practiceb-pt-01), and acetaminophen has
      been ordered since May 19 (MedicationRequest/practiceb-med-01). The August 18 visit says the symptoms persist
      after therapy (Encounter/practiceb-enc-04). Symptoms since May 18, about three months before the request. C2
      gets its own status even though C1 has a problem: every criterion is labeled on its own terms.
  C3_informs_management:
    status: supported
    evidence: [Encounter/practiceb-enc-04, note:p6]
    also_fine: [note:p5]
    why: >-
      He is referred to spine surgery to discuss a decompression, so surgery is under consideration, and the plan
      (note:p6) says the MRI will look for narrowing of the spinal canal and its level before that visit, which is what
      decides whether and where surgery could help.
  C4_no_duplicate_imaging:
    status: supported
    evidence: []
    also_fine: []
    why: >-
      No earlier lumbar imaging anywhere in the record, so the status rests on what the record does not contain and
      evidence stays empty.
expected_routing: route
named_gap: null
routing_why: >-
  C2, C3, and C4 would support an approval, which is exactly why this case is worth practicing. The criteria say that
  when a red flag is stated only in the note, the case routes. It is not a request either. You might think of asking
  for the urgent care record, but the rule settles it, for a reason that is part of the tool's design: a possible red
  flag is something a person should look at, not something the tool waits on paperwork for.
lesson: >-
  Check every note paragraph against the red-flag list, including ones that read like background. A red flag that
  appears only in the note makes C1 undeterminable and sends the case to a physician, even when everything else is in
  order.
